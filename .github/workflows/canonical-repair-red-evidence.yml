name: Canonical repair red evidence (temporary)

# TEMPORARY evidence lane for PR #116 reviewer point 2, which requires
# before-the-fix results on all seven configured OS/Python pairs. It checks out
# the pre-fix handshake revision from PR #107, keeps this pull request's
# regression tests, and records where each of those tests fails. Nothing on
# `main` invokes this workflow: it runs only on an explicit manual dispatch, and
# it is removed from the pull request before the final head.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-repair-red:
    name: Canonical repair red / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Revert only the handshake conditional to the pre-fix form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "windows/BirkinNativeApp/src/Birkin.Native.Protocol/Messaging/NativeHandshake.cs"
          )
          text = path.read_text(encoding="utf-8")
          fixed = """                // Canonical repair needs a replacement snapshot, not
                // contiguous retained-event replay: a null identity makes
                // the server choose its snapshot branch at any cursor.
                ("known_instance_id", subscription.IsCanonicalRepair || subscription.KnownInstanceId is null
                    ? NativeJsonNull.Value
                    : new NativeJsonString(subscription.KnownInstanceId)),"""
          pre_fix = """                ("known_instance_id", subscription.KnownInstanceId is null
                    ? NativeJsonNull.Value
                    : new NativeJsonString(subscription.KnownInstanceId)),"""
          if fixed not in text:
              raise SystemExit("pre-fix revert target was not found")
          path.write_text(text.replace(fixed, pre_fix), encoding="utf-8")
          print("reverted the handshake conditional to the pre-fix form")
          PY
      - name: Record the measured revision and versions
        shell: bash
        run: |
          echo "measured revision: $(git rev-parse HEAD)"
          git diff --stat
          dotnet --version
          python --version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen --python "${{ matrix.python }}" --all-extras --all-groups
      - run: dotnet restore windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj
      - name: Unit regression rows on the pre-fix handshake
        shell: bash
        run: |
          set +e
          dotnet test windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj \
            -c Release --no-restore \
            --filter "FullyQualifiedName~Birkin.Native.Protocol.Tests.Messaging.NativeHandshakeTests" \
            --logger "trx;LogFileName=handshake-red.trx" \
            --results-directory TestResults/red
          echo "handshake-filter exit: $?"
      - name: Real-bridge regressions on the pre-fix handshake
        shell: bash
        run: |
          set +e
          dotnet test windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj \
            -c Release --no-restore \
            --filter "FullyQualifiedName~Birkin.Native.Protocol.Tests.Transport.CanonicalRepairBridgeIntegrationTests" \
            --logger "trx;LogFileName=canonical-repair-red.trx" \
            --results-directory TestResults/red
          echo "canonical-repair-filter exit: $?"
      - name: Summarize the pre-fix failure locations
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          for path in sorted(Path("TestResults/red").glob("*.trx")):
              root = ET.parse(path).getroot()
              definitions = {
                  definition.get("id"): definition.find(
                      f"{{{namespace}}}TestMethod"
                  ).get("className") + "." + definition.find(
                      f"{{{namespace}}}TestMethod"
                  ).get("name")
                  for definition in root.findall(
                      f".//{{{namespace}}}TestDefinitions/{{{namespace}}}UnitTest"
                  )
              }
              print(f"--- {path.name} ---")
              for result in root.findall(
                  f".//{{{namespace}}}Results/{{{namespace}}}UnitTestResult"
              ):
                  name = definitions.get(result.get("testId"))
                  outcome = result.get("outcome")
                  message = (result.find(f"{{{namespace}}}Output/{{{namespace}}}ErrorInfo/{{{namespace}}}Message") or ET.Element("m")).text or ""
                  print(f"{outcome}: {name}")
                  print("   " + " ".join(message.split())[:400])
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-repair-red-${{ matrix.os }}-${{ matrix.python }}
          path: TestResults/red
          if-no-files-found: warn
          retention-days: 14
