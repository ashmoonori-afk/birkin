name: Office tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: office-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  office-core:
    name: Office core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize locked Office environment
        run: >-
          uv sync --locked --extra dev --extra office --extra office-advanced
          && uv pip install PyYAML==6.0.3
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q birkin
      - name: Run objective Office suite
        run: >-
          uv run --no-sync python -m pytest -p no:cacheprovider -o addopts= -q
          tests/office tests/test_document_tools.py
      - name: Run focused package and process security tests
        run: >-
          uv run --no-sync python -m pytest -p no:cacheprovider -o addopts= -q
          tests/office/test_office_package.py
          tests/office/test_package_boundaries.py
          tests/office/test_package_resource_boundaries.py
          tests/office/test_handoc_process_boundaries.py
      - name: Validate Office skill contracts
        run: >-
          uv run --no-sync python -m pytest -p no:cacheprovider -o addopts= -q
          tests/test_office_skill.py
      - name: Validate bundled skills through the CLI
        run: uv run --no-sync python -m birkin skills validate
      - name: Dogfood Office Work OS in the project environment
        run: |
          uv run --no-sync python -c "from pathlib import Path; Path('office-ci-evidence').mkdir(exist_ok=True)"
          uv run --no-sync python script/qa/office_work_os_dogfood.py --output-dir office-ci-work > office-ci-evidence/dogfood.json
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Smoke test a clean wheel install
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import textwrap

          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          wheel_requirement = f"birkin[office,office-advanced] @ {wheel.as_uri()}"
          outside = pathlib.Path(os.environ["RUNNER_TEMP"]) / "office-wheel-outside"
          outside.mkdir(exist_ok=True)
          smoke = outside / "office-wheel-smoke"
          environment = os.environ.copy()
          environment.pop("PYTHONPATH", None)
          subprocess.run(
              ["uv", "venv", "--python", sys.executable, str(smoke)],
              cwd=outside,
              env=environment,
              check=True,
          )
          subprocess.run(
              ["uv", "pip", "install", "--python", str(smoke), wheel_requirement],
              cwd=outside,
              env=environment,
              check=True,
          )
          executable = smoke / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          probe = textwrap.dedent("""
          import hashlib
          import importlib.resources
          import pathlib
          import birkin
          import birkin.office
          from birkin import config
          from birkin.office.service_workspace import DocumentWorkspace
          from birkin.skills.loader import discover

          checkout = pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"]).resolve()
          assert not pathlib.Path(birkin.__file__).resolve().is_relative_to(checkout)
          roots = [path for path in config.bundled_skills_dirs() if path.name == "_bundled_skills"]
          assert len(roots) == 1
          bundled = roots[0]
          skills = discover([(bundled, "bundled")])
          required = {
              "office-work-os",
              "office-documents",
              "word-documents",
              "spreadsheets",
              "presentations",
              "pdf-documents",
              "korean-hwp-documents",
          }
          assert required <= skills.keys()
          assert all(skills[name].path.is_file() and skills[name].path.is_relative_to(bundled) for name in required)
          office_resources = importlib.resources.files("birkin.office")
          assert office_resources.joinpath("adapters", "provenance_manifest.json").is_file()

          workspace = DocumentWorkspace(pathlib.Path.cwd() / "office-smoke-home")
          output = workspace.output_path("installed-office.txt", ".txt")
          def write(target):
              target.write_text("installed Office", encoding="utf-8")
          digest = workspace.atomic_publish(output, write)
          assert digest == hashlib.sha256(b"installed Office").hexdigest()
          reference = {"uri": str(output), "content_hash": digest}
          assert workspace.resolve_artifact(reference) == output
          """)
          subprocess.run(
              [str(executable), "-c", probe],
              cwd=outside,
              env=environment,
              check=True,
          )
      - name: Upload bounded dogfood receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: office-dogfood-${{ matrix.os }}
          path: office-ci-evidence/dogfood.json
          if-no-files-found: error
          retention-days: 7

  office-real:
    name: Optional real Office / LibreOffice
    if: >-
      vars.OFFICE_REAL_RUNNER != '' &&
      vars.OFFICE_REAL_ENGINE == 'libreoffice'
    runs-on:
      - self-hosted
      - ${{ vars.OFFICE_REAL_RUNNER }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      OFFICE_LIBREOFFICE_PATH: ${{ vars.OFFICE_LIBREOFFICE_PATH }}
      OFFICE_LIBREOFFICE_VERSION: ${{ vars.OFFICE_LIBREOFFICE_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize locked Office environment
        run: uv sync --locked --extra office --extra office-advanced
      - name: Exercise approved version-pinned real Office engine
        shell: uv run --no-sync python {0}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys

          evidence = pathlib.Path("office-real-evidence")
          evidence.mkdir(exist_ok=True)
          status_file = evidence / "status.json"
          records = {
              "gui": {"status": "unavailable", "reason": "headless runner"},
              "hwp": {"status": "unavailable", "reason": "no approved HWP harness"},
          }

          def fail(reason, **details):
              records["libreoffice"] = {"status": "failed", "reason": reason, **details}
              status_file.write_text(json.dumps(records, sort_keys=True), encoding="utf-8")
              raise SystemExit(1)

          configured = os.environ.get("OFFICE_LIBREOFFICE_PATH", "").strip()
          engine = configured or shutil.which("libreoffice") or shutil.which("soffice")
          approved_names = {"libreoffice", "libreoffice.exe", "soffice", "soffice.exe"}
          if (
              not engine
              or pathlib.Path(engine).name.lower() not in approved_names
              or not pathlib.Path(engine).is_file()
          ):
              fail("approved_executable_not_present")

          expected_version = os.environ.get("OFFICE_LIBREOFFICE_VERSION", "").strip()
          if not expected_version:
              fail("approved_engine_version_unpinned")
          version_result = subprocess.run(
              [engine, "--version"],
              capture_output=True,
              text=True,
              timeout=30,
          )
          version_output = f"{version_result.stdout}\n{version_result.stderr}".strip()
          actual_version = next(
              (token for token in version_output.split() if token[:1].isdigit()),
              "",
          )
          if version_result.returncode != 0 or actual_version != expected_version:
              fail(
                  "approved_engine_version_mismatch",
                  expected_version=expected_version,
                  actual_version=actual_version,
              )

          work = pathlib.Path("office-real-work")
          dogfood = subprocess.run(
              [
                  sys.executable,
                  "script/qa/office_work_os_dogfood.py",
                  "--output-dir",
                  str(work),
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          if dogfood.returncode != 0:
              fail("office_dogfood_failed", stderr=dogfood.stderr[-2000:])
          report = json.loads(dogfood.stdout)
          if report.get("ok") is not True:
              fail("office_dogfood_receipt_unsuccessful")

          formats = report["formats"]
          format_names = ("docx", "xlsx", "pptx")
          expected_output_mapping = {
              f"modified-{format_name}.{format_name}": f"modified-{format_name}.pdf"
              for format_name in format_names
          }
          inputs = []
          selected_receipts = {}
          for format_name in format_names:
              format_receipt = formats[format_name]
              expected_name = f"modified-{format_name}.{format_name}"
              expected_hash = format_receipt["operations"]["modify"]["artifact"]
              matches = [
                  receipt
                  for receipt in format_receipt["artifacts"]
                  if pathlib.Path(receipt["path"]).name == expected_name
                  and receipt["sha256"] == expected_hash
              ]
              if len(matches) != 1:
                  fail("edited_artifact_receipt_missing_or_ambiguous", format=format_name)
              receipt = matches[0]
              selected = pathlib.Path(receipt["path"]).resolve()
              if str(selected) != format_receipt["primary_artifact"] or not selected.is_file():
                  fail("edited_artifact_path_mismatch", format=format_name)
              actual_hash = hashlib.sha256(selected.read_bytes()).hexdigest()
              if actual_hash != receipt["sha256"]:
                  fail("edited_artifact_hash_mismatch", format=format_name)
              inputs.append(selected)
              selected_receipts[format_name] = receipt

          if {path.name for path in inputs} != set(expected_output_mapping):
              fail("edited_artifact_input_mapping_incomplete")
          rendered = evidence / "rendered"
          rendered.mkdir()
          result = subprocess.run(
              [engine, "--headless", "--convert-to", "pdf", "--outdir", str(rendered),
               *(str(path) for path in inputs)],
              capture_output=True,
              text=True,
              timeout=180,
          )
          outputs = sorted(path.name for path in rendered.glob("*.pdf"))
          exact_outputs = outputs == sorted(expected_output_mapping.values())
          conversion_ok = result.returncode == 0 and exact_outputs
          records["libreoffice"] = {
              "status": "available" if conversion_ok else "failed",
              "version": actual_version,
              "validated_formats": sorted(format_names) if conversion_ok else [],
              "returncode": result.returncode,
              "output_count": len(outputs),
              "actual_outputs": outputs,
              "output_mapping": expected_output_mapping,
              "selected_receipts": selected_receipts,
              "dogfood_ok": report.get("ok") is True,
          }
          status_file.write_text(json.dumps(records, sort_keys=True), encoding="utf-8")
          if records["libreoffice"]["status"] != "available":
              raise SystemExit(1)
      - name: Upload bounded real-engine status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: office-real-status
          path: office-real-evidence/status.json
          if-no-files-found: error
          retention-days: 7
