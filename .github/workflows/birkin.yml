name: Birkin mention agent

on:
  issue_comment:
    types: [created]

# Events are filtered before a secret-bearing job starts. The job always
# checks out the trusted default branch, never code from an inbound fork.
permissions:
  contents: read

concurrency:
  group: birkin-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  birkin:
    if: >-
      (startsWith(github.event.comment.body, '/birkin') ||
      contains(github.event.comment.body, '\n/birkin')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run Birkin
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          provider: anthropic
          model: claude-sonnet-4-20250514
          test-command: python -m pytest -p no:cacheprovider -o addopts= -q
          max-retries: "1"
