name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os != 'Linux'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.22"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,office,office-advanced]" PyYAML
      - name: Install Windows verification tools
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m pip install ruff==0.16.3 basedpyright==1.39.9 bandit==1.9.4
      - run: python -m compileall -q birkin
      - name: Native macOS shell acceptance
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pytest -p no:cacheprovider -o addopts= -q tests/test_macos_shell_acceptance.py
          python scripts/qa/macos_shell_smoke.py
      - name: Native Windows shell acceptance
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pytest -p no:cacheprovider -o addopts= -q tests/test_windows_shell_acceptance.py tests/test_windows_shell_matrix.py tests/test_windows_job_object.py tests/test_proc.py tests/test_tools.py tests/test_operation_approvals.py tests/test_scheduler.py tests/test_monitor.py tests/test_shellguard.py tests/test_powershell_opt_in.py tests/test_generic_shell_paths.py tests/test_hooks.py tests/test_sandbox_worktree.py tests/test_sandbox_docker.py tests/test_github_action_policy.py tests/test_approvals.py tests/test_procreg.py
          python scripts/qa/windows_shell_smoke.py
      - name: Windows CLI help
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m birkin --help
      - name: Windows CLI success
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m birkin --version
      - name: Windows CLI invalid input
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m birkin definitely-not-a-command > cli-invalid.txt 2>&1 && exit /b 1
          findstr /C:"invalid choice" cli-invalid.txt
      - name: Windows lint
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m ruff check
          birkin/proc.py
          birkin/_winjob.py
          birkin/_winjob_bootstrap.py
          birkin/tools/shell.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          scripts/qa/omo_live_bridge_smoke.py
          scripts/qa/omo_live_harness.py
          tests/test_omo_live_bridge.py
          tests/test_windows_shell_acceptance.py
          tests/test_windows_shell_matrix.py
          tests/test_windows_job_object.py
          tests/test_powershell_opt_in.py
          tests/test_generic_shell_paths.py
          tests/test_macos_shell_acceptance.py
          scripts/qa/macos_shell_smoke.py
          scripts/qa/windows_shell_smoke.py
      - name: Windows type check
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m basedpyright
          birkin/proc.py
          birkin/_winjob.py
          birkin/_winjob_bootstrap.py
          birkin/tools/shell.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          scripts/qa/omo_live_bridge_smoke.py
          scripts/qa/omo_live_harness.py
          tests/test_omo_live_bridge.py
          tests/test_windows_shell_acceptance.py
          tests/test_windows_shell_matrix.py
          tests/test_windows_job_object.py
          tests/test_powershell_opt_in.py
          tests/test_generic_shell_paths.py
          tests/test_macos_shell_acceptance.py
          scripts/qa/macos_shell_smoke.py
          scripts/qa/windows_shell_smoke.py
      - name: Windows security scan
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m bandit -q -ll -r
          birkin/proc.py
          birkin/_winjob.py
          birkin/_winjob_bootstrap.py
          birkin/tools/shell.py
          birkin/approvals.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          birkin/operation_approval.py
          birkin/operation_policy.py
          birkin/egress.py
          birkin/egress_policy.py
          birkin/tools/files.py
          birkin/secrets
          birkin/github_action.py
          birkin/hooks.py
          birkin/sandbox_worktree.py
      - run: python -m pytest -p no:cacheprovider -o addopts= -q -m "not live" --cov=birkin --cov-report=term-missing --cov-fail-under=75

  windows-computer-use-native:
    name: Windows native Computer Use acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: >-
          python scripts/qa/computer_use_windows_acceptance.py
          --fixture scripts/qa/windows/ComputerUseFixture.ps1
          --evidence-root .omo/evidence/computer-use
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-computer-use-evidence
          path: .omo/evidence/computer-use/windows
          if-no-files-found: error

  macos-computer-use-native:
    name: macOS native Computer Use acceptance
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: >-
          swiftc scripts/qa/macos/ComputerUseFixture.swift
          -o /tmp/birkin-computer-use-fixture
      - run: >-
          python scripts/qa/computer_use_macos_dogfood.py
          --fixture-binary /tmp/birkin-computer-use-fixture
          --evidence-root .omo/evidence/computer-use
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-computer-use-evidence
          path: .omo/evidence/computer-use/macos
          if-no-files-found: error

  linux-computer-use-native:
    name: Linux X11 AT-SPI Computer Use acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          at-spi2-core
          dbus-x11
          gcc
          libatk-adaptor
          libgtk-3-dev
          openbox
          python3-pip
          python3-pyatspi
          xvfb
      - run: >-
          sudo /usr/bin/python3 -m pip install
          --break-system-packages
          -e ".[desktop]"
      - run: >-
          gcc scripts/qa/linux/ComputerUseFixture.c
          $(pkg-config --cflags --libs gtk+-3.0)
          -o /tmp/birkin-computer-use-fixture
      - run: >-
          dbus-run-session --
          xvfb-run -a
          sh -c '
          openbox >/tmp/openbox.log 2>&1 &
          exec env NO_AT_BRIDGE=0
          /usr/bin/python3 scripts/qa/computer_use_linux_acceptance.py
          --fixture /tmp/birkin-computer-use-fixture
          --evidence-root .omo/evidence/computer-use'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-computer-use-evidence
          path: .omo/evidence/computer-use/linux
          if-no-files-found: error
