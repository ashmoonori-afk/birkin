name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" PyYAML
      - run: python -m compileall -q birkin
      - run: python -m pytest -p no:cacheprovider -o addopts= -q

  windows-computer-use-native:
    name: Windows native Computer Use acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: >-
          python scripts/qa/computer_use_windows_acceptance.py
          --fixture scripts/qa/windows/ComputerUseFixture.ps1
          --evidence-root .omo/evidence/computer-use
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-computer-use-evidence
          path: .omo/evidence/computer-use/windows
          if-no-files-found: error

  macos-computer-use-native:
    name: macOS native Computer Use acceptance
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: >-
          swiftc scripts/qa/macos/ComputerUseFixture.swift
          -o /tmp/birkin-computer-use-fixture
      - run: >-
          python scripts/qa/computer_use_macos_dogfood.py
          --fixture-binary /tmp/birkin-computer-use-fixture
          --evidence-root .omo/evidence/computer-use
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-computer-use-evidence
          path: .omo/evidence/computer-use/macos
          if-no-files-found: error

  linux-computer-use-native:
    name: Linux X11 AT-SPI Computer Use acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          at-spi2-core
          dbus-x11
          gcc
          libatk-adaptor
          libgtk-3-dev
          openbox
          python3-pip
          python3-pyatspi
          xvfb
      - run: >-
          sudo /usr/bin/python3 -m pip install
          --break-system-packages
          -e ".[desktop]"
      - run: >-
          gcc scripts/qa/linux/ComputerUseFixture.c
          $(pkg-config --cflags --libs gtk+-3.0)
          -o /tmp/birkin-computer-use-fixture
      - run: >-
          dbus-run-session --
          xvfb-run -a
          sh -c '
          openbox >/tmp/openbox.log 2>&1 &
          exec env NO_AT_BRIDGE=0
          /usr/bin/python3 scripts/qa/computer_use_linux_acceptance.py
          --fixture /tmp/birkin-computer-use-fixture
          --evidence-root .omo/evidence/computer-use'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-computer-use-evidence
          path: .omo/evidence/computer-use/linux
          if-no-files-found: error
      - run: python -m pytest -p no:cacheprovider -o addopts= -q --cov=birkin --cov-report=term-missing -m "not live"
