name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.22"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" PyYAML
      - name: Install Windows verification tools
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m pip install ruff==0.16.3 basedpyright==1.39.9 bandit==1.9.4
      - run: python -m compileall -q birkin
      - name: Native Windows shell acceptance
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m pytest -p no:cacheprovider -o addopts= -q
          tests/test_windows_shell_acceptance.py
          tests/test_proc.py
          tests/test_tools.py
          tests/test_operation_approvals.py
          tests/test_scheduler.py
          tests/test_monitor.py
          tests/test_shellguard.py
          tests/test_powershell_opt_in.py
      - name: Windows CLI help
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m birkin --help
      - name: Windows CLI success
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m birkin --version
      - name: Windows CLI invalid input
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m birkin definitely-not-a-command > cli-invalid.txt 2>&1 && exit /b 1
          findstr /C:"invalid choice" cli-invalid.txt
      - name: Windows lint
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m ruff check
          birkin/proc.py
          birkin/tools/shell.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          scripts/qa/omo_live_bridge_smoke.py
          scripts/qa/omo_live_harness.py
          tests/test_omo_live_bridge.py
          tests/test_windows_shell_acceptance.py
          tests/test_powershell_opt_in.py
      - name: Windows type check
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m basedpyright
          birkin/proc.py
          birkin/tools/shell.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          scripts/qa/omo_live_bridge_smoke.py
          scripts/qa/omo_live_harness.py
          tests/test_omo_live_bridge.py
          tests/test_windows_shell_acceptance.py
          tests/test_powershell_opt_in.py
      - name: Windows security scan
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python -m bandit -q -ll -r
          birkin/proc.py
          birkin/tools/shell.py
          birkin/approvals.py
          birkin/omo_bridge.py
          birkin/omo_live.py
          birkin/operation_approval.py
          birkin/operation_policy.py
          birkin/egress.py
          birkin/egress_policy.py
          birkin/tools/files.py
          birkin/secrets
      - run: python -m pytest -p no:cacheprovider -o addopts= -q
