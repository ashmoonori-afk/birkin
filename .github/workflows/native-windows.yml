name: Native Windows client

on:
  push:
    paths:
      - "windows/**"
      - "birkin/native/**"
      - "birkin/workspace/**"
      - "scripts/native/**"
      - "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/**"
      - "docs/native-app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/native-windows.yml"
      - "tests/test_native_windows_import.py"
      - "tests/test_native_windows_ci_contract.py"
  pull_request:
    paths:
      - "windows/**"
      - "birkin/native/**"
      - "birkin/workspace/**"
      - "scripts/native/**"
      - "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/**"
      - "docs/native-app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/native-windows.yml"
      - "tests/test_native_windows_import.py"
      - "tests/test_native_windows_ci_contract.py"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: native-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: >-
          uv run --frozen pytest -q
          tests/test_native_windows_import.py
          tests/test_native_windows_ci_contract.py

  dotnet-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: dotnet restore ./windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj
      - run: dotnet restore ./windows/BirkinNativeApp/tests/Birkin.Native.Shell.Tests/Birkin.Native.Shell.Tests.csproj
      - run: dotnet test ./windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj -c Release --no-restore
      - run: dotnet test ./windows/BirkinNativeApp/tests/Birkin.Native.Shell.Tests/Birkin.Native.Shell.Tests.csproj -c Release --no-restore

  wpf-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen
      - run: dotnet restore ./windows/BirkinNativeApp/BirkinNativeApp.sln
      - run: dotnet build ./windows/BirkinNativeApp/BirkinNativeApp.sln -c Release --no-restore
      - run: >-
          dotnet test ./windows/BirkinNativeApp/BirkinNativeApp.sln
          -c Release --no-build
          --logger "trx;LogFilePrefix=native-windows"

  live-bridge-window:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen
      - run: dotnet restore ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
      - run: dotnet build ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj -c Release --no-restore
      - run: >-
          dotnet test ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
          -c Release --no-build
          --filter "TestCategory=LiveBridge"
          --logger "trx;LogFilePrefix=native-windows-live"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-live-trx
          path: windows/BirkinNativeApp/**/TestResults/*.trx
          if-no-files-found: error
          retention-days: 7

  protocol-fixture-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/native/generate_golden_vectors.py
      - run: uv run --frozen python scripts/native/generate_projection_vectors.py
      - run: >-
          git diff --exit-code --
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-vectors.json
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-projection-vectors.json
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json
      - shell: python
        run: |
          import subprocess

          fixtures = [
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-vectors.json",
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-projection-vectors.json",
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json",
          ]
          status = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--", *fixtures],
              check=True,
              capture_output=True,
              text=True,
          )
          if status.stdout:
              print(status.stdout, end="")
              raise SystemExit(1)
      - run: >-
          git ls-files --error-unmatch
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json

  swift-conformance:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift test --package-path macos/BirkinNativeApp --filter NativeNegativeGoldenVectorParityTests
