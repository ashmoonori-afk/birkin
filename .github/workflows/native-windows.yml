name: Native Windows client

on:
  push:
    paths:
      - "windows/**"
      - "birkin/native/**"
      - "birkin/office/**"
      - "birkin/workspace/**"
      - "scripts/native/**"
      - "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/**"
      - "docs/native-app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/native-windows.yml"
      - "tests/test_native_windows_import.py"
      - "tests/test_native_windows_ci_contract.py"
      - "tests/test_native_office*.py"
  pull_request:
    paths:
      - "windows/**"
      - "birkin/native/**"
      - "birkin/office/**"
      - "birkin/workspace/**"
      - "scripts/native/**"
      - "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/**"
      - "docs/native-app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/native-windows.yml"
      - "tests/test_native_windows_import.py"
      - "tests/test_native_windows_ci_contract.py"
      - "tests/test_native_office*.py"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: native-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BIRKIN_BROWSER_INTEGRATION: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.22"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-extras --all-groups
      - run: ./.venv/Scripts/python.exe -m playwright install chromium
      - run: >-
          ./.venv/Scripts/python.exe -m pytest -q -o addopts=""
          --deselect tests/test_native_transport.py::test_uds_listener_rejects_symlinked_parent
          --deselect tests/test_native_transport.py::test_uds_listener_rejects_symlinked_socket_path

  dotnet-portable:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: dotnet restore windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj
      - run: dotnet restore windows/BirkinNativeApp/tests/Birkin.Native.Shell.Tests/Birkin.Native.Shell.Tests.csproj
      - run: >-
          dotnet test windows/BirkinNativeApp/tests/Birkin.Native.Protocol.Tests/Birkin.Native.Protocol.Tests.csproj
          -c Release --no-restore
          --filter "TestCategory!=LiveBridge&TestCategory!=WindowsOnly"
      - run: >-
          dotnet test windows/BirkinNativeApp/tests/Birkin.Native.Shell.Tests/Birkin.Native.Shell.Tests.csproj
          -c Release --no-restore
          --filter "TestCategory!=LiveBridge&TestCategory!=WindowsOnly"

  wpf-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen --all-extras --all-groups
      - run: dotnet restore ./windows/BirkinNativeApp/BirkinNativeApp.sln
      - run: dotnet build ./windows/BirkinNativeApp/BirkinNativeApp.sln -c Release --no-restore
      - run: >-
          dotnet test ./windows/BirkinNativeApp/BirkinNativeApp.sln
          -c Release --no-build
          --logger "trx;LogFilePrefix=native-windows"

  live-bridge-window:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen --all-extras --all-groups
      - run: dotnet restore ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
      - run: dotnet build ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj -c Release --no-restore
      - run: >-
          dotnet test ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
          -c Release --no-build
          --filter "TestCategory=LiveBridge"
          --logger "trx;LogFilePrefix=native-windows-live"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-live-trx
          path: windows/BirkinNativeApp/**/TestResults/*.trx
          if-no-files-found: error
          retention-days: 7

  protocol-fixture-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/native/generate_golden_vectors.py
      - run: uv run --frozen python scripts/native/generate_projection_vectors.py
      - run: >-
          git diff --exit-code --
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-vectors.json
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-projection-vectors.json
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json
      - shell: python
        run: |
          import subprocess

          fixtures = [
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-vectors.json",
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-projection-vectors.json",
              "macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json",
          ]
          status = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--", *fixtures],
              check=True,
              capture_output=True,
              text=True,
          )
          if status.stdout:
              print(status.stdout, end="")
              raise SystemExit(1)
      - run: >-
          git ls-files --error-unmatch
          macos/BirkinNativeApp/Tests/BirkinNativeProtocolTests/GoldenVectors/native-protocol-invalid-vectors.json

  swift-conformance:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      BIRKIN_BROWSER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-extras --all-groups
      - run: .venv/bin/python -m playwright install chromium
      - run: swift test --package-path macos/BirkinNativeApp --no-parallel

  # This gate depends on repository administrators provisioning the named
  # protected environment and an existing-account runner with these labels.
  # It is intentionally absent from automatic PR/push runs so forks and normal
  # contributors never wait for a private runner.
  provider-office-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref_protected
    environment: native-windows-existing-account
    runs-on: [self-hosted, Windows, X64, birkin-existing-account]
    timeout-minutes: 20
    env:
      BIRKIN_EXISTING_ACCOUNT_RUNNER: "1"
      PYTHONUTF8: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.x"
      - run: uv sync --frozen --all-extras --all-groups
      - run: dotnet restore ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
      - run: dotnet build ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj -c Release --no-restore
      - run: >-
          dotnet test ./windows/BirkinNativeApp/tests/Birkin.Native.App.Tests/Birkin.Native.App.Tests.csproj
          -c Release --no-build
          --filter "TestCategory=OfficeWorkflow&TestCategory=ExistingAccountProvider"
          --logger "trx;LogFilePrefix=native-windows-provider-office"
