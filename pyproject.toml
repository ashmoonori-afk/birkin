[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birkin"
version = "0.1.0"
description = "Lightweight, self-improving CLI agent workspace with skill management, subagents, and a WebUI. Inspired by hermes-agent and openclaw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — All Rights Reserved (see LICENSE; third-party MIT components retained)" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "birkin" }]
keywords = ["agent", "cli", "skills", "subagents", "self-improving", "llm"]

# Zero runtime dependencies — standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
birkin = "birkin.cli:main"

[tool.hatch.build.targets.sdist]
# Ship only project files — never stray runtime data/binaries from the workspace.
only-include = ["birkin", "skills", "scripts", "docs", "tests", "README.md", "pyproject.toml", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["birkin"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "birkin/_bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
