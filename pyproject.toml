[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birkin"
version = "0.4.213"
description = "Lightweight, self-improving CLI agent workspace with skill management, subagents, and a WebUI. Inspired by hermes-agent and openclaw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "birkin" }]
keywords = ["agent", "cli", "skills", "subagents", "self-improving", "llm"]

dependencies = []

[project.optional-dependencies]
voice = [
    "openai[realtime,voice_helpers]>=2.53,<3",
]
desktop = [
    "Pillow>=11",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywin32>=308; sys_platform == 'win32'",
]
office = [
    "openpyxl>=3.1,<4",
]
browser = [
    "playwright>=1.54,<2",
]
full = [
    "openai[realtime,voice_helpers]>=2.53,<3",
    "Pillow>=11",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywin32>=308; sys_platform == 'win32'",
    "openpyxl>=3.1,<4",
    "playwright>=1.54,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tomli>=2",
    "openai[realtime,voice_helpers]>=2.53,<3",
    "Pillow>=11",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywin32>=308; sys_platform == 'win32'",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "tomli>=2"]

[project.scripts]
birkin = "birkin.cli:main"

[tool.hatch.build.targets.sdist]
# Ship only project files ??never stray runtime data/binaries from the workspace.
only-include = ["birkin", "skills", "scripts", "docs", "tests", "README.md", "pyproject.toml", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["birkin"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "birkin/_bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "tmp"]
# Offline runs skip the live suite by default; opt in with `BIRKIN_LIVE=1
# pytest -m live` (and a real backend ??API key, or installed claude/codex CLI).
addopts = "-q --cov=birkin --cov-report=term-missing -m 'not live'"
markers = [
    "live: real LLM backend required (BIRKIN_LIVE=1 + API key or claude/codex CLI)",
    "docker_integration: opt-in test requiring BIRKIN_DOCKER_INTEGRATION=1 and a Docker daemon",
    "browser_integration: opt-in test requiring BIRKIN_BROWSER_INTEGRATION=1 and Playwright Chromium",
]

[tool.coverage.run]
source = ["birkin"]
branch = false
omit = [
    # Interactive surfaces ??driven by stdin/TTY and tested only via smoke runs.
    "birkin/repl.py",
    "birkin/onboarding.py",
    "birkin/slashcommands.py",
    "birkin/ui.py",
    "birkin/menu.py",
    # Live-LLM routine (covered by the live-test harness in P2).
    "birkin/morpheus.py",
    "birkin/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 75
