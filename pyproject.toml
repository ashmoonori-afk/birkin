[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birkin"
version = "0.4.363"
description = "Lightweight, self-improving CLI agent workspace with skill management, subagents, and a WebUI. Inspired by hermes-agent and openclaw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "birkin" }]
keywords = ["agent", "cli", "skills", "subagents", "self-improving", "llm"]

dependencies = [
    "pydantic>=2,<3",
    "psutil>=6",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
memory-semantic = [
    "sentence-transformers>=3,<6",
]
voice = [
    "openai[realtime,voice_helpers]>=2.53,<3",
]
desktop = [
    "Pillow>=11,<13",
    "pyobjc-framework-ApplicationServices>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
]
office = [
    "jsonschema>=4.23,<5",
    "rfc8785>=0.1.4,<1",
    "defusedxml>=0.7,<1",
    "lxml>=5.3,<7",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-hwpx==6.1.0",
    "python-pptx>=1.0.2,<2",
]
office-advanced = [
    "Pillow>=11,<13",
    "pypdf>=5.9,<7",
    "pypdfium2>=4.30,<5",
]
office-docling = ["docling>=2.50,<3"]
research = ["jsonschema>=4.23,<5", "rfc8785>=0.1.4,<1"]
work = ["jsonschema>=4.23,<5", "rfc8785>=0.1.4,<1"]
browser = [
    "playwright>=1.54,<2",
]
full = [
    "openai[realtime,voice_helpers]>=2.53,<3",
    "Pillow>=11,<13",
    "pyobjc-framework-ApplicationServices>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "jsonschema>=4.23,<5",
    "rfc8785>=0.1.4,<1",
    "defusedxml>=0.7,<1",
    "lxml>=5.3,<7",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-hwpx==6.1.0",
    "python-pptx>=1.0.2,<2",
    "pypdf>=5.9,<7",
    "pypdfium2>=4.30,<5",
    "playwright>=1.54,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tomli>=2",
    "openai[realtime,voice_helpers]>=2.53,<3",
    "Pillow>=11,<13",
    "pyobjc-framework-ApplicationServices>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pywinctl>=0.4.1; sys_platform == 'linux'",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "openpyxl>=3.1.5,<4",
    # Terminal QA drivers: the pty tests import these at collection time, so a
    # `pip install -e ".[dev]"` environment (CI included) must carry them.
    "pexpect>=4.9,<5",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tomli>=2",
    "basedpyright>=1.31",
    "bandit>=1.8",
    "build>=1.2",
    "ruff>=0.12",
    "pexpect>=4.9,<5",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.scripts]
birkin = "birkin.cli:main"

[tool.hatch.build.targets.sdist]
# Ship only project files ??never stray runtime data/binaries from the workspace.
only-include = ["birkin", "birkin_mnemosyne", "skills", "scripts", "docs", "tests", "README.md", "README.ko.md", "pyproject.toml", "LICENSE", "NOTICE", "LICENSES"]

[tool.hatch.build.targets.wheel]
packages = ["birkin", "birkin_mnemosyne"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "birkin/_bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "tmp"]
# Offline runs skip the live suite by default; opt in with `BIRKIN_LIVE=1
# pytest -m live` (and a real backend ??API key, or installed claude/codex CLI).
addopts = "-q -m 'not live and not locked_env'"
markers = [
    "live: real LLM backend required (BIRKIN_LIVE=1 + API key or claude/codex CLI)",
    "locked_env: exact dependency lock required (run after uv sync)",
    "docker_integration: opt-in test requiring BIRKIN_DOCKER_INTEGRATION=1 and a Docker daemon",
    "browser_integration: opt-in test requiring BIRKIN_BROWSER_INTEGRATION=1 and Playwright Chromium",
]

[tool.basedpyright]
stubPath = "typings"
extraPaths = ["scripts/native"]
include = [
    "birkin/native",
    "birkin/workspace",
    "birkin/workspace_terminal.py",
    "script/qa/workspace_*.py",
    "scripts/native",
    "tests/native_*.py",
    "tests/test_native_*.py",
    "tests/test_workspace_*.py",
]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.10"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["birkin"]
branch = false
omit = [
    # Interactive surfaces ??driven by stdin/TTY and tested only via smoke runs.
    "birkin/repl.py",
    "birkin/onboarding.py",
    "birkin/slashcommands.py",
    "birkin/ui.py",
    "birkin/menu.py",
    # Live-LLM routine (covered by the live-test harness in P2).
    "birkin/morpheus.py",
    "birkin/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
