<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>birkin workbench</title>
<style>
:root {
  --birkin-accent: Highlight;
  --birkin-border: GrayText;
  --birkin-border-accent: Highlight;
  --birkin-border-muted: GrayText;
  --birkin-text: CanvasText;
  --birkin-muted: GrayText;
  --birkin-dim: GrayText;
  --birkin-background: Canvas;
  --birkin-surface: Field;
  --birkin-surface-raised: ButtonFace;
  --birkin-focus-ring: Highlight;
  --birkin-success: LinkText;
  --birkin-warning: Highlight;
  --birkin-error: ActiveText;
  --birkin-info: LinkText;
  --birkin-pending: Highlight;
  --birkin-blocked: ActiveText;
  --birkin-action-needed: Highlight;
  --birkin-selected-bg: ButtonFace;
  --birkin-user-message-bg: Canvas;
  --birkin-assistant-message-bg: Canvas;
  --birkin-thinking-bg: Canvas;
  --birkin-tool-pending-bg: Canvas;
  --birkin-tool-success-bg: Canvas;
  --birkin-tool-error-bg: Canvas;
  --birkin-action-needed-bg: Canvas;
  --birkin-evidence-bg: Canvas;
  --birkin-composer-bg: Canvas;
  --surface: var(--birkin-background);
  --surface-elevated: var(--birkin-surface);
  --text-primary: var(--birkin-text);
  --text-muted: var(--birkin-muted);
  --accent: var(--birkin-accent);
  --running: var(--birkin-info);
  --waiting-human: var(--birkin-action-needed);
  --waiting-dependency: var(--birkin-pending);
  --success: var(--birkin-success);
  --warning: var(--birkin-warning);
  --failure: var(--birkin-error);
  --evidence: var(--birkin-info);
  --memory: var(--birkin-pending);
  --diff-add: var(--birkin-success);
  --diff-remove: var(--birkin-error);
  --focus: var(--birkin-focus-ring);
  --selection: var(--birkin-selected-bg);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface); color: var(--text-primary);
  font: 15px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
button { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--selection); }

.app {
  display: grid; height: 100dvh; min-height: 0; overflow: hidden;
  grid-template-rows: auto 1fr;
  min-width: 0; max-width: 100vw;
}
.pulse {
  display: flex; flex-wrap: wrap; gap: .35rem 1rem;
  align-items: center; padding: .55rem .9rem;
  background: var(--surface-elevated);
  border-bottom: 1px solid var(--selection);
}
.pulse .brand { font-weight: 700; color: var(--accent); }
.pulse .seg { color: var(--text-muted); font-size: .86rem; }
.pulse .seg.alert { color: var(--waiting-human); font-weight: 600; }
.pulse .seg.down { color: var(--failure); font-weight: 600; }
.browser-toggle {
  margin-left: auto; padding: .35rem .7rem; border-radius: 7px;
  border: 1px solid var(--birkin-border-muted);
  background: var(--birkin-surface);
  color: var(--birkin-text); cursor: pointer;
}
.browser-toggle:focus-visible,
.browser-url:focus-visible,
.browser-go:focus-visible {
  outline-color: var(--birkin-focus-ring);
}

.workspace-shell {
  display: grid; min-width: 0; min-height: 0;
  grid-template-columns: minmax(0, 1fr);
}
.main {
  display: grid; gap: 0; min-width: 0; min-height: 0;
  max-width: 100vw; overflow: hidden;
}
.browser-aside {
  display: none; min-width: 0; min-height: 0; overflow: hidden;
  grid-template-rows: auto auto minmax(0, 1fr);
  border-left: 1px solid var(--birkin-border-muted);
  background: var(--birkin-surface);
}
.workspace-shell.browser-open {
  grid-template-columns: minmax(0, 1fr) minmax(360px, 40vw);
}
.workspace-shell.browser-open .browser-aside { display: grid; }
.browser-toolbar {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: .45rem; padding: .55rem;
  border-bottom: 1px solid var(--birkin-border-muted);
  background: var(--birkin-surface-raised);
}
.browser-url {
  min-width: 0; width: 100%; padding: .5rem .65rem;
  border: 1px solid var(--birkin-border-muted); border-radius: 7px;
  background: var(--birkin-background); color: var(--birkin-text);
}
.browser-go {
  padding: .45rem .75rem; border: 1px solid var(--birkin-accent);
  border-radius: 7px; background: var(--birkin-background);
  color: var(--birkin-text);
  cursor: pointer;
}
.browser-status {
  min-height: 2rem; margin: 0; padding: .35rem .65rem;
  color: var(--birkin-muted); font-size: .82rem;
  border-bottom: 1px solid var(--birkin-border-muted);
}
.browser-status[data-state="loading"] { color: var(--birkin-pending); }
.browser-status[data-state="ready"] { color: var(--birkin-success); }
.browser-status[data-state="warning"] { color: var(--birkin-warning); }
.browser-status[data-state="blocked"] { color: var(--birkin-blocked); }
.browser-status[data-state="error"] { color: var(--birkin-error); }
.browser-state-glyph {
  display: inline-block; width: 1.25em; font-weight: 700;
}
.browser-status[data-state="error"] + .browser-viewport { display: none; }
.browser-viewport {
  position: relative; min-height: 0; overflow: hidden;
  background: var(--birkin-background); padding: .5rem;
}
.browser-canvas {
  position: absolute; inset: .5rem; display: block;
  width: calc(100% - 1rem); height: calc(100% - 1rem);
  min-width: 0; min-height: 0; object-fit: contain;
  background: var(--birkin-background);
  border: 1px solid var(--birkin-border-muted);
}
.ledger {
  border-bottom: 1px solid var(--selection);
  min-width: 0; min-height: 0; overflow: auto;
}
.bench { padding: 1rem; min-width: 0; min-height: 0; overflow: auto; }
.lens { display: none; padding: 1rem; border-left: 1px solid var(--selection); }
.lens-toggle {
  display: none; position: fixed; right: 1rem; bottom: 1rem; z-index: 3;
  padding: .5rem .8rem; border: 1px solid var(--focus); border-radius: 8px;
  background: var(--surface-elevated); color: var(--text-primary);
}

@media (min-width: 768px) {
  .main { grid-template-columns: 300px minmax(0,1fr); grid-template-areas: "ledger bench"; }
  .ledger { border-right: 1px solid var(--selection); border-bottom: none; }
  .ledger summary { cursor: pointer; }
}
@media (min-width: 1024px) and (max-width: 1439px) {
  .lens-toggle { display: block; }
  .lens.open {
    display: block; position: fixed; inset: 3.2rem 0 0 auto; z-index: 2;
    width: min(320px, 88vw); overflow: auto;
    background: var(--surface-elevated);
    box-shadow: -12px 0 28px rgb(0 0 0 / .32);
  }
}
@media (min-width: 1440px) {
  .main { grid-template-columns: 320px minmax(0,1fr) 320px; grid-template-areas: "ledger bench lens"; }
  .lens { display: block; }
  .browser-open .main {
    grid-template-columns: 300px minmax(0,1fr);
    grid-template-areas: "ledger bench";
  }
  .browser-open .lens { display: none; }
  .browser-open .lens-toggle { display: block; }
}
@media (max-width: 1023px) {
  .workspace-shell.browser-open {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(300px, 44vh);
  }
  .browser-aside {
    border-left: 0; border-top: 1px solid var(--birkin-border-muted);
  }
}

.ledger summary {
  cursor: pointer; padding: .6rem .9rem; font-weight: 600;
  color: var(--waiting-human);
}
.queue { list-style: none; margin: 0; padding: .4rem; }
.queue li { margin: 0; }
.queue button {
  display: flex; gap: .5rem; align-items: baseline; width: 100%;
  min-width: 0;
  text-align: left; padding: .45rem .55rem; border: 0; border-radius: 6px;
  background: transparent; color: var(--text-primary); cursor: pointer;
}
.queue button[aria-current="true"] { background: var(--selection); }
.queue .glyph { flex: none; width: 1.1em; text-align: center; }
.queue .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue .s { flex: none; font-size: .78rem; color: var(--text-muted); }

.card {
  background: var(--surface-elevated); border: 1px solid var(--selection);
  border-radius: 10px; padding: 1rem; max-width: 52rem;
}
.card h2 { margin: 0 0 .6rem; font-size: 1.05rem; }
.badge { font-weight: 600; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; margin: .6rem 0; }
.meta dt { color: var(--text-muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.risk-high { color: var(--failure); font-weight: 700; }
.risk-mid  { color: var(--warning); font-weight: 600; }
details.payload { margin: .6rem 0; }
details.payload > summary { cursor: pointer; color: var(--evidence); }
details.payload pre {
  max-height: 16rem; overflow: auto; background: var(--surface);
  padding: .6rem; border-radius: 6px; font-size: .82rem;
}
.actions { display: flex; gap: .6rem; margin-top: .8rem; flex-wrap: wrap; }
.actions button {
  padding: .5rem 1.1rem; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--selection); background: var(--surface);
  color: var(--text-primary);
}
.actions button.ok { border-color: var(--success); }
.actions button.no { border-color: var(--failure); }
.actions button:disabled { opacity: .55; cursor: wait; }
.authority-note { color: var(--text-muted); font-size: .82rem; margin-top: .5rem; }
#announce { min-height: 1.4em; margin-top: .6rem; color: var(--accent); }

.banner {
  display: none; padding: .6rem .9rem; background: var(--surface-elevated);
  color: var(--warning); border-bottom: 1px solid var(--warning);
}
.banner code { color: var(--text-primary); }
.banner.show { display: block; }

.lens h3, .activity h3 { font-size: .9rem; color: var(--text-muted); margin: 1rem 0 .35rem; }
.lens ul, .activity ul { list-style: none; margin: 0; padding: 0; font-size: .86rem; }
.lens li, .activity li { padding: .18rem 0; color: var(--text-primary); }
.lens .k { color: var(--text-muted); }
.empty { color: var(--text-muted); padding: 1rem 0; }
.queue-notice { padding: .7rem .9rem; color: var(--warning); }
.checkpoints { border-top: 1px solid var(--selection); }
.checkpoints summary { color: var(--accent); }
.checkpoint-meta { color: var(--text-muted); font-size: .78rem; }
.diff-preview { max-height: 24rem; overflow: auto; white-space: pre-wrap;
  background: var(--surface); padding: .7rem; border-radius: 6px; }
.restore-mode, .fork-command { padding: .45rem; color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--selection); border-radius: 6px; }
.fork-command { width: min(100%, 32rem); }

@media (prefers-reduced-motion: no-preference) {
  .queue button, .actions button { transition: background .15s ease, border-color .15s ease; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (min-width: 1024px) {
  .browser-open .lens-toggle {
    display: block;
    right: calc(40vw + 1rem);
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="pulse">
    <span class="brand">birkin</span>
    <span class="seg" id="p-daemon">데몬 확인 중</span>
    <span class="seg alert" id="p-waiting" hidden></span>
    <span class="seg" id="p-model"></span>
    <span class="seg" id="p-version"></span>
    <button class="browser-toggle" id="browser-aside-toggle" type="button"
            aria-controls="browser-aside" aria-expanded="false">
      브라우저 열기
    </button>
  </header>
  <div class="banner" id="banner" role="alert">
    연결이 끊어졌습니다 — 복구: <code>birkin web</code> 재실행 또는 데몬 확인
    (<code>birkin daemon start</code>). 재연결되면 승인 상태를 다시 불러옵니다.
  </div>
  <div class="workspace-shell" id="workspace-shell">
    <div class="main">
      <nav class="ledger" aria-label="주의 대기열">
      <details open>
        <summary id="ledger-summary">주의 필요</summary>
        <p class="queue-notice" id="queue-notice" role="status" hidden></p>
        <ul class="queue" id="queue"></ul>
      </details>
      <details class="checkpoints" open>
        <summary id="checkpoint-summary">Checkpoints</summary>
        <ul class="queue" id="checkpoint-list"></ul>
      </details>
      </nav>
      <main class="bench" id="bench" aria-label="작업면" tabindex="-1">
        <p class="empty">항목을 선택하면 상세가 표시됩니다.</p>
      </main>
      <button class="lens-toggle" id="lens-toggle" type="button"
              aria-controls="lens" aria-expanded="false">맥락 보기</button>
      <aside class="lens" id="lens" aria-label="맥락 렌즈">
        <h3>실행 환경</h3>
        <ul id="lens-env"></ul>
        <h3>예약된 잡</h3>
        <ul id="lens-jobs"></ul>
        <div class="activity">
          <h3>최근 활동</h3>
          <ul id="lens-runs"></ul>
        </div>
      </aside>
    </div>
    <aside class="browser-aside" id="browser-aside"
           aria-label="네이티브 브라우저" aria-hidden="true">
      <form class="browser-toolbar" id="browser-aside-form">
        <input class="browser-url" id="browser-aside-url" type="url"
               inputmode="url" autocomplete="off" spellcheck="false"
               aria-label="브라우저 주소" placeholder="https://example.com" />
        <button class="browser-go" type="submit">이동</button>
      </form>
      <p class="browser-status" id="browser-aside-status" role="status"
         aria-live="polite" data-state="closed">
        <span class="browser-state-glyph" aria-hidden="true">○</span>
        <span class="browser-state-label">Chromium 대기</span>
      </p>
      <div class="browser-viewport">
        <canvas class="browser-canvas" id="browser-aside-canvas"
                width="1024" height="700" aria-label="브라우저 화면"
                data-frame-ready="false"></canvas>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";
let enc = null;                 // state encoding from /api/contract
let items = [];                 // attention queue
let selectedId = null;
let busy = false;
let queueNotice = "";
let checkpointItems = [];
let toolTimeline = [];
let checkpointLineage = [];
let selectedCheckpoint = null;
let browserFrameTimer = null;

const $ = (id) => document.getElementById(id);
const browserClientId = sessionStorage.getItem(
  "birkin-browser-client"
) || crypto.randomUUID();
sessionStorage.setItem("birkin-browser-client", browserClientId);
let browserControlSequence = Number(
  sessionStorage.getItem("birkin-browser-control-sequence") || 0
);

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }
  return r.json();
}

async function browserJSON(url, method, payload) {
  const options = {
    method,
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "X-Birkin-Browser-Client": browserClientId,
    },
  };
  if (payload !== undefined) options.body = JSON.stringify(payload);
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error?.code || String(response.status));
    error.status = response.status;
    throw error;
  }
  return body;
}

function setBrowserStatus(text, state = "closed") {
  const node = $("browser-aside-status");
  const glyphs = {
    closed: "○",
    loading: "◐",
    ready: "✓",
    warning: "!",
    blocked: "⊘",
    error: "×",
  };
  const glyph = document.createElement("span");
  glyph.className = "browser-state-glyph";
  glyph.setAttribute("aria-hidden", "true");
  glyph.textContent = glyphs[state] || glyphs.closed;
  const label = document.createElement("span");
  label.className = "browser-state-label";
  label.textContent = text;
  node.replaceChildren(glyph, label);
  node.dataset.state = state;
  node.setAttribute(
    "aria-live",
    state === "error" ? "assertive" : "polite",
  );
}

function browserStatusLabel(status) {
  const engine = status.engine === "chromium" ? "Chromium" : "Browser";
  const owners = {
    human: "사람 제어",
    agent: "에이전트 제어",
    tool: "도구 제어",
  };
  const owner = owners[status.control_owner_kind] || "제어권 대기";
  const readiness = status.frame_revision ? "준비" : "주소 대기";
  return `${engine} · ${readiness} · ${owner}`;
}

function resetBrowserFrame() {
  const canvas = $("browser-aside-canvas");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.frameReady = "false";
  canvas.dataset.frameRevision = "0";
  canvas.dataset.frameDigest = "";
  canvas.dataset.frameRef = "";
  canvas.dataset.browserGeneration = "";
}

async function refreshBrowserFrame(status) {
  const canvas = $("browser-aside-canvas");
  const generation = String(status.browser_generation);
  if (canvas.dataset.browserGeneration !== generation) {
    resetBrowserFrame();
    canvas.dataset.browserGeneration = generation;
  }
  if (!status.live || !status.frame_revision) return;
  const query = new URLSearchParams({
    generation,
    after: canvas.dataset.frameRevision || "0",
  });
  const response = await fetch("/api/browser-aside/frame?" + query, {
    cache: "no-store",
    headers: {"X-Birkin-Browser-Client": browserClientId},
  });
  if (response.status === 204) return;
  if (!response.ok) throw new Error("frame_" + response.status);
  const image = await createImageBitmap(await response.blob());
  canvas.width = image.width;
  canvas.height = image.height;
  canvas.getContext("2d").drawImage(image, 0, 0);
  image.close();
  canvas.dataset.frameReady = "true";
  canvas.dataset.frameRevision =
    response.headers.get("X-Birkin-Frame-Revision") || "0";
  canvas.dataset.frameDigest =
    response.headers.get("X-Birkin-Frame-Digest") || "";
  canvas.dataset.frameRef =
    response.headers.get("X-Birkin-Frame-Ref") || "";
  canvas.dataset.browserGeneration = generation;
  dispatchEvent(new CustomEvent("browser-aside-frame", {
    detail: {
      generation: status.browser_generation,
      revision: canvas.dataset.frameRevision,
    },
  }));
}

function stopBrowserFramePoll() {
  if (browserFrameTimer !== null) {
    clearTimeout(browserFrameTimer);
    browserFrameTimer = null;
  }
}

function scheduleBrowserFramePoll() {
  stopBrowserFramePoll();
  if (!$("workspace-shell").classList.contains("browser-open")) return;
  browserFrameTimer = setTimeout(async () => {
    try {
      const status = await browserJSON(
        "/api/browser-aside/status", "GET");
      if (!status.live) {
        setBrowserStatus("Chromium 연결 끊김", "warning");
        return;
      }
      await refreshBrowserFrame(status);
      setBrowserStatus(browserStatusLabel(status), "ready");
    } catch (error) {
      setBrowserStatus("화면 새로고침 필요", "warning");
    } finally {
      scheduleBrowserFramePoll();
    }
  }, 750);
}

async function openBrowserAside() {
  const shell = $("workspace-shell");
  const aside = $("browser-aside");
  const toggle = $("browser-aside-toggle");
  shell.classList.add("browser-open");
  aside.setAttribute("aria-hidden", "false");
  toggle.setAttribute("aria-expanded", "true");
  toggle.textContent = "브라우저 접기";
  setBrowserStatus("Chromium 시작 중", "loading");
  try {
    const status = await browserJSON(
      "/api/browser-aside/session", "POST", {});
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
    scheduleBrowserFramePoll();
  } catch (error) {
    setBrowserStatus(
      error.status === 503
        ? "Chromium 설치: uv sync --extra browser && uv run playwright install chromium"
        : "브라우저를 시작하지 못했습니다",
      "error",
    );
  }
}

function collapseBrowserAside() {
  stopBrowserFramePoll();
  resetBrowserFrame();
  $("workspace-shell").classList.remove("browser-open");
  $("browser-aside").setAttribute("aria-hidden", "true");
  $("browser-aside-toggle").setAttribute("aria-expanded", "false");
  $("browser-aside-toggle").textContent = "브라우저 열기";
}

async function navigateBrowserAside() {
  const url = $("browser-aside-url").value.trim();
  if (!url) return;
  setBrowserStatus("페이지 이동 중", "loading");
  try {
    const current = await browserJSON(
      "/api/browser-aside/session", "POST", {});
    browserControlSequence += 1;
    sessionStorage.setItem(
      "birkin-browser-control-sequence",
      String(browserControlSequence),
    );
    const status = await browserJSON(
      "/api/browser-aside/navigate", "POST", {
        url,
        browser_generation: current.browser_generation,
        browser_revision: current.browser_revision,
        control_epoch: current.control_epoch,
        control_sequence: browserControlSequence,
      });
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
  } catch (error) {
    setBrowserStatus(
      error.status === 400
        ? "http 또는 https 주소만 사용할 수 있습니다"
        : "페이지를 열지 못했습니다",
      error.status === 400 ? "blocked" : "error",
    );
  }
}

function stateByAttention(n) {
  return Object.keys(enc).find((s) => enc[s].attention === n);
}
function encOf(state) {
  return enc[state] || enc[stateByAttention(3)];
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function contextValue(rec, names, fallback) {
  const payload = rec.payload || {};
  for (const name of names) {
    if (rec[name] != null && rec[name] !== "") return rec[name];
    if (payload[name] != null && payload[name] !== "") return payload[name];
  }
  return fallback;
}

async function loadContract() {
  const c = await getJSON("/api/contract");
  enc = c.uistate["x-birkin-encoding"];
  const root = document.documentElement;
  const storedTheme = localStorage.getItem("birkin.workspace.theme");
  const preferredTheme = storedTheme || (
    window.matchMedia("(prefers-color-scheme: light)").matches
      ? "paper_light"
      : c.workspace_theme.default
  );
  const selected = c.workspace_theme.palettes[preferredTheme]
    ? preferredTheme
    : c.workspace_theme.default;
  for (const [role, value] of Object.entries(
    c.workspace_theme.palettes[selected]
  )) {
    root.style.setProperty(
      `--birkin-${role.replace(/_/g, "-")}`,
      value,
    );
  }
  root.dataset.theme = selected;
  root.style.colorScheme = selected === "paper_light" ? "light" : "dark";
}

function buildQueue(approvals, jobsData, runs) {
  const out = [];
  for (const rec of approvals) {
    out.push({ kind: "approval", id: rec.id, title: rec.title || rec.category,
               state: rec.ui_state || stateByAttention(3), rec });
  }
  const jobs = (jobsData && jobsData.jobs) || [];
  for (const job of jobs) {
    out.push({ kind: "cron", id: "job:" + (job.id || job.name),
               title: job.name || "예약 작업", state: job.ui_state,
               rec: { title: job.name || "예약 작업", origin: "scheduler",
                      category: "cron", description: job.schedule?.display || job.next_run || "",
                      target: job.name, expected_impact: "예약된 시각에 작업을 시작합니다.",
                      rejection_result: "이 화면에서는 예약을 변경하지 않습니다.",
                      evidence: job.last_run || "실행 기록 없음", risk: 0,
                      created: job.created || "", payload: job } });
  }
  for (const run of runs || []) {
    const runId = run.id || run.created || String(out.length);
    const error = (run.details || {}).error || "";
    out.push({ kind: "run", id: "run:" + runId,
               title: run.title || run.kind || "최근 활동", state: run.ui_state,
               rec: { title: run.title || run.kind || "최근 활동",
                      origin: run.kind || "runtime", category: "recent_run",
                      description: error || run.status || "완료된 실행",
                      target: runId, expected_impact: "이미 기록된 실행 결과입니다.",
                      rejection_result: "읽기 전용 기록에는 적용되지 않습니다.",
                      evidence: error || "실행 기록", risk: error ? 2 : 0,
                      created: run.created || "", payload: run } });
  }
  out.sort((a, b) => encOf(a.state).attention - encOf(b.state).attention);
  const urgent = out.filter((item) => encOf(item.state).attention < 7);
  const scheduled = out.filter((item) => encOf(item.state).attention === 7).slice(0, 4);
  const recent = out.filter((item) => encOf(item.state).attention === 8).slice(0, 4);
  return urgent.concat(scheduled, recent);
}

function renderQueue() {
  const list = $("queue");
  list.innerHTML = "";
  const waiting = items.filter((it) => encOf(it.state).attention === 0).length;
  $("ledger-summary").textContent = "주의 필요 — 대기 " + waiting;
  const notice = $("queue-notice");
  notice.hidden = !queueNotice;
  notice.textContent = queueNotice;
  const w = $("p-waiting");
  w.hidden = waiting === 0;
  w.textContent = encOf(stateByAttention(0)).glyph + " 대기 " + waiting;
  if (!items.length) {
    list.innerHTML = '<li class="empty">승인 대기 항목 없음</li>';
    return;
  }
  for (const it of items) {
    const e = encOf(it.state);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.id = it.id;
    b.setAttribute("aria-current", String(it.id === selectedId));
    b.setAttribute("aria-label", e.label + " — " + (it.title || ""));
    b.innerHTML =
      '<span class="glyph" style="color:var(--' +
      e.color_role.replace(/_/g, "-") + ')">' + esc(e.glyph) + "</span>" +
      '<span class="t">' + esc(it.title) + "</span>" +
      '<span class="s">' + esc(e.label) + "</span>";
    b.addEventListener("click", () => { selectedCheckpoint = null; selectedId = it.id; renderQueue(); renderCheckpoints(); renderBench(); });
    li.appendChild(b);
    list.appendChild(li);
  }
}

function renderCheckpoints() {
  const list = $("checkpoint-list");
  list.innerHTML = "";
  $("checkpoint-summary").textContent = "Checkpoints — " + checkpointItems.length;
  if (!checkpointItems.length) {
    list.innerHTML = '<li class="empty">아직 checkpoint가 없습니다.</li>';
    return;
  }
  for (const cp of checkpointItems) {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.dataset.checkpoint = cp.hash;
    button.setAttribute("aria-current", String(cp.hash === selectedCheckpoint));
    const events = toolTimeline.filter((event) => event.before === cp.hash || event.after === cp.hash);
    button.innerHTML = '<span class="glyph">◆</span><span class="t">' +
      esc(events[0]?.tool || cp.reason) + '<br><span class="checkpoint-meta">' +
      esc(cp.short) + " · " + esc(cp.date) + '</span></span>';
    button.addEventListener("click", () => {
      selectedCheckpoint = cp.hash; selectedId = null; renderCheckpoints(); renderCheckpointBench(cp);
    });
    li.appendChild(button); list.appendChild(li);
  }
}

async function renderCheckpointBench(cp) {
  const bench = $("bench");
  const events = toolTimeline.filter((event) => event.before === cp.hash || event.after === cp.hash);
  const forks = checkpointLineage.filter((entry) => entry.checkpoint === cp.hash);
  bench.innerHTML = '<div class="card"><h2>◆ Checkpoint ' + esc(cp.short) + '</h2>' +
    '<dl class="meta"><dt>Reason</dt><dd>' + esc(cp.reason) + '</dd>' +
    '<dt>Tool timeline</dt><dd>' + esc(events.map((e) => e.tool + " · " + e.status + " · " + (e.touched || []).join(", ")).join(" | ") || "snapshot") + '</dd>' +
    '<dt>Alternate lineage</dt><dd>' + esc(forks.length ? forks.map((f) => f.status).join(", ") : "none") + '</dd></dl>' +
    '<div class="actions"><button id="checkpoint-diff">Preview diff</button>' +
    '<select class="restore-mode" id="restore-mode" aria-label="Restore mode">' +
    '<option value="files">Files only</option><option value="task">Task state only</option>' +
    '<option value="both">Files and task state</option></select>' +
    '<button class="no" id="checkpoint-restore">Request restore</button></div>' +
    '<div class="actions"><input class="fork-command" id="fork-command" aria-label="Alternate command" ' +
    'value=\'["python","-c","print(42)"]\' />' +
    '<button id="checkpoint-fork">Run alternate branch</button></div>' +
    '<pre class="diff-preview" id="checkpoint-output" hidden></pre>' +
    '<div id="announce" role="status" aria-live="polite"></div></div>';
  $("checkpoint-diff").addEventListener("click", async () => {
    const preview = await getJSON("/api/checkpoints/" + cp.hash + "/diff");
    const output = $("checkpoint-output"); output.hidden = false;
    output.textContent = preview.patch || "No differences from current files.";
  });
  $("checkpoint-restore").addEventListener("click", async () => {
    const mode = $("restore-mode").value;
    if (!window.confirm("Queue " + mode + " restore for explicit approval?")) return;
    const response = await fetch("/api/checkpoints/" + cp.hash + "/restore", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({mode})});
    const out = await response.json();
    if (!response.ok) { $("announce").textContent = "Restore request failed: " + (out.error || response.status); return; }
    $("announce").innerHTML = 'Restore queued for approval. <button id="approve-restore">Approve now</button>';
    $("approve-restore").addEventListener("click", () => requestConfirmation(out.approval_id, "approve"));
  });
  $("checkpoint-fork").addEventListener("click", async () => {
    let command;
    try { command = JSON.parse($("fork-command").value); }
    catch (_) { $("announce").textContent = "Command must be a JSON string array."; return; }
    $("announce").textContent = "Running isolated alternate branch…";
    const response = await fetch("/api/checkpoints/" + cp.hash + "/fork", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({command})});
    const out = await response.json();
    $("announce").textContent = response.ok ? "Alternate branch complete: " + (out.stdout || "exit 0") : "Fork failed: " + (out.error || out.stderr || response.status);
    await refreshCheckpoints();
  });
}

function renderBench() {
  const bench = $("bench");
  if (selectedCheckpoint) {
    const checkpoint = checkpointItems.find((cp) => cp.hash === selectedCheckpoint);
    if (checkpoint) { renderCheckpointBench(checkpoint); return; }
  }
  const it = items.find((x) => x.id === selectedId) || items[0];
  if (!it) {
    bench.innerHTML = '<p class="empty">표시할 항목이 없습니다.</p>';
    return;
  }
  selectedId = it.id;
  const rec = it.rec;
  const e = encOf(it.state);
  const canAct = e.attention === 0;
  const riskClass = rec.risk >= 3 ? "risk-high" : rec.risk >= 2 ? "risk-mid" : "";
  const target = contextValue(
    rec, ["target", "path", "command", "name"], rec.category || "요청 대상");
  const expectedImpact = contextValue(
    rec, ["expected_impact", "impact"], rec.description || "변경 내용은 payload를 확인하세요.");
  const rejectionResult = contextValue(
    rec, ["rejection_result"], "동작은 실행되지 않고 거부 기록만 남습니다.");
  const relatedEvidence = contextValue(
    rec, ["evidence", "evidence_path", "source"], "연결된 근거 없음");
  const payload = rec.payload && Object.keys(rec.payload).length
    ? "<details class=\"payload\"><summary>요청 payload 보기 (" +
      Object.keys(rec.payload).length + "개 항목)</summary><pre>" +
      esc(JSON.stringify(rec.payload, null, 2)) + "</pre></details>"
    : "";
  bench.innerHTML =
    '<div class="card">' +
    '<h2><span class="badge" style="color:var(--' +
    e.color_role.replace(/_/g, "-") + ')">' + esc(e.glyph) + " " +
    esc(e.label) + "</span> " + esc(rec.title || "") + "</h2>" +
    '<dl class="meta">' +
    "<dt>요청 주체</dt><dd>" + esc(rec.origin || "?") + "</dd>" +
     "<dt>유형</dt><dd>" + esc(rec.category || "?") + "</dd>" +
     '<dt id="target">대상</dt><dd aria-labelledby="target">' + esc(target) + "</dd>" +
     "<dt>동작</dt><dd>" + esc(rec.description || "") + "</dd>" +
     '<dt id="expected-impact">예상 영향</dt><dd aria-labelledby="expected-impact">' +
       esc(expectedImpact) + "</dd>" +
     '<dt id="rejection-result">거부 결과</dt><dd aria-labelledby="rejection-result">' +
       esc(rejectionResult) + "</dd>" +
     '<dt id="related-evidence">관련 근거</dt><dd aria-labelledby="related-evidence">' +
       esc(relatedEvidence) + "</dd>" +
    '<dt>위험도</dt><dd class="' + riskClass + '">' + esc(rec.risk ?? "?") + "</dd>" +
    "<dt>만료</dt><dd>" + esc(rec.expires_at || "없음") + "</dd>" +
    "<dt>생성</dt><dd>" + esc(rec.created || "") + "</dd>" +
    "</dl>" + payload +
    (canAct
      ? '<div class="actions">' +
        '<button class="ok" id="btn-approve">승인 요청</button>' +
        '<button class="no" id="btn-reject">거부 요청</button></div>' +
      '<p class="authority-note">승인 후 실제 실행 주체는 Python daemon입니다. ' +
        "거부 시 동작은 실행되지 않고 기록만 남습니다. " +
        "버튼은 요청만 보내며, 결과는 authority 응답 후 반영됩니다.</p>"
      : "") +
    '<div id="announce" role="status" aria-live="polite"></div>';
  if (canAct) {
    $("btn-approve").addEventListener("click", () => requestConfirmation(rec.id, "approve"));
    $("btn-reject").addEventListener("click", () => requestConfirmation(rec.id, "reject"));
  }
}

function requestConfirmation(id, action) {
  const label = action === "approve" ? "승인" : "거부";
  if (window.confirm(label + " 요청을 Python authority에 보내시겠습니까?")) {
    resolve(id, action);
  }
}

async function resolve(id, action) {
  if (busy) return;
  busy = true;
  const announce = $("announce");
  for (const b of document.querySelectorAll(".actions button")) b.disabled = true;
  announce.textContent = "요청 전송 중 — authority 응답 대기";
  try {
    const r = await fetch("/api/approvals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, action }),
    });
    const out = await r.json().catch(() => ({}));
    if (r.ok && out.ok !== false) {
      announce.textContent = "완료: " + (out.result || action);
      await refresh();               // state changes only after authority reply
    } else {
      announce.textContent = "실패: " + (out.error || r.status);
      for (const b of document.querySelectorAll(".actions button")) b.disabled = false;
    }
  } catch (err) {
    announce.textContent = "전송 실패 — 연결 상태를 확인하세요";
    for (const b of document.querySelectorAll(".actions button")) b.disabled = false;
    setDisconnected(true);
  } finally {
    busy = false;
  }
}

function setDisconnected(down) {
  $("banner").classList.toggle("show", down);
}

function renderLens(status, jobsData, runs) {
  const env = $("lens-env");
  env.innerHTML = "";
  const rows = [["모델", status.model], ["프로바이더", status.provider],
                ["버전", status.version], ["볼트", status.vault],
                ["스킬", status.skills_count],
                ["다음 야간작업", status.next_nightly || "-"]];
  for (const [k, v] of rows) {
    env.innerHTML += "<li><span class=\"k\">" + esc(k) + "</span> " + esc(v ?? "-") + "</li>";
  }
  const jobs = (jobsData && jobsData.jobs) || [];
  $("lens-jobs").innerHTML = jobs.length
    ? jobs.slice(0, 8).map((j) =>
        "<li>" + esc(j.name || "?") + " <span class=\"k\">" +
        esc(j.next_run || "") + "</span></li>").join("")
    : '<li class="empty">없음</li>';
  $("lens-runs").innerHTML = (runs || []).length
    ? runs.slice(0, 8).map((r) => {
        const err = (r.details || {}).error || "";
        const state = encOf(r.ui_state);
        const badge = ' <span class="k" style="color:var(--' +
          state.color_role.replace(/_/g, "-") + ')">' +
          esc(err || state.label) + "</span>";
        return "<li>" + esc(r.title || r.kind || r.id || "run") + badge + "</li>";
      }).join("")
    : '<li class="empty">없음</li>';
}

async function refreshCheckpoints() {
  try {
    [checkpointItems, toolTimeline, checkpointLineage] = await Promise.all([
      getJSON("/api/checkpoints"), getJSON("/api/checkpoints/timeline"),
      getJSON("/api/checkpoints/lineage")]);
    if (selectedCheckpoint && !checkpointItems.some((cp) => cp.hash === selectedCheckpoint)) selectedCheckpoint = null;
    renderCheckpoints();
  } catch (_) {
    checkpointItems = []; toolTimeline = []; checkpointLineage = []; renderCheckpoints();
  }
}

async function refresh() {
  try {
    const [status, jobs, runs] = await Promise.all([
      getJSON("/api/status"), getJSON("/api/jobs"), getJSON("/api/runs")]);
    let approvals = [];
    queueNotice = "";
    try {
      approvals = await getJSON("/api/approvals");
    } catch (err) {
      if (err.status === 403) {
        queueNotice = "승인 목록은 보안 토큰이 필요합니다 — birkin web이 출력한 주소로 접속하세요.";
      } else { throw err; }
    }
    setDisconnected(false);
    $("p-daemon").textContent = status.daemon ? "데몬 연결" : "데몬 오프라인";
    $("p-daemon").className = status.daemon ? "seg" : "seg down";
    $("p-model").textContent = status.model || "";
    $("p-version").textContent = status.version ? "v" + status.version : "";
    items = buildQueue(approvals, jobs, runs);
    if (items.length && !items.some((item) => item.id === selectedId)) {
      selectedId = items[0].id;
    } else if (!items.length) {
      selectedId = null;
    }
    renderQueue();
    renderBench();
    renderLens(status, jobs, runs);
    await refreshCheckpoints();
  } catch (err) {
    setDisconnected(true);
    $("p-daemon").textContent = "연결 끊김";
    $("p-daemon").className = "seg down";
  }
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  const idx = items.findIndex((x) => x.id === selectedId);
  const next = ev.key === "ArrowDown" ? idx + 1 : idx - 1;
  if (next >= 0 && next < items.length) {
    selectedId = items[next].id;
    renderQueue(); renderBench();
    const btn = document.querySelector('.queue button[data-id="' + selectedId + '"]');
    if (btn) btn.focus();
    ev.preventDefault();
  }
});

$("lens-toggle").addEventListener("click", () => {
  const lens = $("lens");
  const open = lens.classList.toggle("open");
  $("lens-toggle").setAttribute("aria-expanded", String(open));
  $("lens-toggle").textContent = open ? "맥락 닫기" : "맥락 보기";
});

$("browser-aside-toggle").addEventListener("click", () => {
  if ($("workspace-shell").classList.contains("browser-open")) {
    collapseBrowserAside();
  } else {
    void openBrowserAside();
  }
});

$("browser-aside-form").addEventListener("submit", (event) => {
  event.preventDefault();
  void navigateBrowserAside();
});

(async function boot() {
  try { await loadContract(); } catch (err) { /* fallbacks stay */ }
  await refresh();
  setInterval(refresh, 15000);
})();
</script>
