<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>birkin workbench</title>
<style>
/* Tokens arrive from /api/contract (Python-owned). The values below are
   neutral boot fallbacks only, never a copy of the palette. */
:root {
  --surface: #111214; --surface-elevated: #1a1b1e;
  --text-primary: #e8e8e8; --text-muted: #9a9a9a;
  --accent: #cccccc; --running: #bbbbbb; --waiting-human: #dddddd;
  --waiting-dependency: #aaaaaa; --success: #bbbbbb; --warning: #cccccc;
  --failure: #dddddd; --evidence: #bbbbbb; --memory: #bbbbbb;
  --diff-add: #bbbbbb; --diff-remove: #cccccc; --focus: #ffffff;
  --selection: #333333;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface); color: var(--text-primary);
  font: 15px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
button { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--selection); }

.app {
  display: grid; min-height: 100vh;
  grid-template-rows: auto 1fr;
  grid-template-areas: "pulse" "main";
}
.pulse {
  grid-area: pulse; display: flex; flex-wrap: wrap; gap: .35rem 1rem;
  align-items: center; padding: .55rem .9rem;
  background: var(--surface-elevated);
  border-bottom: 1px solid var(--selection);
}
.pulse .brand { font-weight: 700; color: var(--accent); }
.pulse .seg { color: var(--text-muted); font-size: .86rem; }
.pulse .seg.alert { color: var(--waiting-human); font-weight: 600; }
.pulse .seg.down { color: var(--failure); font-weight: 600; }

.main { grid-area: main; display: grid; gap: 0; grid-template-areas: "ledger" "bench"; }
.ledger { border-bottom: 1px solid var(--selection); }
.bench { padding: 1rem; min-width: 0; }
.lens { display: none; padding: 1rem; border-left: 1px solid var(--selection); }

@media (min-width: 768px) {
  .main { grid-template-columns: 300px minmax(0,1fr); grid-template-areas: "ledger bench"; }
  .ledger { border-right: 1px solid var(--selection); border-bottom: none; }
  .ledger details { display: contents; }
  .ledger summary { display: none; }
}
@media (min-width: 1440px) {
  .main { grid-template-columns: 320px minmax(0,1fr) 320px; grid-template-areas: "ledger bench lens"; }
  .lens { display: block; }
}

.ledger summary {
  cursor: pointer; padding: .6rem .9rem; font-weight: 600;
  color: var(--waiting-human);
}
.queue { list-style: none; margin: 0; padding: .4rem; }
.queue li { margin: 0; }
.queue button {
  display: flex; gap: .5rem; align-items: baseline; width: 100%;
  text-align: left; padding: .45rem .55rem; border: 0; border-radius: 6px;
  background: transparent; color: var(--text-primary); cursor: pointer;
}
.queue button[aria-current="true"] { background: var(--selection); }
.queue .glyph { flex: none; width: 1.1em; text-align: center; }
.queue .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue .s { flex: none; font-size: .78rem; color: var(--text-muted); }

.card {
  background: var(--surface-elevated); border: 1px solid var(--selection);
  border-radius: 10px; padding: 1rem; max-width: 52rem;
}
.card h2 { margin: 0 0 .6rem; font-size: 1.05rem; }
.badge { font-weight: 600; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; margin: .6rem 0; }
.meta dt { color: var(--text-muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.risk-high { color: var(--failure); font-weight: 700; }
.risk-mid  { color: var(--warning); font-weight: 600; }
details.payload { margin: .6rem 0; }
details.payload > summary { cursor: pointer; color: var(--evidence); }
details.payload pre {
  max-height: 16rem; overflow: auto; background: var(--surface);
  padding: .6rem; border-radius: 6px; font-size: .82rem;
}
.actions { display: flex; gap: .6rem; margin-top: .8rem; flex-wrap: wrap; }
.actions button {
  padding: .5rem 1.1rem; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--selection); background: var(--surface);
  color: var(--text-primary);
}
.actions button.ok { border-color: var(--success); }
.actions button.no { border-color: var(--failure); }
.actions button:disabled { opacity: .55; cursor: wait; }
.authority-note { color: var(--text-muted); font-size: .82rem; margin-top: .5rem; }
#announce { min-height: 1.4em; margin-top: .6rem; color: var(--accent); }

.banner {
  display: none; padding: .6rem .9rem; background: var(--surface-elevated);
  color: var(--warning); border-bottom: 1px solid var(--warning);
}
.banner code { color: var(--text-primary); }
.banner.show { display: block; }

.lens h3, .activity h3 { font-size: .9rem; color: var(--text-muted); margin: 1rem 0 .35rem; }
.lens ul, .activity ul { list-style: none; margin: 0; padding: 0; font-size: .86rem; }
.lens li, .activity li { padding: .18rem 0; color: var(--text-primary); }
.lens .k { color: var(--text-muted); }
.empty { color: var(--text-muted); padding: 1rem 0; }

@media (prefers-reduced-motion: no-preference) {
  .queue button, .actions button { transition: background .15s ease, border-color .15s ease; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="pulse" aria-label="상태 맥박">
    <span class="brand">birkin</span>
    <span class="seg" id="p-daemon">데몬 확인 중</span>
    <span class="seg alert" id="p-waiting" hidden></span>
    <span class="seg" id="p-model"></span>
    <span class="seg" id="p-version"></span>
  </header>
  <div class="banner" id="banner" role="alert">
    연결이 끊어졌습니다 — 복구: <code>birkin web</code> 재실행 또는 데몬 확인
    (<code>birkin daemon start</code>). 재연결되면 승인 상태를 다시 불러옵니다.
  </div>
  <div class="main">
    <nav class="ledger" aria-label="주의 대기열">
      <details open>
        <summary id="ledger-summary">주의 필요</summary>
        <ul class="queue" id="queue" role="list"></ul>
      </details>
    </nav>
    <main class="bench" id="bench" aria-label="작업면" tabindex="-1">
      <p class="empty">항목을 선택하면 상세가 표시됩니다.</p>
    </main>
    <aside class="lens" aria-label="맥락 렌즈">
      <h3>실행 환경</h3>
      <ul id="lens-env"></ul>
      <h3>예약된 잡</h3>
      <ul id="lens-jobs"></ul>
      <div class="activity">
        <h3>최근 활동</h3>
        <ul id="lens-runs"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";
let enc = null;                 // state encoding from /api/contract
let items = [];                 // attention queue
let selectedId = null;
let busy = false;

const $ = (id) => document.getElementById(id);

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }
  return r.json();
}

function stateByAttention(n) {
  return Object.keys(enc).find((s) => enc[s].attention === n);
}
function encOf(state) {
  return enc[state] || enc[stateByAttention(3)];
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadContract() {
  const c = await getJSON("/api/contract");
  enc = c.uistate["x-birkin-encoding"];
  const root = document.documentElement;
  for (const [name, entry] of Object.entries(c.tokens.tokens)) {
    root.style.setProperty("--" + name.replace(/_/g, "-"), entry.hex);
  }
}

function buildQueue(approvals) {
  const out = [];
  for (const rec of approvals) {
    out.push({ kind: "approval", id: rec.id, title: rec.title || rec.category,
               state: rec.ui_state || stateByAttention(3), rec });
  }
  out.sort((a, b) => encOf(a.state).attention - encOf(b.state).attention);
  return out;
}

function renderQueue() {
  const list = $("queue");
  list.innerHTML = "";
  const waiting = items.filter((it) => encOf(it.state).attention === 0).length;
  $("ledger-summary").textContent = "주의 필요 — 대기 " + waiting;
  const w = $("p-waiting");
  w.hidden = waiting === 0;
  w.textContent = encOf(stateByAttention(0)).glyph + " 대기 " + waiting;
  if (!items.length) {
    list.innerHTML = '<li class="empty">승인 대기 항목 없음</li>';
    return;
  }
  for (const it of items) {
    const e = encOf(it.state);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.id = it.id;
    b.setAttribute("aria-current", String(it.id === selectedId));
    b.setAttribute("aria-label", e.label + " — " + (it.title || ""));
    b.innerHTML =
      '<span class="glyph" style="color:var(--' +
      e.color_role.replace(/_/g, "-") + ')">' + esc(e.glyph) + "</span>" +
      '<span class="t">' + esc(it.title) + "</span>" +
      '<span class="s">' + esc(e.label) + "</span>";
    b.addEventListener("click", () => { selectedId = it.id; renderQueue(); renderBench(); });
    li.appendChild(b);
    list.appendChild(li);
  }
}

function renderBench() {
  const bench = $("bench");
  const it = items.find((x) => x.id === selectedId) || items[0];
  if (!it) {
    bench.innerHTML = '<p class="empty">표시할 항목이 없습니다.</p>';
    return;
  }
  selectedId = it.id;
  const rec = it.rec;
  const e = encOf(it.state);
  const canAct = e.attention === 0;
  const riskClass = rec.risk >= 3 ? "risk-high" : rec.risk >= 2 ? "risk-mid" : "";
  const payload = rec.payload && Object.keys(rec.payload).length
    ? "<details class=\"payload\"><summary>요청 payload 보기 (" +
      Object.keys(rec.payload).length + "개 항목)</summary><pre>" +
      esc(JSON.stringify(rec.payload, null, 2)) + "</pre></details>"
    : "";
  bench.innerHTML =
    '<div class="card">' +
    '<h2><span class="badge" style="color:var(--' +
    e.color_role.replace(/_/g, "-") + ')">' + esc(e.glyph) + " " +
    esc(e.label) + "</span> " + esc(rec.title || "") + "</h2>" +
    '<dl class="meta">' +
    "<dt>요청 주체</dt><dd>" + esc(rec.origin || "?") + "</dd>" +
    "<dt>유형</dt><dd>" + esc(rec.category || "?") + "</dd>" +
    "<dt>동작</dt><dd>" + esc(rec.description || "") + "</dd>" +
    '<dt>위험도</dt><dd class="' + riskClass + '">' + esc(rec.risk ?? "?") + "</dd>" +
    "<dt>만료</dt><dd>" + esc(rec.expires_at || "없음") + "</dd>" +
    "<dt>생성</dt><dd>" + esc(rec.created || "") + "</dd>" +
    "</dl>" + payload +
    (canAct
      ? '<div class="actions">' +
        '<button class="ok" id="btn-approve">승인 요청</button>' +
        '<button class="no" id="btn-reject">거부 요청</button></div>' +
      '<p class="authority-note">승인 후 실제 실행 주체는 Python daemon입니다. ' +
        "거부 시 동작은 실행되지 않고 기록만 남습니다. " +
        "버튼은 요청만 보내며, 결과는 authority 응답 후 반영됩니다.</p>"
      : "") +
    '<div id="announce" role="status" aria-live="polite"></div>';
  if (canAct) {
    $("btn-approve").addEventListener("click", () => resolve(rec.id, "approve"));
    $("btn-reject").addEventListener("click", () => resolve(rec.id, "reject"));
  }
}

async function resolve(id, action) {
  if (busy) return;
  busy = true;
  const announce = $("announce");
  for (const b of document.querySelectorAll(".actions button")) b.disabled = true;
  announce.textContent = "요청 전송 중 — authority 응답 대기";
  try {
    const r = await fetch("/api/approvals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, action }),
    });
    const out = await r.json().catch(() => ({}));
    if (r.ok && out.ok !== false) {
      announce.textContent = "완료: " + (out.result || action);
      await refresh();               // state changes only after authority reply
    } else {
      announce.textContent = "실패: " + (out.error || r.status);
      for (const b of document.querySelectorAll(".actions button")) b.disabled = false;
    }
  } catch (err) {
    announce.textContent = "전송 실패 — 연결 상태를 확인하세요";
    for (const b of document.querySelectorAll(".actions button")) b.disabled = false;
    setDisconnected(true);
  } finally {
    busy = false;
  }
}

function setDisconnected(down) {
  $("banner").classList.toggle("show", down);
}

function renderLens(status, jobsData, runs) {
  const env = $("lens-env");
  env.innerHTML = "";
  const rows = [["모델", status.model], ["프로바이더", status.provider],
                ["버전", status.version], ["볼트", status.vault],
                ["스킬", status.skills_count],
                ["다음 야간작업", status.next_nightly || "-"]];
  for (const [k, v] of rows) {
    env.innerHTML += "<li><span class=\"k\">" + esc(k) + "</span> " + esc(v ?? "-") + "</li>";
  }
  const jobs = (jobsData && jobsData.jobs) || [];
  $("lens-jobs").innerHTML = jobs.length
    ? jobs.slice(0, 8).map((j) =>
        "<li>" + esc(j.name || "?") + " <span class=\"k\">" +
        esc(j.next_run || "") + "</span></li>").join("")
    : '<li class="empty">없음</li>';
  $("lens-runs").innerHTML = (runs || []).length
    ? runs.slice(0, 8).map((r) =>
        "<li>" + esc(r.title || r.kind || r.id || "run") +
        " <span class=\"k\">" + esc(r.status || "") + "</span></li>").join("")
    : '<li class="empty">없음</li>';
}

async function refresh() {
  try {
    const [status, jobs, runs] = await Promise.all([
      getJSON("/api/status"), getJSON("/api/jobs"), getJSON("/api/runs")]);
    let approvals = [];
    try {
      approvals = await getJSON("/api/approvals");
    } catch (err) {
      if (err.status === 403) {
        $("bench").innerHTML =
          '<p class="empty">승인 목록은 보안 토큰이 필요합니다 — ' +
          "<code>birkin web</code>이 출력한 주소로 접속하세요.</p>";
      } else { throw err; }
    }
    setDisconnected(false);
    $("p-daemon").textContent = status.daemon ? "데몬 연결" : "데몬 오프라인";
    $("p-daemon").className = status.daemon ? "seg" : "seg down";
    $("p-model").textContent = status.model || "";
    $("p-version").textContent = status.version ? "v" + status.version : "";
    items = buildQueue(approvals);
    renderQueue();
    renderBench();
    renderLens(status, jobs, runs);
  } catch (err) {
    setDisconnected(true);
    $("p-daemon").textContent = "연결 끊김";
    $("p-daemon").className = "seg down";
  }
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  const idx = items.findIndex((x) => x.id === selectedId);
  const next = ev.key === "ArrowDown" ? idx + 1 : idx - 1;
  if (next >= 0 && next < items.length) {
    selectedId = items[next].id;
    renderQueue(); renderBench();
    const btn = document.querySelector('.queue button[data-id="' + selectedId + '"]');
    if (btn) btn.focus();
    ev.preventDefault();
  }
});

(async function boot() {
  try { await loadContract(); } catch (err) { /* fallbacks stay */ }
  await refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
