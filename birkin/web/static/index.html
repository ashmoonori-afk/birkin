    ["포커스 유지", item.focus_preserved],
    ["승인", item.approval_id || item.review_id],
    ["영수증", item.receipt_ref],
    ["스냅샷", item.snapshot_ref],
  ]);
  section.appendChild(fields);
  panelBody.appendChild(section);
}

async function handleApprovalAnswered(payload) {
  const approvalId = String(payload.approval_id || "");
  busyApprovalIds.delete(approvalId);
  const outcome = String(payload.outcome || "");
  const summary = String(payload.result_summary || "");
  if (outcome === "approved") {
    const workspaceReceipt = String(payload.receipt || "");
    if (workspaceReceipt) {
      const receipt = {receipt: workspaceReceipt};
      recentReceipts.set(approvalId, receipt);
      announce(summary || "승인한 작업을 실행했습니다. 영수증 세부 정보에서 결과를 확인하세요.");
    } else {
      try {
        const receipt = await api(
          `/api/actions/${encodeURIComponent(approvalId)}/receipt`
        );
        recentReceipts.set(approvalId, receipt);
        announce(summary || "승인한 작업을 실행했습니다. 영수증 세부 정보에서 결과를 확인하세요.");
      } catch (error) {
        console.error("approval receipt unavailable", error);
        announce(
          summary
          || "작업은 실행됐지만 영수증을 불러오지 못했습니다. 잠시 후 다시 확인하세요."
        );
      }
    }
  } else if (outcome === "rejected") {
    announce(summary || "거부 처리 완료 · 동작은 실행되지 않았습니다.");
  } else {
    announce(
      summary || "승인 요청을 처리하지 못했습니다. 승인 목록에서 상태를 확인하세요."
    );
  }
  await refreshWorkspaceSnapshot();
  await refreshLegacyPanels();
}

function handleWorkspaceEvent(raw) {
  const event = JSON.parse(raw.data);
  const cursor = Number(event.cursor || 0);
  if (cursor <= state.cursor) return;
  state.cursor = cursor;
  shell.dataset.lastEvent = event.type;
  const payload = event.payload || {};
  const commandId = event.command_id || "";
  if (event.type === "message.user") {
    appendMessage("user", String(payload.text || ""), `${commandId}:user`);
  } else if (event.type === "message.assistant.delta") {
    const followsOutput = isFollowingOutput();
    let content = state.pendingAssistant.get(commandId);
    if (!content) {
      const node = messageNode("assistant", "", `${commandId}:assistant`);
      transcript.appendChild(node);
      content = node.querySelector(".message-content");
      state.pendingAssistant.set(commandId, content);
    }
    content.textContent += String(payload.text || "");
    if (followsOutput) transcript.scrollTop = transcript.scrollHeight;
  } else if (event.type === "message.assistant.completed") {
    const content = state.pendingAssistant.get(commandId);
    if (!content) {
      appendMessage("assistant", String(payload.text || ""), `${commandId}:assistant`);
    } else {
      renderSafeMarkdown(content, String(payload.text || content.textContent || ""));
    }
    state.pendingAssistant.delete(commandId);
    streamStatus.textContent = "Birkin의 응답이 완료되었습니다.";
  } else if (event.type.startsWith("tool.")) {
    const summary = ({
      "tool.started": "도구 실행을 시작했습니다.",
      "tool.completed": "도구 실행을 완료했습니다.",
      "tool.failed": "도구 실행에 실패했습니다.",
    }[event.type] || "도구 상태가 업데이트되었습니다.");
    appendMessage("tool", summary, event.event_id);
  } else if (event.type === "progress.updated") {
    renderProgress(payload, event.event_id);
  } else if (event.type === "command.failed") {
    const approvalId = approvalIdsByCommand.get(commandId);
    if (approvalId) {
      approvalIdsByCommand.delete(commandId);
      busyApprovalIds.delete(approvalId);
      renderPanel();
    }
    console.warn("workspace command failed", payload.error || event.type);
    announce("요청을 완료하지 못했습니다. 잠시 후 다시 시도하세요.");
  } else if (event.type === "error.raised") {
    console.warn("workspace command failed", payload.error || event.type);
    announce("요청을 완료하지 못했습니다. 잠시 후 다시 시도하세요.");
  } else if (event.type === "approval.answered") {
    approvalIdsByCommand.delete(commandId);
    handleApprovalAnswered(payload).catch((error) => {
      console.error("approval result refresh failed", error);
      announce("승인 결과를 반영하지 못했습니다. 잠시 후 다시 시도하세요.");
    });
  } else if (event.type === "approval.requested") {
    Promise.all([
      refreshWorkspaceSnapshot(), refreshApprovals()
    ]).catch((error) => {
      console.error("approval refresh failed", error);
      announce("승인 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.");
    });
  } else if ([
    "question.requested", "question.answered",
    "evidence.added", "checkpoint.restored", "task.updated", "computer.updated",
  ].includes(event.type)) {
    refreshWorkspaceSnapshot().catch((error) => {
      console.error("workspace snapshot refresh failed", error);
      announce("작업 상태를 새로 고치지 못했습니다. 잠시 후 다시 시도하세요.");
    });
  }
}

function connectEvents() {
  if (!state.sessionId) return;
  const generation = state.bootstrapGeneration;
  const sessionId = state.sessionId;
  if (state.reconnectTimer) {
    clearTimeout(state.reconnectTimer);
    state.reconnectTimer = null;
  }
  if (state.source) state.source.close();
  const path = `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}`
    + `/events?after=${state.cursor}`;
  const source = new EventSource(path);
  state.source = source;
  const handleCurrentEvent = (event) => {
    if (state.source !== source || generation !== state.bootstrapGeneration
        || sessionId !== state.sessionId) return;
    handleWorkspaceEvent(event);
  };
  const eventTypes = [
    "command.accepted", "command.started", "command.completed", "command.failed",
    "message.user", "message.assistant.delta", "message.assistant.completed",
    "tool.started", "tool.completed", "tool.failed", "progress.updated",
    "approval.requested", "approval.answered", "question.requested",
    "question.answered", "evidence.added", "checkpoint.restored",
    "computer.updated", "turn.interrupted", "turn.resumed", "error.raised"
  ];
  for (const eventType of eventTypes) {
    source.addEventListener(eventType, handleCurrentEvent);
  }
  source.onopen = () => {
    if (state.source !== source || generation !== state.bootstrapGeneration) return;
    state.reconnectAttempts = 0;
    setConnection("connected", "연결됨");
  };
  source.onerror = () => {
    source.close();
    if (state.source === source && generation === state.bootstrapGeneration) {
      setConnection("connecting", "재연결");
      const delay = Math.min(
        1000 * (2 ** state.reconnectAttempts),
        10000,
      );
      state.reconnectAttempts += 1;
      state.reconnectTimer = setTimeout(connectEvents, delay);
    }
  };
}

function commandId() {
  return `web-${crypto.randomUUID()}`;
}

async function sendCommand(type, payload) {
  if (state.switchingSession) {
    const error = new Error("업무를 전환하는 중입니다. 입력을 유지한 채 잠시 후 다시 시도하세요.");
    error.status = 423;
    throw error;
  }
  const id = commandId();
  const approvalId = type === "approval.answer"
    ? String(payload.approval_id || "")
    : "";
  if (approvalId) approvalIdsByCommand.set(id, approvalId);
  try {
    return await api(
      `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}/commands`,
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          protocol_version: 1,
          command_id: id,
          expected_cursor: state.cursor,
          type,
          payload,
          client_context: {surface: "web", view_id: "browser-1"},
        }),
      }
    );
  } catch (error) {
    approvalIdsByCommand.delete(id);
    throw error;
  }
}

async function optionalLegacyApi(path, fallback) {
  try {
    const payload = await api(path);
    unavailableLegacyPaths.delete(path);
    return payload;
  } catch (error) {
    console.warn(`optional legacy panel unavailable: ${path}`, error);
    unavailableLegacyPaths.add(path);
    return fallback;
  }
}

async function refreshLegacyPanels(expectedGeneration = state.bootstrapGeneration) {
  const [status, jobs, runs] = await Promise.all([
    optionalLegacyApi("/api/status", {}),
    optionalLegacyApi("/api/jobs", []),
    optionalLegacyApi("/api/runs", []),
  ]);
  const agentRuns = await optionalLegacyApi("/api/agent-runs", {runs: []});
  const approvals = await loadApprovals();
  if (expectedGeneration !== state.bootstrapGeneration) return;
  items = buildQueue(approvals, jobs, runs);
  items.push(...agentRunItems(agentRuns.runs));
  items.push({
    id: "runtime-status",
    kind: "status",
    title: status.daemon ? "데몬 연결" : "데몬 오프라인",
    ui_state: status.ui_state,
    detail: `${status.provider || ""} ${status.model || ""}`.trim(),
    record: status,
  });
  const canonicalSelectionExists = (state.snapshot?.panels || []).some(
    (panel) => (panel.items || []).some(
      (item) => item.id === state.selectedId
    )
  );
  if (
    items.length
    && !items.some((item) => item.id === state.selectedId)
    && !canonicalSelectionExists
  ) {
    state.selectedId = items[0].id;
  }
  renderPanel();
}

async function loadApprovals() {
  let approvals = [];
  try {
    approvals = await api("/api/approvals");
  } catch (error) {
    if (error.status !== 403) throw error;
    announce(
      "승인 목록은 보안 토큰이 필요합니다 · birkin web의 bootstrap URL로 접속하세요."
    );
  }
  return approvals;
}

async function refreshApprovals() {
  const approvals = await loadApprovals();
  const approvalItems = buildQueue(approvals, {jobs: []}, []);
  const currentApprovalItems = items.filter((item) => item.kind === "approval");
  if (JSON.stringify(approvalItems) === JSON.stringify(currentApprovalItems)) {
    return;
  }
  items = [
    ...approvalItems,
    ...items.filter((item) => item.kind !== "approval"),
  ];
  renderPanel();
}

function agentRunProjection(runItems) {
  return JSON.stringify(runItems.map((item) => {
    const run = item.record || {};
    return [item.id, run.ui_state, run.controls, run.pending_approvals, run.terminal];
  }));
}

async function refreshLiveAgentRuns() {
  const current = items.filter((item) => item.kind === "agent_run");
  const watching = ["tasks_runs", "activity_logs"].includes(state.activePanel)
    || current.some((item) => !item.record?.terminal);
  if (!watching) return;
  const generation = state.bootstrapGeneration;
  const wasUnavailable = unavailableLegacyPaths.has("/api/agent-runs");
  const payload = await optionalLegacyApi("/api/agent-runs", {runs: []});
  if (generation !== state.bootstrapGeneration) return;
  const unavailable = unavailableLegacyPaths.has("/api/agent-runs");
  const next = unavailable ? current : agentRunItems(payload.runs);
  if (unavailable === wasUnavailable
      && agentRunProjection(next) === agentRunProjection(current)) return;
  // Re-rendering would move focus out of a steer draft or control button.
  if (document.activeElement?.closest("[data-run-controls]")) return;
  items = [
    ...items.filter((item) => !["agent_run", "status"].includes(item.kind)),
    ...next,
    ...items.filter((item) => item.kind === "status"),
  ];
  renderPanel();
}

async function loadAgentRoster(generation) {
  const roster = await optionalLegacyApi("/api/agents", null);
  if (generation !== state.bootstrapGeneration) return;
  state.agentRoster = roster;
  if (state.activePanel === "tasks_runs") renderPanel();
}

function startApprovalRefreshPolling() {
  if (state.approvalRefreshTimer) {
    clearInterval(state.approvalRefreshTimer);
  }
  state.approvalRefreshTimer = setInterval(() => {
    refreshApprovals().catch((error) => {
      console.error("approval refresh polling failed", error);
      announce("승인 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.");
    }).then(() => refreshLiveAgentRuns())
      .catch((error) => console.warn("agent run refresh polling failed", error));
  }, APPROVAL_REFRESH_INTERVAL_MS);
}

async function bootstrap(requestedSession = null) {
  const generation = ++state.bootstrapGeneration;
  state.switchingSession = true;
  if (state.reconnectTimer) {
    clearTimeout(state.reconnectTimer);
    state.reconnectTimer = null;
  }
  if (state.approvalRefreshTimer) {
    clearInterval(state.approvalRefreshTimer);
    state.approvalRefreshTimer = null;
  }
  if (state.source) {
    state.source.close();
    state.source = null;
  }
  setConnection("connecting", "연결 중");
  await loadContract();
  if (generation !== state.bootstrapGeneration) return;
  const sessions = await api("/api/workspace/sessions");
  if (generation !== state.bootstrapGeneration) return;
  const recent = byId("recent-work");
  recent.replaceChildren();
  for (const session of sessions.slice(0, 5)) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "work-nav-button";
    item.textContent = String(session.title || session.session_id || "이름 없는 업무");
    item.addEventListener("click", () => {
      startBootstrap(session.session_id);
    });
    recent.appendChild(item);
  }
  if (!recent.children.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "아직 최근 업무가 없습니다.";
    recent.appendChild(empty);
  }
  const stored = localStorage.getItem("birkin.workspace.session");
  const preferred = requestedSession || stored || sessions[0]?.session_id
    || `web-${crypto.randomUUID()}`;
  const created = await api("/api/workspace/sessions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: preferred}),
  });
  if (generation !== state.bootstrapGeneration) return;
  const sessionId = created.session_id;
  const snapshot = await api(
    `/api/workspace/sessions/${encodeURIComponent(sessionId)}/snapshot`
  );
  if (generation !== state.bootstrapGeneration) return;
  state.sessionId = sessionId;
  localStorage.setItem("birkin.workspace.session", sessionId);
  renderSnapshot(snapshot);
  await refreshLegacyPanels(generation);
  if (generation !== state.bootstrapGeneration) return;
  await loadAgentRoster(generation);
  if (generation !== state.bootstrapGeneration) return;
  state.switchingSession = false;
  startApprovalRefreshPolling();
  connectEvents();
  announce("");
}

function handleBootstrapFailure(error) {
  console.error("workspace bootstrap failed", error);
  setConnection("disconnected", "연결 실패");
  announce("연결 초기화에 실패했습니다. 로컬 bootstrap URL로 다시 열어 주세요.");
}

function startBootstrap(sessionId = null) {
  const expectedGeneration = state.bootstrapGeneration + 1;
  bootstrap(sessionId).catch((error) => {
    if (expectedGeneration === state.bootstrapGeneration) handleBootstrapFailure(error);
  });
}

byId("new-work").addEventListener("click", () => {
  startBootstrap(`web-${crypto.randomUUID()}`);
});

const workspacePanelTabs = [...document.querySelectorAll('[role="tab"][data-panel]')];
function activatePanelTab(tab, returnFocus = null, open = true) {
  state.activePanel = tab.dataset.panel;
  workspacePanelTabs.forEach((entry) => {
    const selected = entry === tab;
    entry.setAttribute("aria-selected", String(selected));
    entry.tabIndex = selected ? 0 : -1;
  });
  byId("workspace-panel-body").setAttribute("aria-labelledby", tab.id || "");
  setPanelOpen(open, returnFocus);
  renderPanel();
}

const compactPanel = window.matchMedia("(max-width: 1100px)");
function setPanelOpen(open, returnFocus = null) {
  const panel = byId("workspace-panel");
  if (returnFocus && !panel.contains(returnFocus)) state.panelReturnFocus = returnFocus;
  shell.dataset.panelOpen = String(open);
  const primaryPanel = ["documents", "approvals"].includes(state.activeView);
  const hidden = compactPanel.matches && !open && !primaryPanel;
  panel.inert = hidden;
  panel.setAttribute("aria-hidden", String(hidden));
  byId("lens-toggle").setAttribute("aria-expanded", String(open));
  if (!open && state.panelReturnFocus?.isConnected) state.panelReturnFocus.focus();
}

const viewCopy = {
  conversation: ["대화", "현재 업무를 이어서 진행하세요."],
  research: ["리서치 보고서", "결론과 출처, 미해결 항목을 함께 검토하세요."],
  documents: ["문서 작업", "가져온 문서와 변경 근거를 검토하세요."],
  approvals: ["승인 검토", "대상과 영향, 변경 내용, 실행 결과를 확인하세요."],
};
function activateWorkView(view, trigger) {
  const returningToConversation = view === "conversation";
  state.activeView = view;
  shell.dataset.workView = view;
  const copy = viewCopy[view] || viewCopy.conversation;
  viewTitle.textContent = copy[0];
  viewDescription.textContent = copy[1];
  workViewButtons.forEach((button) => button.setAttribute(
    "aria-current", button.dataset.workView === view ? "page" : "false"
  ));
  const panelKey = view === "approvals" ? "approvals"
    : ["research", "documents"].includes(view) ? "files_evidence" : null;
  if (panelKey) {
    const tab = workspacePanelTabs.find((entry) => entry.dataset.panel === panelKey);
    if (tab) activatePanelTab(tab, trigger, view !== "research" || !compactPanel.matches);
  } else if (compactPanel.matches) setPanelOpen(false, returningToConversation ? null : trigger);
}
workViewButtons.forEach((button) => button.addEventListener("click", () => {
  activateWorkView(button.dataset.workView, button);
}));
compactPanel.addEventListener("change", () => setPanelOpen(
  compactPanel.matches ? shell.dataset.panelOpen === "true" : true
));
setPanelOpen(!compactPanel.matches);
workspacePanelTabs.forEach((tab, index) => {
  if (!tab.id) tab.id = `panel-tab-${index}`;
  tab.addEventListener("click", () => activatePanelTab(tab));
});
panelTabs.addEventListener("keydown", (event) => {
  const current = workspacePanelTabs.indexOf(document.activeElement);
  if (current < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();
  const target = event.key === "Home" ? 0
    : event.key === "End" ? workspacePanelTabs.length - 1
    : (current + (event.key === "ArrowRight" ? 1 : -1) + workspacePanelTabs.length)
      % workspacePanelTabs.length;
  workspacePanelTabs[target].focus();
  activatePanelTab(workspacePanelTabs[target]);
});

byId("lens-toggle").addEventListener("click", () => {
  setPanelOpen(shell.dataset.panelOpen !== "true", byId("lens-toggle"));
});
mobileBack.addEventListener("click", () => {
  if (state.activeView === "conversation") setPanelOpen(false);
  else activateWorkView("conversation", mobileBack);
});
panelMore.addEventListener("click", () => {
  const expanded = panelTabs.dataset.expanded !== "true";
  panelTabs.dataset.expanded = String(expanded);
  panelMore.setAttribute("aria-expanded", String(expanded));
  panelMore.setAttribute("aria-label", expanded ? "부가 패널 닫기" : "부가 패널 보기");
});
themeSelect.addEventListener("change", async () => {
  const contract = await api("/api/contract");
  applyWorkspaceTheme(contract, themeSelect.value);
});

byId("workspace-composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendButton.disabled = true;
  try {
    await sendCommand("chat.send", {text});
    input.value = "";
    localStorage.setItem("birkin.workspace.draft", "");
  } catch (error) {
    if (error.status === 409) startBootstrap(state.sessionId);
    else if (error.status === 423) {
      announce("업무를 전환하는 중입니다. 입력을 유지한 채 잠시 후 다시 시도하세요.");
    }
    else {
      console.error("workspace message send failed", error);
      announce(
        "메시지를 전송하지 못했습니다. 연결 상태를 확인한 뒤 다시 시도하세요."
      );
    }
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.ctrlKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    byId("workspace-composer").requestSubmit();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    if (state.activeView !== "conversation") {
      activateWorkView("conversation", mobileBack);
    } else if (shell.dataset.panelOpen === "true") {
      setPanelOpen(false);
    } else {
      sendCommand("chat.interrupt", {}).catch((error) => {
        console.error("workspace interrupt failed", error);
        announce("응답 중단 요청에 실패했습니다. 잠시 후 다시 시도하세요.");
      });
    }
  }
});
input.addEventListener("input", () => {
  localStorage.setItem("birkin.workspace.draft", input.value);
});

byId("browser-aside-toggle").addEventListener("click", () => {
  if (shell.classList.contains("browser-open")) {
    collapseBrowserAside();
  } else {
    void openBrowserAside();
  }
});
byId("browser-aside-form").addEventListener("submit", (event) => {
  event.preventDefault();
  void navigateBrowserAside();
});

interruptButton.addEventListener("click", () => {
  sendCommand("chat.interrupt", {}).catch((error) => {
    console.error("workspace interrupt failed", error);
    announce("응답 중단 요청에 실패했습니다. 잠시 후 다시 시도하세요.");
  });
});
resumeButton.addEventListener("click", () => {
  sendCommand("chat.resume", {}).catch((error) => {
    console.error("workspace resume failed", error);
    announce("응답 재개 요청에 실패했습니다. 잠시 후 다시 시도하세요.");
  });
});

startBootstrap();
</script>
