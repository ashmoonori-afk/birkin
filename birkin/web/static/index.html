<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Birkin · Workspace</title>
<style>
  :root {
    --birkin-accent: Highlight;
    --birkin-border: GrayText;
    --birkin-border-accent: Highlight;
    --birkin-border-muted: GrayText;
    --birkin-text: CanvasText;
    --birkin-muted: GrayText;
    --birkin-dim: GrayText;
    --birkin-background: Canvas;
    --birkin-surface: Field;
    --birkin-surface-raised: ButtonFace;
    --birkin-focus-ring: Highlight;
    --birkin-success: LinkText;
    --birkin-warning: Highlight;
    --birkin-error: ActiveText;
    --birkin-info: LinkText;
    --birkin-pending: Highlight;
    --birkin-blocked: ActiveText;
    --birkin-action-needed: Highlight;
    --birkin-selected-bg: ButtonFace;
    --birkin-user-message-bg: Canvas;
    --birkin-assistant-message-bg: Canvas;
    --birkin-thinking-bg: Canvas;
    --birkin-tool-pending-bg: Canvas;
    --birkin-tool-success-bg: Canvas;
    --birkin-tool-error-bg: Canvas;
    --birkin-action-needed-bg: Canvas;
    --birkin-evidence-bg: Canvas;
    --birkin-composer-bg: Canvas;
    --background: var(--birkin-background);
    --surface: var(--birkin-surface);
    --surface-raised: var(--birkin-surface-raised);
    --border: var(--birkin-border);
    --border-muted: var(--birkin-border-muted);
    --accent: var(--birkin-accent);
    --text: var(--birkin-text);
    --muted: var(--birkin-muted);
    --dim: var(--birkin-dim);
    --success: var(--birkin-success);
    --warning: var(--birkin-warning);
    --error: var(--birkin-error);
    --info: var(--birkin-info);
    --pending: var(--birkin-pending);
    --focus-ring: var(--birkin-focus-ring);
    --composer-bg: var(--birkin-composer-bg);
    --radius: 14px;
    --space: clamp(12px, 2vw, 22px);
    --composer-reserved: 164px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
      ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 34rem),
      var(--background);
    color: var(--text);
  }
  button, textarea { font: inherit; }
  button { color: inherit; }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .workspace {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 11px var(--space);
    border-bottom: 1px solid var(--border-muted);
    background: color-mix(in srgb, var(--background) 90%, transparent);
    backdrop-filter: blur(18px);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .brand strong { letter-spacing: .035em; }
  .brand span { color: var(--dim); font-size: .78rem; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .connection {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: .8rem;
  }
  .connection::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--warning);
  }
  .connection[data-state="connected"]::before { background: var(--success); }
  .connection[data-state="disconnected"]::before { background: var(--error); }
  .icon-button {
    border: 1px solid var(--border-muted);
    border-radius: 9px;
    background: var(--surface);
    min-width: 38px;
    min-height: 36px;
    cursor: pointer;
  }
  .theme-select {
    min-height: 36px;
    border: 1px solid var(--border-muted);
    border-radius: 9px;
    color: var(--text);
    background: var(--surface);
  }

  .layout {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(290px, 34vw);
    gap: var(--space);
    padding: var(--space);
  }
  .conversation, .context-panel {
    min-height: 0;
    border: 1px solid var(--border-muted);
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    box-shadow: 0 18px 60px color-mix(in srgb, var(--background) 76%, transparent);
  }
  .conversation {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden;
  }
  .transcript {
    min-height: 0;
    overflow: auto;
    padding: clamp(18px, 3vw, 42px);
  }
  .empty {
    max-width: 44rem;
    margin: 12vh auto 0;
    color: var(--muted);
    text-align: center;
    line-height: 1.65;
  }
  .message {
    width: min(48rem, 92%);
    margin: 0 auto 18px;
    padding: 13px 16px;
    border-left: 2px solid var(--border);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: keep-all;
    line-height: 1.58;
  }
  .message[data-kind="user"] {
    border-left-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
  }
  .message[data-kind="assistant"] { border-left-color: var(--info); }
  .message[data-kind="tool"] {
    border-left-color: var(--pending);
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .84rem;
  }
  .message-meta {
    display: block;
    margin-bottom: 6px;
    color: var(--dim);
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .composer {
    margin: 0 clamp(12px, 3vw, 34px) clamp(12px, 3vw, 28px);
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--composer-bg);
    box-shadow: 0 12px 32px color-mix(in srgb, var(--background) 70%, transparent);
  }
  .composer textarea {
    width: 100%;
    min-height: 68px;
    max-height: 32vh;
    resize: vertical;
    border: 0;
    outline: 0;
    padding: 8px;
    color: var(--text);
    background: transparent;
    line-height: 1.5;
  }
  .composer-actions { display: flex; align-items: center; gap: 8px; }
  .composer-hint { flex: 1; color: var(--dim); font-size: .74rem; }
  .action {
    min-height: 36px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-raised);
    cursor: pointer;
  }
  .action.primary { border-color: var(--accent); color: var(--accent); }
  .action:disabled { cursor: not-allowed; opacity: .45; }

  .context-panel {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }
  .panel-navigation {
    display: flex;
    min-width: 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .panel-tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    gap: 4px;
    overflow-x: auto;
    padding: 9px;
    scrollbar-width: thin;
  }
  .panel-more {
    display: none;
    flex: 0 0 44px;
    min-height: 44px;
    border: 0;
    border-left: 1px solid var(--border-muted);
    color: var(--muted);
    background: var(--surface);
    cursor: pointer;
  }
  .panel-navigation > .mobile-back { display: none; }
  .panel-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    min-height: 34px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: .76rem;
  }
  .panel-tab[aria-selected="true"] {
    border-color: var(--accent);
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 9%, transparent);
  }
  .panel-body { min-height: 0; overflow: auto; padding: 14px; }
  .panel-body .empty { margin: 48px auto 0; }
  .panel-heading { margin: 0 0 12px; font-size: .88rem; }
  .panel-item {
    width: 100%;
    margin: 0 0 8px;
    padding: 11px;
    border: 1px solid var(--border-muted);
    border-radius: 10px;
    background: var(--surface-raised);
    text-align: left;
  }
  .panel-item-title { color: var(--text); font-size: .83rem; }
  .panel-item-detail { margin-top: 5px; color: var(--dim); font-size: .74rem; }
  .panel-item[aria-current="true"] { border-color: var(--accent); }
  .approval-detail {
    display: grid;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-raised);
  }
  .approval-fields { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; }
  .approval-fields dt { color: var(--dim); font-size: .72rem; }
  .approval-fields dd { margin: 0; color: var(--text); font-size: .78rem; }
  .approval-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .detail-output {
    max-height: 24rem;
    overflow: auto;
    white-space: pre-wrap;
    padding: 10px;
    border: 1px solid var(--border-muted);
    border-radius: 8px;
    background: var(--surface);
  }
  .run-events { list-style: none; margin: 0; padding: 0; }
  .run-events li { padding: 8px 0; border-bottom: 1px solid var(--border-muted); }
  .steer-input {
    flex: 1 1 16rem;
    min-width: 0;
    padding: 8px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .notice {
    position: fixed;
    left: 50%;
    bottom: 18px;
    z-index: 10;
    transform: translateX(-50%);
    max-width: min(90vw, 620px);
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-raised);
    color: var(--muted);
    font-size: .78rem;
    pointer-events: none;
  }
  .notice:empty { display: none; }

  .browser-toggle {
    padding: 7px 11px;
    border: 1px solid var(--birkin-border-muted);
    border-radius: 9px;
    background: var(--birkin-surface);
    color: var(--birkin-text);
    cursor: pointer;
  }
  .browser-toggle:focus-visible,
  .browser-url:focus-visible,
  .browser-go:focus-visible {
    outline-color: var(--birkin-focus-ring);
  }
  .browser-aside {
    display: none;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    grid-template-rows: auto auto minmax(0, 1fr);
    border-left: 1px solid var(--birkin-border-muted);
    border-radius: var(--radius);
    background: var(--birkin-surface);
  }
  .workspace.browser-open .layout {
    grid-template-columns: minmax(0, 1fr) minmax(360px, 40vw);
  }
  .workspace.browser-open .context-panel { display: none; }
  .workspace.browser-open .browser-aside { display: grid; }
  .browser-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 7px;
    padding: 9px;
    border-bottom: 1px solid var(--birkin-border-muted);
    background: var(--birkin-surface-raised);
  }
  .browser-url {
    min-width: 0;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--birkin-border-muted);
    border-radius: 8px;
    background: var(--birkin-background);
    color: var(--birkin-text);
  }
  .browser-go {
    padding: 7px 12px;
    border: 1px solid var(--birkin-accent);
    border-radius: 8px;
    background: var(--birkin-background);
    color: var(--birkin-text);
    cursor: pointer;
  }
  .browser-status {
    min-height: 2rem;
    margin: 0;
    padding: 6px 10px;
    color: var(--birkin-muted);
    font-size: .82rem;
    border-bottom: 1px solid var(--birkin-border-muted);
  }
  .browser-status[data-state="loading"] { color: var(--birkin-pending); }
  .browser-status[data-state="ready"] { color: var(--birkin-success); }
  .browser-status[data-state="warning"] { color: var(--birkin-warning); }
  .browser-status[data-state="blocked"] { color: var(--birkin-blocked); }
  .browser-status[data-state="error"] { color: var(--birkin-error); }
  .browser-state-glyph {
    display: inline-block;
    width: 1.25em;
    font-weight: 700;
  }
  .browser-status[data-state="error"] + .browser-viewport { display: none; }
  .browser-viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    padding: 8px;
    background: var(--birkin-background);
  }
  .browser-canvas {
    position: absolute;
    inset: 8px;
    display: block;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    min-width: 0;
    min-height: 0;
    object-fit: contain;
    border: 1px solid var(--birkin-border-muted);
    background: var(--birkin-background);
  }
  .ledger { display: contents; }

  @media (max-width: 480px) {
    .approval-fields { grid-template-columns: 1fr; }
    .approval-actions, .detail-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .approval-actions .steer-input,
    .detail-actions .steer-input { grid-column: 1 / -1; width: 100%; }
  }
  @media (max-width: 1023px) {
    .workspace.browser-open .layout {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(300px, 44dvh);
    }
    .workspace.browser-open .browser-aside {
      border-left: 0;
      border-top: 1px solid var(--birkin-border-muted);
    }
  }
  @media (max-width: 820px) {
    .icon-button,
    .action,
    .panel-tab,
    .theme-select {
      min-width: 44px;
      min-height: 44px;
    }
    .layout { grid-template-columns: minmax(0, 1fr); padding: 10px; }
    .context-panel {
      position: fixed;
      inset: auto 10px var(--composer-reserved);
      z-index: 5;
      height: min(48dvh, 440px);
      background: var(--surface);
      transform: translateY(
        calc(100% + var(--composer-reserved) + 24px)
      );
      transition: transform 170ms ease;
    }
    .workspace[data-panel-open="true"] .context-panel { transform: translateY(0); }
    .panel-navigation > .mobile-back { display: inline-flex; align-items: center; }
    .transcript { padding: 18px 12px 120px; }
    .composer { margin: 0 8px 8px; }
    .composer textarea { resize: none; }
    .brand span { display: none; }
  }
  @media (max-width: 1200px) {
    .panel-more {
      display: grid;
      place-items: center;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto; transition-duration: 0.001ms; }
  }
</style>
</head>
<body>
<div class="app">
<div id="workspace-shell" class="workspace" data-testid="workspace-shell" data-panel-open="false">
  <header class="topbar">
    <div class="brand"><strong>Birkin</strong><span>unified agent workspace</span></div>
    <div class="topbar-spacer"></div>
    <select id="workspace-theme" class="theme-select" data-testid="workspace-theme"
            aria-label="워크스페이스 테마">
      <option value="studio_dark">Dark</option>
      <option value="paper_light">Light</option>
      <option value="high_contrast">High contrast</option>
    </select>
    <div id="workspace-connection" class="connection" data-testid="workspace-connection"
         data-state="connecting" aria-live="polite">연결 중</div>
    <button class="browser-toggle" id="browser-aside-toggle" type="button"
            aria-controls="browser-aside" aria-expanded="false">브라우저 열기</button>
    <button id="lens-toggle" class="icon-button" type="button"
            aria-label="컨텍스트 패널 열기" aria-controls="workspace-panel">⌘</button>
  </header>

  <main id="lens" class="layout main">
    <section class="conversation" aria-label="대화">
      <div id="workspace-transcript" class="transcript" role="log"
           aria-live="polite" aria-relevant="additions text"
           data-testid="workspace-transcript">
        <p id="workspace-empty" class="empty">세션을 연결하고 있습니다.</p>
      </div>

      <form id="workspace-composer" class="composer" data-testid="workspace-composer">
        <textarea id="workspace-input" aria-label="Birkin에게 메시지 보내기"
                  placeholder="메시지 또는 /command" autocomplete="off"></textarea>
        <div class="composer-actions">
          <span class="composer-hint">Ctrl+Enter 전송 · Esc 중단</span>
          <button class="action" type="button" data-testid="workspace-resume"
                  id="workspace-resume">재개</button>
          <button class="action" type="button" data-testid="workspace-interrupt"
                  id="workspace-interrupt">중단</button>
          <button class="action primary" type="submit" data-testid="workspace-send"
                  id="workspace-send">보내기</button>
        </div>
      </form>
    </section>

    <aside id="workspace-panel" class="context-panel" data-testid="workspace-panel"
           aria-label="워크스페이스 컨텍스트">
      <div class="panel-navigation">
        <button type="button" class="panel-tab mobile-back"
                data-testid="workspace-mobile-back"
                aria-label="컨텍스트 패널 닫기"
                aria-controls="workspace-panel">뒤로</button>
        <div class="panel-tabs" role="tablist" aria-label="워크스페이스 패널"
             data-testid="workspace-panel-tabs">
          <button type="button" class="panel-tab" role="tab" data-panel="tasks_runs"
                  aria-controls="workspace-panel-body" aria-selected="true">작업</button>
          <button id="approval-tab" type="button" class="panel-tab" role="tab"
                  data-panel="approvals" aria-controls="workspace-panel-body"
                  aria-selected="false">승인</button>
          <button type="button" class="panel-tab" role="tab" data-panel="files_evidence"
                  aria-controls="workspace-panel-body" aria-selected="false">근거</button>
          <button type="button" class="panel-tab" role="tab" data-panel="sessions_history"
                  aria-controls="workspace-panel-body" aria-selected="false">세션</button>
          <button type="button" class="panel-tab" role="tab" data-panel="activity_logs"
                  aria-controls="workspace-panel-body" aria-selected="false">활동</button>
          <button type="button" class="panel-tab" role="tab" data-panel="cron"
                  aria-controls="workspace-panel-body" aria-selected="false">예약</button>
          <button type="button" class="panel-tab" role="tab" data-panel="memory_skills"
                  aria-controls="workspace-panel-body" aria-selected="false">기억</button>
          <button type="button" class="panel-tab" role="tab" data-panel="checkpoints_restore"
                  aria-controls="workspace-panel-body" aria-selected="false">복원</button>
          <button type="button" class="panel-tab" role="tab" data-panel="computer_use"
                  aria-controls="workspace-panel-body" aria-selected="false">컴퓨터 사용</button>
          <button type="button" class="panel-tab" role="tab" data-panel="settings_status"
                  aria-controls="workspace-panel-body" aria-selected="false">상태</button>
        </div>
        <button id="panel-more" class="panel-more" type="button"
                aria-label="더 많은 패널 보기">›</button>
      </div>
      <div id="workspace-panel-body" class="panel-body" role="tabpanel"></div>
    </aside>

    <aside class="browser-aside" id="browser-aside"
           aria-label="네이티브 브라우저" aria-hidden="true">
      <form class="browser-toolbar" id="browser-aside-form">
        <input class="browser-url" id="browser-aside-url" type="url"
               inputmode="url" autocomplete="off" spellcheck="false"
               aria-label="브라우저 주소" placeholder="https://example.com" />
        <button class="browser-go" type="submit">이동</button>
      </form>
      <p class="browser-status" id="browser-aside-status" role="status"
         aria-live="polite" data-state="closed">
        <span class="browser-state-glyph" aria-hidden="true">○</span>
        <span class="browser-state-label">Chromium 대기</span>
      </p>
      <div class="browser-viewport">
        <canvas class="browser-canvas" id="browser-aside-canvas"
                width="1024" height="700" aria-label="브라우저 화면"
                data-frame-ready="false"></canvas>
      </div>
    </aside>
  </main>

  <div id="queue-notice" class="notice" aria-live="polite"></div>
</div>
</div>

<script>
"use strict";

const byId = (id) => document.getElementById(id);
const shell = document.querySelector('[data-testid="workspace-shell"]');
const transcript = byId("workspace-transcript");
const input = byId("workspace-input");
const sendButton = byId("workspace-send");
const interruptButton = byId("workspace-interrupt");
const resumeButton = byId("workspace-resume");
const connection = byId("workspace-connection");
const panelBody = byId("workspace-panel-body");
const panelTabs = document.querySelector('[data-testid="workspace-panel-tabs"]');
const panelMore = byId("panel-more");
const composer = byId("workspace-composer");
const queueNoticeElement = byId("queue-notice");
const themeSelect = byId("workspace-theme");
const mobileBack = document.querySelector('[data-testid="workspace-mobile-back"]');
let browserFrameTimer = null;
const browserClientId = sessionStorage.getItem(
  "birkin-browser-client"
) || crypto.randomUUID();
sessionStorage.setItem("birkin-browser-client", browserClientId);
let browserControlSequence = Number(
  sessionStorage.getItem("birkin-browser-control-sequence") || 0
);
let browserSessionStart = null;

const state = {
  sessionId: null,
  cursor: 0,
  source: null,
  snapshot: null,
  activePanel: "tasks_runs",
  selectedId: null,
  pendingAssistant: new Map(),
  reconnectAttempts: 0,
  reconnectTimer: null,

function announce(message) {
  queueNoticeElement.textContent = message;

async function browserJSON(url, method, payload) {
  const options = {
    method,
    cache: "no-store",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Birkin-Browser-Client": browserClientId,
    },
  };
  if (payload !== undefined) options.body = JSON.stringify(payload);
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error?.code || String(response.status));
    error.status = response.status;
    throw error;
  }
  return body;
}

function setBrowserStatus(text, statusState = "closed") {
  const node = byId("browser-aside-status");
  const glyphs = {
    closed: "○",
    loading: "◐",
    ready: "✓",
    warning: "!",
    blocked: "⊘",
    error: "×",
  };
  const glyph = document.createElement("span");
  glyph.className = "browser-state-glyph";
  glyph.setAttribute("aria-hidden", "true");
  glyph.textContent = glyphs[statusState] || glyphs.closed;
  const label = document.createElement("span");
  label.className = "browser-state-label";
  label.textContent = text;
  node.replaceChildren(glyph, label);
  node.dataset.state = statusState;
  node.setAttribute(
    "aria-live",
    statusState === "error" ? "assertive" : "polite",
  );
}

function browserStatusLabel(status) {
  const engine = status.engine === "chromium" ? "Chromium" : "Browser";
  const owners = {
    human: "사람 제어",
    agent: "에이전트 제어",
    tool: "도구 제어",
  };
  const owner = owners[status.control_owner_kind] || "제어권 대기";
  const readiness = status.frame_revision ? "준비" : "주소 대기";
  return `${engine} · ${readiness} · ${owner}`;
}

function resetBrowserFrame() {
  const canvas = byId("browser-aside-canvas");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.frameReady = "false";
  canvas.dataset.frameRevision = "0";
  canvas.dataset.frameDigest = "";
  canvas.dataset.frameRef = "";
  canvas.dataset.browserGeneration = "";
}

async function refreshBrowserFrame(status) {
  const canvas = byId("browser-aside-canvas");
  const generation = String(status.browser_generation);
  if (canvas.dataset.browserGeneration !== generation) {
    resetBrowserFrame();
    canvas.dataset.browserGeneration = generation;
  }
  if (!status.live || !status.frame_revision) return;
  const query = new URLSearchParams({
    generation,
    after: canvas.dataset.frameRevision || "0",
  });
  const response = await fetch("/api/browser-aside/frame?" + query, {
    cache: "no-store",
    credentials: "same-origin",
    headers: {"X-Birkin-Browser-Client": browserClientId},
  });
  if (response.status === 204) return;
  if (!response.ok) throw new Error("frame_" + response.status);
  const image = await createImageBitmap(await response.blob());
  canvas.width = image.width;
  canvas.height = image.height;
  canvas.getContext("2d").drawImage(image, 0, 0);
  image.close();
  canvas.dataset.frameReady = "true";
  canvas.dataset.frameRevision =
    response.headers.get("X-Birkin-Frame-Revision") || "0";
  canvas.dataset.frameDigest =
    response.headers.get("X-Birkin-Frame-Digest") || "";
  canvas.dataset.frameRef =
    response.headers.get("X-Birkin-Frame-Ref") || "";
  canvas.dataset.browserGeneration = generation;
  dispatchEvent(new CustomEvent("browser-aside-frame", {
    detail: {
      generation: status.browser_generation,
      revision: canvas.dataset.frameRevision,
    },
  }));
}

function stopBrowserFramePoll() {
  if (browserFrameTimer !== null) {
    clearTimeout(browserFrameTimer);
    browserFrameTimer = null;
  }
}

function scheduleBrowserFramePoll() {
  stopBrowserFramePoll();
  if (!shell.classList.contains("browser-open")) return;
  browserFrameTimer = setTimeout(async () => {
    try {
      const status = await browserJSON(
        "/api/browser-aside/status", "GET");
      if (!status.live) {
        setBrowserStatus("Chromium 연결 끊김", "warning");
        return;
      }
      await refreshBrowserFrame(status);
      setBrowserStatus(browserStatusLabel(status), "ready");
    } catch (error) {
      setBrowserStatus("화면 새로고침 필요", "warning");
    } finally {
      scheduleBrowserFramePoll();
    }
  }, 750);
}

async function startBrowserSession() {
  if (browserSessionStart === null) {
    browserSessionStart = browserJSON(
      "/api/browser-aside/session", "POST", {});
  }
  const request = browserSessionStart;
  try {
    return await request;
  } finally {
    if (browserSessionStart === request) {
      browserSessionStart = null;
    }
  }
}

async function openBrowserAside() {
  const aside = byId("browser-aside");
  const toggle = byId("browser-aside-toggle");
  shell.classList.add("browser-open");
  aside.setAttribute("aria-hidden", "false");
  toggle.setAttribute("aria-expanded", "true");
  toggle.textContent = "브라우저 접기";
  setBrowserStatus("Chromium 시작 중", "loading");
  try {
    const status = await startBrowserSession();
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
    scheduleBrowserFramePoll();
  } catch (error) {
    setBrowserStatus(
      error.status === 503
        ? "Chromium 설치: uv sync --extra browser && uv run playwright install chromium"
        : "브라우저를 시작하지 못했습니다",
      "error",
    );
  }
}

function collapseBrowserAside() {
  stopBrowserFramePoll();
  resetBrowserFrame();
  shell.classList.remove("browser-open");
  byId("browser-aside").setAttribute("aria-hidden", "true");
  byId("browser-aside-toggle").setAttribute("aria-expanded", "false");
  byId("browser-aside-toggle").textContent = "브라우저 열기";
}

async function navigateBrowserAside() {
  const url = byId("browser-aside-url").value.trim();
  if (!url) return;
  setBrowserStatus("페이지 이동 중", "loading");
  try {
    const current = await startBrowserSession();
    browserControlSequence += 1;
    sessionStorage.setItem(
      "birkin-browser-control-sequence",
      String(browserControlSequence),
    );
    const status = await browserJSON(
      "/api/browser-aside/navigate", "POST", {
        url,
        browser_generation: current.browser_generation,
        browser_revision: current.browser_revision,
        control_epoch: current.control_epoch,
        control_sequence: browserControlSequence,
      });
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
    scheduleBrowserFramePoll();
  } catch (error) {
    stopBrowserFramePoll();
    setBrowserStatus(
      error.status === 400
        ? "http 또는 https 주소만 사용할 수 있습니다"
        : "페이지를 열지 못했습니다",
      error.status === 400 ? "blocked" : "error",
    );
  }
}

function setConnection(value, label) {
  connection.dataset.state = value;
  connection.textContent = label;
}

function presentationFor(uiState) {
  const encoded = uiEncoding[uiState];
  if (encoded) return [encoded.glyph, encoded.label];
  return statePresentations[uiState] || statePresentations.unknown;
}

function attentionFor(uiState) {
  const encoded = uiEncoding[uiState];
  if (encoded) return Number(encoded.attention);
  return attentionRanks[uiState] ?? 99;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    cache: "no-store",
    credentials: "same-origin",
    ...options,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(String(payload.error || response.status));
    error.status = response.status;
    throw error;
  }
  return payload;
}

async function textApi(path, options = {}) {
  const response = await fetch(path, {
    cache: "no-store",
    credentials: "same-origin",
    ...options,
  });
  const payload = await response.text();
  if (!response.ok) {
    const error = new Error(payload || String(response.status));
    error.status = response.status;
    throw error;
  }
  return payload;
}

function applyWorkspaceTheme(contract, name) {
  const selected = contract.workspace_theme.palettes[name]
    ? name
    : contract.workspace_theme.default;
  const palette = contract.workspace_theme.palettes[selected];
  for (const [role, value] of Object.entries(palette)) {
    const variable = role.replace(/_/g, "-");
    document.documentElement.style.setProperty(
      `--birkin-${variable}`,
      value
    );
    document.documentElement.style.setProperty(`--${variable}`, value);
  }
  document.documentElement.dataset.theme = selected;
  document.documentElement.style.colorScheme =
    selected === "paper_light" ? "light" : "dark";
  themeSelect.value = selected;
  localStorage.setItem("birkin.workspace.theme", selected);
}

async function loadContract() {
  const contract = await api("/api/contract");
  uiEncoding = contract.uistate["x-birkin-encoding"];
  for (const [name, token] of Object.entries(contract.tokens.tokens)) {
    document.documentElement.style.setProperty(
      `--${name.replace(/_/g, "-")}`,
      token.hex
    );
  }
  const storedTheme = localStorage.getItem("birkin.workspace.theme");
  const preferredTheme = storedTheme || (
    window.matchMedia("(prefers-color-scheme: light)").matches
      ? "paper_light"
      : contract.workspace_theme.default
  );
  applyWorkspaceTheme(contract, preferredTheme);
  return contract;
}

function buildQueue(approvals, jobs, runs) {
  const queue = [];
  for (const approval of approvals || []) {
    queue.push({
      id: approval.id,
      kind: "approval",
      title: approval.title || approval.category,
      ui_state: approval.ui_state,
      detail: approval.description || "",
      requester: approval.requester || approval.requested_by || "Birkin",
      target: approval.target || approval.category || approval.command || "",
      expected_impact: approval.expected_impact || approval.why
        || approval.description || "",
      rejection_result: approval.rejection_result
        || "The requested action will not run.",
      risk: approval.risk || approval.category || "",
      expires_at: approval.expires_at || approval.expires || "",
      related_evidence: approval.related_evidence || approval.evidence || "",
      record: approval,
    });
  }
  for (const job of jobs?.jobs || []) {
    queue.push({
      id: `job:${job.id || job.name}`,
      kind: "cron",
      title: job.name || "cron",
      ui_state: job.ui_state,
      detail: job.schedule?.display || job.next_run || "",
      record: job,
    });
  }
  for (const run of runs || []) {
    const error = run.details?.error || "";
    queue.push({
      id: `run:${run.id || run.created || queue.length}`,
      kind: "run",
      title: run.title || run.kind || "run",
      ui_state: run.ui_state,
      detail: error || run.status || "",
      record: run,
    });
  }
  return queue;
}

function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function messageNode(kind, text, id) {
  const article = document.createElement("article");
  article.className = "message";
  article.dataset.kind = kind;
  if (id) article.dataset.messageId = id;
  const meta = document.createElement("span");
  meta.className = "message-meta";
  meta.textContent = kind;
  const content = document.createElement("span");
  content.className = "message-content";
  content.textContent = text;
  article.append(meta, content);
  return article;
}

function appendMessage(kind, text, id) {
  const empty = byId("workspace-empty");
  if (empty) empty.remove();
  const followsOutput = isFollowingOutput();
  transcript.appendChild(messageNode(kind, text, id));
  if (followsOutput) transcript.scrollTop = transcript.scrollHeight;
}

function isFollowingOutput() {
  return (
    transcript.scrollHeight - transcript.clientHeight - transcript.scrollTop
  ) <= 24;
}

function renderSnapshot(snapshot) {
  state.snapshot = snapshot;
  state.cursor = Number(snapshot.cursor || state.cursor || 0);
  clearNode(transcript);
  const conversation = snapshot.conversation || [];
  if (!conversation.length) {
    const empty = document.createElement("p");
    empty.id = "workspace-empty";
    empty.className = "empty";
    empty.textContent = "메시지를 보내 대화를 시작하세요.";
    transcript.appendChild(empty);
  }
  for (const message of conversation) {
    const kind = message.kind === "user_message" ? "user" : "assistant";
    appendMessage(kind, String(message.text || ""), String(message.id || ""));
  }
  renderPanel();
}

async function refreshWorkspaceSnapshot() {
  const snapshot = await api(
    `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}/snapshot`
  );
  state.snapshot = snapshot;
  renderPanel();
}

function approvalIsActionable(item) {
  const status = String(item.status || item.record?.status || "pending");
  return status === "pending" || attentionFor(item.ui_state) === 0;
}

function updateApprovalTab() {
  const waiting = items.filter(
    (item) => item.kind === "approval" && approvalIsActionable(item)
  ).length;
  byId("approval-tab").textContent = waiting ? `승인 · 대기 ${waiting}` : "승인";
}

function renderPanel() {
  updateApprovalTab();
  clearNode(panelBody);
  const heading = document.createElement("h2");
  heading.className = "panel-heading";
  heading.textContent = panelLabels[state.activePanel] || state.activePanel;
  panelBody.appendChild(heading);

  const panel = (state.snapshot?.panels || [])
    .find((entry) => entry.key === state.activePanel);
  let legacyItems = [];
  if (state.activePanel === "tasks_runs") {
    legacyItems = items.filter(
      (item) => ["run", "cron", "agent_run"].includes(item.kind)
    );
  } else if (state.activePanel === "approvals") {
    legacyItems = items.filter((item) => item.kind === "approval");
  } else if (state.activePanel === "activity_logs") {
    legacyItems = items;
  } else if (state.activePanel === "settings_status") {
    legacyItems = items.filter((item) => item.kind === "status");
  }
  const canonicalItems = panel?.items || [];
  const merged = new Map(
    legacyItems.map((item) => [String(item.id || ""), item])
  );
  for (const item of canonicalItems) {
    const id = String(item.id || "");
    const previous = merged.get(id) || {};
    const combined = {...(merged.get(id) || {}), ...item};
    if (previous.kind === "agent_run" && item.kind === "tasks_runs") {
      combined.kind = "agent_run";
    }
    if (
      previous.kind === "approval"
      && item.ui_state === "pending"
      && uiEncoding[previous.ui_state]
    ) {
      combined.ui_state = previous.ui_state;
    }
    merged.set(id, combined);
  }
  let panelItems = [...merged.values()];
  panelItems = [...panelItems].sort((left, right) => {
    const leftRank = attentionFor(left.ui_state);
    const rightRank = attentionFor(right.ui_state);
    return leftRank - rightRank;
  });

  if (!panelItems.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "현재 표시할 항목이 없습니다.";
    panelBody.appendChild(empty);
    return;
  }

  for (const item of panelItems) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "panel-item";
    button.dataset.itemId = String(item.id || "");
    button.setAttribute("aria-current", String(item.id === state.selectedId));
    const title = document.createElement("div");
    title.className = "panel-item-title";
    const presentation = presentationFor(item.ui_state);
    title.textContent = `${presentation[0]} ${presentation[1]} · ${
      String(item.title || item.key || item.id || "")
    }`;
    const detail = document.createElement("div");
    detail.className = "panel-item-detail";
    detail.textContent = String(item.detail || item.summary || "");
    button.append(title, detail);
    button.addEventListener("click", () => selectPanelItem(item));
    panelBody.appendChild(button);
  }
  const selected = panelItems.find((item) => item.id === state.selectedId);
  if (selected?.kind === "approval") appendApprovalDetail(selected);
  if (selected?.kind === "question") appendQuestionDetail(selected);
  if (selected?.kind === "checkpoint") appendCheckpointDetail(selected);
  if (selected?.kind === "agent" || selected?.kind === "agent_run") {
    appendAgentRunDetail(selected);
  }
  if (selected?.kind === "computer_use") appendComputerUseDetail(selected);
  if (selected?.kind === "status") appendStatusDetail(selected);
}

function selectPanelItem(item) {
  state.selectedId = item.id || null;
  renderPanel();
}

function appendDefinitions(target, definitions) {
  for (const [label, value] of definitions) {
    if (value == null || value === "") continue;
    const term = document.createElement("dt");
    term.textContent = label;
    const detail = document.createElement("dd");
    detail.textContent = String(value);
    target.append(term, detail);
  }
}

async function submitApproval(item, decision) {
  const approvalId = String(item.id || "");
  if (!approvalId || busyApprovalIds.has(approvalId)) return;
  busyApprovalIds.add(approvalId);
  renderPanel();
  try {
    await sendCommand("approval.answer", {
      approval_id: approvalId,
      decision,
      detail_fields: detailFields,
    });
    announce("요청 전송 완료 · Python authority 응답 대기");
  } catch (error) {
    busyApprovalIds.delete(approvalId);
    announce(`승인 실패: ${error.message}`);
    renderPanel();
  }
}

function appendApprovalDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "승인 세부 정보");
  const record = item.record || {};
  const fields = document.createElement("dl");
  fields.className = "approval-fields";
  appendDefinitions(fields, [
    ["요청자", item.requester || record.origin],
    ["유형", record.category],
    ["대상", item.target || record.target || record.payload?.path || record.payload?.command],
    ["예상 영향", item.expected_impact || record.expected_impact || record.description],
    ["거부 결과", item.rejection_result || record.rejection_result],
    ["위험", item.risk || record.risk],
    ["만료", item.expires_at || record.expires_at],
    ["관련 근거", item.related_evidence || record.evidence || record.payload?.evidence],
  ]);
  section.appendChild(fields);

  if (record.payload && Object.keys(record.payload).length) {
    const payload = document.createElement("details");
    const payloadSummary = document.createElement("summary");
    payloadSummary.textContent = `요청 payload 보기 (${Object.keys(record.payload).length}개 항목)`;
    const payloadText = document.createElement("pre");
    payloadText.textContent = JSON.stringify(record.payload, null, 2);
    payload.append(payloadSummary, payloadText);
    section.appendChild(payload);
  }

  const output = document.createElement("pre");
  output.className = "detail-output";
  output.hidden = true;
  const actions = document.createElement("div");
  actions.className = "approval-actions";
  const diff = document.createElement("button");
  diff.type = "button";
  diff.className = "action";
  diff.textContent = "View diff";
  diff.addEventListener("click", async () => {
    diff.disabled = true;
    try {
      output.textContent = await textApi(
        `/api/approvals/${encodeURIComponent(item.id)}/diff`
      );
    } catch (error) {
      output.textContent = `No diff available: ${error.message}`;
    } finally {
      output.hidden = false;
      diff.disabled = false;
    }
  });
  actions.appendChild(diff);

  if (approvalIsActionable(item)) {
    for (const [decision, label] of [["reject", "거부"], ["approve", "승인 실행"]]) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `action ${decision === "approve" ? "primary" : ""}`;
      button.textContent = label;
      button.disabled = busyApprovalIds.has(String(item.id));
      button.addEventListener("click", () => submitApproval(item, decision));
      actions.appendChild(button);
    }
    const authority = document.createElement("p");
    authority.className = "panel-item-detail";
    authority.textContent = (
      "버튼은 요청만 보내며 실제 실행과 상태 변경은 Python authority 응답 후 반영됩니다."
    );
    section.appendChild(authority);
  }
  section.append(actions, output);

  const receipt = recentReceipts.get(String(item.id));
  if (receipt) {
    const receiptText = document.createElement("p");
    receiptText.setAttribute("role", "status");
    receiptText.textContent = `Action executed: ${receipt.receipt}`;
    section.appendChild(receiptText);
  }
  panelBody.appendChild(section);
}

function appendQuestionDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "질문 응답");
  const prompt = document.createElement("p");
  prompt.textContent = String(item.summary || item.detail || item.id);
  const label = document.createElement("label");
  label.textContent = "답변";
  const answer = document.createElement("textarea");
  answer.rows = 3;
  answer.dataset.testid = "workspace-question-answer";
  answer.placeholder = "이 질문에 대한 답변";
  label.appendChild(answer);
  const submit = document.createElement("button");
  submit.type = "button";
  submit.className = "action primary";
  submit.textContent = "답변 보내기";
  submit.addEventListener("click", () => {
    sendCommand("question.answer", {
      question_id: item.id,
      answer: answer.value,
    }).catch((error) => announce(`답변 실패: ${error.message}`));
  });
  section.append(prompt, label, submit);
  panelBody.appendChild(section);
}

function appendCheckpointDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "체크포인트 복원");
  const summary = document.createElement("p");
  summary.textContent = String(
    item.detail || item.summary || "선택한 체크포인트를 복원합니다."
  );
  const modeLabel = document.createElement("label");
  modeLabel.textContent = "복원 범위";
  const mode = document.createElement("select");
  for (const [value, label] of [
    ["files", "파일"],
    ["task", "작업 상태"],
    ["both", "파일 + 작업 상태"],
  ]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    mode.appendChild(option);
  }
  modeLabel.appendChild(mode);
  const consequence = document.createElement("p");
  consequence.textContent = (
    "복원은 즉시 실행되지 않으며 별도 승인이 필요합니다. "
    + "거부하면 현재 파일과 작업 상태가 유지됩니다."
  );
  const actions = document.createElement("div");
  actions.className = "detail-actions";
  const preview = document.createElement("button");
  preview.type = "button";
  preview.className = "action";
  preview.textContent = "Preview diff";
  const restore = document.createElement("button");
  restore.type = "button";
  restore.className = "action";
  restore.textContent = "복원 승인 요청";
  actions.append(preview, restore);

  const commandLabel = document.createElement("label");
  commandLabel.textContent = "Alternate command (JSON string array)";
  const command = document.createElement("input");
  command.className = "steer-input";
  command.value = '["python","-c","print(42)"]';
  commandLabel.appendChild(command);
  const fork = document.createElement("button");
  fork.type = "button";
  fork.className = "action";
  fork.textContent = "Run alternate branch";
  const forkActions = document.createElement("div");
  forkActions.className = "detail-actions";
  forkActions.append(commandLabel, fork);

  const output = document.createElement("pre");
  output.className = "detail-output";
  output.hidden = true;
  const status = document.createElement("p");
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");

  preview.addEventListener("click", async () => {
    preview.disabled = true;
    try {
      const result = await api(
        `/api/checkpoints/${encodeURIComponent(item.id)}/diff`
      );
      output.textContent = result.patch || "No differences from current files.";
      output.hidden = false;
    } catch (error) {
      status.textContent = `Diff preview failed: ${error.message}`;
    } finally {
      preview.disabled = false;
    }
  });
  restore.addEventListener("click", async () => {
    restore.disabled = true;
    try {
      const result = await api(
        `/api/checkpoints/${encodeURIComponent(item.id)}/restore`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            mode: mode.value,
            session_id: state.sessionId,
          }),
        }
      );
      status.textContent = `복원 승인 대기: ${result.approval_id}`;
      announce(status.textContent);
      await refreshLegacyPanels();
    } catch (error) {
      status.textContent = `복원 실패: ${error.message}`;
    } finally {
      restore.disabled = false;
    }
  });
  fork.addEventListener("click", async () => {
    let parsed;
    try {
      parsed = JSON.parse(command.value);
      if (!Array.isArray(parsed) || !parsed.every((part) => typeof part === "string")) {
        throw new Error("Command must be a JSON string array.");
      }
    } catch (error) {
      status.textContent = error.message;
      return;
    }
    fork.disabled = true;
    status.textContent = "Running isolated alternate branch…";
    try {
      const result = await api(
        `/api/checkpoints/${encodeURIComponent(item.id)}/fork`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({command: parsed}),
        }
      );
      status.textContent = `Alternate branch complete: ${result.stdout || "exit 0"}`;
      await refreshWorkspaceSnapshot();
    } catch (error) {
      status.textContent = `Fork failed: ${error.message}`;
    } finally {
      fork.disabled = false;
    }
  });

  section.append(
    summary, modeLabel, consequence, actions, forkActions, output, status
  );
  panelBody.appendChild(section);
}

function appendAgentRunDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "Background run detail");
  const loading = document.createElement("p");
  loading.textContent = "Run detail loading…";
  section.appendChild(loading);
  panelBody.appendChild(section);

  api(`/api/agent-runs/${encodeURIComponent(item.id)}`).then((run) => {
    if (!section.isConnected) return;
    clearNode(section);
    const heading = document.createElement("h3");
    heading.textContent = String(run.task || run.id);
    const fields = document.createElement("dl");
    fields.className = "approval-fields";
    const presentation = presentationFor(run.ui_state);
    appendDefinitions(fields, [
      ["Status", presentation[1]],
      ["Run ID", run.id],
      ["Started", run.started_at],
      ["Pending approvals", (run.approvals || []).map(
        (approval) => approval.title || approval.category
      ).join(", ") || "none"],
    ]);
    const progressHeading = document.createElement("h4");
    progressHeading.textContent = "Progress";
    const events = document.createElement("ul");
    events.className = "run-events";
    for (const event of run.events || []) {
      const row = document.createElement("li");
      row.textContent = `${event.at || ""} ${event.text || ""}`.trim();
      events.appendChild(row);
    }
    if (!events.children.length) {
      const empty = document.createElement("li");
      empty.textContent = "No progress events yet.";
      events.appendChild(empty);
    }
    section.append(heading, fields, progressHeading, events);

    if (!run.terminal) {
      const controls = document.createElement("div");
      controls.className = "detail-actions";
      const steering = document.createElement("input");
      steering.className = "steer-input";
      steering.setAttribute("aria-label", "Steering instruction");
      steering.placeholder = "Steer this run…";
      const steer = document.createElement("button");
      steer.type = "button";
      steer.className = "action";
      steer.textContent = "Steer";
      steer.addEventListener("click", () => {
        controlAgentRun(run.id, "steer", steering.value).catch(
          (error) => announce(error.message)
        );
      });
      const transition = document.createElement("button");
      transition.type = "button";
      transition.className = "action primary";
      const blocked = run.status === "blocked";
      transition.textContent = blocked ? "Resume" : "Abort";
      transition.addEventListener("click", () => {
        controlAgentRun(run.id, blocked ? "resume" : "abort").catch(
          (error) => announce(error.message)
        );
      });
      controls.append(steering, steer, transition);
      section.appendChild(controls);
    }
  }).catch((error) => {
    if (section.isConnected) loading.textContent = `Run detail unavailable: ${error.message}`;
  });
}

async function controlAgentRun(runId, action, text = "") {
  await api(`/api/agent-runs/${encodeURIComponent(runId)}/control`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action, text}),
  });
  state.selectedId = runId;
  await refreshLegacyPanels();
}

  const section = document.createElement("section");

async function handleApprovalAnswered(payload) {
  const approvalId = String(payload.approval_id || "");
  busyApprovalIds.delete(approvalId);
  if (payload.decision === "approve") {
    const workspaceReceipt = String(payload.receipt || "");
    if (workspaceReceipt) {
      const receipt = {receipt: workspaceReceipt};
      recentReceipts.set(approvalId, receipt);
      announce(`Action executed: ${receipt.receipt}`);
    } else {
      try {
        const receipt = await api(
          `/api/actions/${encodeURIComponent(approvalId)}/receipt`
        );
        recentReceipts.set(approvalId, receipt);
        announce(`Action executed: ${receipt.receipt}`);
      } catch (error) {
        announce(`승인 처리 완료: ${error.message}`);
      }
    }
  } else {
    announce("거부 처리 완료 · 동작은 실행되지 않았습니다.");
  }
  await refreshWorkspaceSnapshot();
  await refreshLegacyPanels();
}

function handleWorkspaceEvent(raw) {
  const event = JSON.parse(raw.data);
  const cursor = Number(event.cursor || 0);
  if (cursor <= state.cursor) return;
  state.cursor = cursor;
  shell.dataset.lastEvent = event.type;
  const payload = event.payload || {};
  const commandId = event.command_id || "";
  if (event.type === "message.user") {
    appendMessage("user", String(payload.text || ""), `${commandId}:user`);
  } else if (event.type === "message.assistant.delta") {
    const followsOutput = isFollowingOutput();
    let content = state.pendingAssistant.get(commandId);
    if (!content) {
      const node = messageNode("assistant", "", `${commandId}:assistant`);
      transcript.appendChild(node);
      content = node.querySelector(".message-content");
      state.pendingAssistant.set(commandId, content);
    }
    content.textContent += String(payload.text || "");
    if (followsOutput) transcript.scrollTop = transcript.scrollHeight;
  } else if (event.type === "message.assistant.completed") {
    const content = state.pendingAssistant.get(commandId);
    if (!content) {
      appendMessage("assistant", String(payload.text || ""), `${commandId}:assistant`);
    } else {
      content.textContent = String(payload.text || content.textContent || "");
    }
    state.pendingAssistant.delete(commandId);
  } else if (event.type.startsWith("tool.") || event.type === "progress.updated") {
    appendMessage("tool", String(payload.summary || event.type), event.event_id);
  } else if (event.type === "command.failed" || event.type === "error.raised") {
    announce(`오류: ${String(payload.error || event.type)}`);
  } else if (event.type === "approval.answered") {
    handleApprovalAnswered(payload).catch((error) => announce(error.message));
  } else if ([
    "approval.requested", "question.requested", "question.answered",
    "evidence.added", "checkpoint.restored", "task.updated", "computer.updated",
  ].includes(event.type)) {
    refreshWorkspaceSnapshot().catch((error) => announce(error.message));
  }
}

function connectEvents() {
  if (!state.sessionId) return;
  if (state.reconnectTimer) {
    clearTimeout(state.reconnectTimer);
    state.reconnectTimer = null;
  }
  if (state.source) state.source.close();
  const path = `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}`
    + `/events?after=${state.cursor}`;
  const source = new EventSource(path);
  state.source = source;
  const eventTypes = [
    "command.accepted", "command.started", "command.completed", "command.failed",
    "message.user", "message.assistant.delta", "message.assistant.completed",
    "tool.started", "tool.completed", "tool.failed", "progress.updated",
    "approval.requested", "approval.answered", "question.requested",
    "question.answered", "evidence.added", "checkpoint.restored",
    "computer.updated", "turn.interrupted", "turn.resumed", "error.raised"
  ];
  for (const eventType of eventTypes) {
    source.addEventListener(eventType, handleWorkspaceEvent);
  }
  source.onopen = () => {
    state.reconnectAttempts = 0;
    setConnection("connected", "연결됨");
  };
  source.onerror = () => {
    source.close();
    if (state.source === source) {
      setConnection("connecting", "재연결");
      const delay = Math.min(
        1000 * (2 ** state.reconnectAttempts),
        10000,
      );
      state.reconnectAttempts += 1;
      state.reconnectTimer = setTimeout(connectEvents, delay);
    }
  };
}

function commandId() {
  return `web-${crypto.randomUUID()}`;
}

async function sendCommand(type, payload) {
  const response = await api(
    `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}/commands`,
    {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        protocol_version: 1,
        command_id: commandId(),
        expected_cursor: state.cursor,
        type,
        payload,
        client_context: {surface: "web", view_id: "browser-1"},
      }),
    }
  );
  return response;
}

async function refreshLegacyPanels() {
  const [status, jobs, runs, agentRuns] = await Promise.all([
    api("/api/status"),
    api("/api/jobs"),
    api("/api/runs"),
    api("/api/agent-runs"),
  ]);
  let approvals = [];
  try {
    approvals = await api("/api/approvals");
  } catch (error) {
    if (error.status !== 403) throw error;
    announce(
      "승인 목록은 보안 토큰이 필요합니다 · birkin web의 bootstrap URL로 접속하세요."
    );
  }
  items = buildQueue(approvals, jobs, runs);
  for (const run of agentRuns.runs || []) {
    items.push({
      id: String(run.id),
      kind: "agent_run",
      title: run.task || run.id,
      ui_state: run.ui_state,
      detail: run.status || "",
      record: run,
    });
  }
  items.push({
    id: "runtime-status",
    kind: "status",
    title: status.daemon ? "데몬 연결" : "데몬 오프라인",
    ui_state: status.ui_state,
    detail: `${status.provider || ""} ${status.model || ""}`.trim(),
    record: status,
  });
  if (items.length && !items.some((item) => item.id === state.selectedId)) {
    state.selectedId = items[0].id;
  }
  renderPanel();
}

async function bootstrap() {
  setConnection("connecting", "연결 중");
  await loadContract();
  const sessions = await api("/api/workspace/sessions");
  const stored = localStorage.getItem("birkin.workspace.session");
  const preferred = stored || sessions[0]?.session_id
    || `web-${crypto.randomUUID()}`;
  const created = await api("/api/workspace/sessions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: preferred}),
  });
  state.sessionId = created.session_id;
  localStorage.setItem("birkin.workspace.session", state.sessionId);
  const snapshot = await api(
    `/api/workspace/sessions/${encodeURIComponent(state.sessionId)}/snapshot`
  );
  renderSnapshot(snapshot);
  await refreshLegacyPanels();
  connectEvents();
  announce("");
}

document.querySelectorAll("[data-panel]").forEach((tab) => {
  tab.addEventListener("click", () => {
    state.activePanel = tab.dataset.panel;
    document.querySelectorAll("[data-panel]").forEach((entry) => {
      entry.setAttribute("aria-selected", String(entry === tab));
    });
    shell.dataset.panelOpen = "true";
    renderPanel();
  });
});

byId("lens-toggle").addEventListener("click", () => {
  shell.dataset.panelOpen = String(shell.dataset.panelOpen !== "true");
});
mobileBack.addEventListener("click", () => {
  shell.dataset.panelOpen = "false";
  byId("lens-toggle").focus();
});
panelMore.addEventListener("click", () => {
  const atEnd = panelTabs.scrollLeft + panelTabs.clientWidth
    >= panelTabs.scrollWidth - 1;
  panelTabs.scrollTo({
    left: atEnd ? 0 : panelTabs.scrollLeft + panelTabs.clientWidth * 0.7,
    behavior: "auto",
  });
});
themeSelect.addEventListener("change", async () => {
  const contract = await api("/api/contract");
  applyWorkspaceTheme(contract, themeSelect.value);
});

byId("workspace-composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendButton.disabled = true;
  try {
    await sendCommand("chat.send", {text});
    input.value = "";
    localStorage.setItem("birkin.workspace.draft", "");
  } catch (error) {
    if (error.status === 409) await bootstrap();
    else announce(`전송 실패: ${error.message}`);
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.ctrlKey) {
    event.preventDefault();
    byId("workspace-composer").requestSubmit();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    if (shell.dataset.panelOpen === "true") {
      shell.dataset.panelOpen = "false";
      byId("lens-toggle").focus();
    } else {
      sendCommand("chat.interrupt", {}).catch((error) => announce(error.message));
    }
  }
});
input.addEventListener("input", () => {
  localStorage.setItem("birkin.workspace.draft", input.value);
});

byId("browser-aside-toggle").addEventListener("click", () => {
  if (shell.classList.contains("browser-open")) {
    collapseBrowserAside();
  } else {
    void openBrowserAside();
  }
});
byId("browser-aside-form").addEventListener("submit", (event) => {
  event.preventDefault();
  void navigateBrowserAside();
});

interruptButton.addEventListener("click", () => {
  sendCommand("chat.interrupt", {}).catch((error) => announce(error.message));
});
resumeButton.addEventListener("click", () => {
  sendCommand("chat.resume", {}).catch((error) => announce(error.message));
});

bootstrap().catch((error) => {
  setConnection("disconnected", "연결 실패");
  announce(`로컬 bootstrap URL로 다시 열어 주세요: ${error.message}`);
});
</script>
