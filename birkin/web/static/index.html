<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Birkin · Workspace</title>
<style>
  :root {
    --birkin-accent: Highlight;
    --birkin-border: GrayText;
    --birkin-border-accent: Highlight;
    --birkin-border-muted: GrayText;
    --birkin-text: CanvasText;
    --birkin-muted: GrayText;
    --birkin-dim: GrayText;
    --birkin-background: Canvas;
    --birkin-surface: Field;
    --birkin-surface-raised: ButtonFace;
    --birkin-focus-ring: Highlight;
    --birkin-success: LinkText;
    --birkin-warning: Highlight;
    --birkin-error: ActiveText;
    --birkin-info: LinkText;
    --birkin-pending: Highlight;
    --birkin-blocked: ActiveText;
    --birkin-action-needed: Highlight;
    --birkin-selected-bg: ButtonFace;
    --birkin-user-message-bg: Canvas;
    --birkin-assistant-message-bg: Canvas;
    --birkin-thinking-bg: Canvas;
    --birkin-tool-pending-bg: Canvas;
    --birkin-tool-success-bg: Canvas;
    --birkin-tool-error-bg: Canvas;
    --birkin-action-needed-bg: Canvas;
    --birkin-evidence-bg: Canvas;
    --birkin-composer-bg: Canvas;
    --background: var(--birkin-background);
    --surface: var(--birkin-surface);
    --surface-raised: var(--birkin-surface-raised);
    --border: var(--birkin-border);
    --border-muted: var(--birkin-border-muted);
    --accent: var(--birkin-accent);
    --text: var(--birkin-text);
    --muted: var(--birkin-muted);
    --dim: var(--birkin-dim);
    --success: var(--birkin-success);
    --warning: var(--birkin-warning);
    --error: var(--birkin-error);
    --info: var(--birkin-info);
    --pending: var(--birkin-pending);
    --focus-ring: var(--birkin-focus-ring);
    --composer-bg: var(--birkin-composer-bg);
    --radius: 14px;
    --space: clamp(12px, 2vw, 22px);
    --composer-reserved: 164px;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
      ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 34rem),
      var(--background);
    color: var(--text);
  }
  button, textarea { font: inherit; }
  button { color: inherit; }
  textarea::placeholder, input::placeholder {
    color: var(--muted);
    opacity: 1;
  }
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .workspace {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 11px var(--space);
    border-bottom: 1px solid var(--border-muted);
    background: color-mix(in srgb, var(--background) 90%, transparent);
    backdrop-filter: blur(18px);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .brand-mark { width: 40px; height: 40px; border-radius: 11px; object-fit: cover; align-self: center; }
  .brand strong { letter-spacing: .035em; }
  .brand span { color: var(--dim); font-size: .78rem; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .connection {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: .8rem;
    white-space: nowrap;
  }
  .connection::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--warning);
  }
  .connection[data-state="connected"]::before { background: var(--success); }
  .connection[data-state="disconnected"]::before { background: var(--error); }
  .icon-button {
    border: 1px solid var(--border-muted);
    border-radius: 9px;
    background: var(--surface);
    min-width: 38px;
    min-height: 36px;
    cursor: pointer;
  }
  .theme-select {
    min-height: 36px;
    border: 1px solid var(--border-muted);
    border-radius: 9px;
    color: var(--text);
    background: var(--surface);
  }

  .layout {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(290px, 34vw);
    gap: var(--space);
    padding: var(--space);
  }
  .conversation, .context-panel {
    min-height: 0;
    border: 1px solid var(--border-muted);
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    box-shadow: 0 18px 60px color-mix(in srgb, var(--background) 76%, transparent);
  }
  .conversation {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden;
  }
  .transcript {
    min-height: 0;
    overflow: auto;
    padding: clamp(18px, 3vw, 42px);
  }
  .empty {
    max-width: 44rem;
    margin: 12vh auto 0;
    color: var(--muted);
    text-align: center;
    line-height: 1.65;
  }
  .message {
    width: min(48rem, 92%);
    margin: 0 auto 18px;
    padding: 13px 16px;
    border-left: 2px solid var(--border);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: keep-all;
    line-height: 1.58;
  }
  .message[data-kind="user"] {
    border-left-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
  }
  .message[data-kind="assistant"] { border-left-color: var(--info); }
  .message[data-kind="tool"] {
    border-left-color: var(--pending);
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .84rem;
  }
  .message-meta {
    display: block;
    margin-bottom: 6px;
    color: var(--dim);
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .composer {
    margin: 0 clamp(12px, 3vw, 34px) clamp(12px, 3vw, 28px);
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--composer-bg);
    box-shadow: 0 12px 32px color-mix(in srgb, var(--background) 70%, transparent);
  }
  .composer textarea {
    width: 100%;
    min-height: 68px;
    max-height: 32vh;
    resize: vertical;
    border: 0;
    outline: 0;
    padding: 8px;
    color: var(--text);
    background: transparent;
    line-height: 1.5;
  }
  .composer-actions { display: flex; align-items: center; gap: 8px; }
  .composer-hint { flex: 1; color: var(--dim); font-size: .74rem; }
  .action {
    min-height: 36px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-raised);
    cursor: pointer;
  }
  .action.primary { border-color: var(--accent); color: var(--accent); }
  .action:disabled { cursor: not-allowed; opacity: .45; }

  .context-panel {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }
  .panel-navigation {
    display: flex;
    min-width: 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .panel-tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    gap: 4px;
    overflow-x: auto;
    padding: 9px;
    scrollbar-width: thin;
  }
  .panel-more {
    display: grid;
    place-items: center;
    flex: 0 0 44px;
    min-height: 44px;
    border: 0;
    border-left: 1px solid var(--border-muted);
    color: var(--muted);
    background: var(--surface);
    cursor: pointer;
  }
  .panel-navigation > .mobile-back { display: none; }
  .panel-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    min-height: 34px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: .76rem;
  }
  .panel-tab[aria-selected="true"] {
    border-color: var(--accent);
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 9%, transparent);
  }
  .panel-body { min-height: 0; overflow: auto; padding: 14px; }
  .panel-body .empty { margin: 48px auto 0; }
  .panel-heading { margin: 0 0 12px; font-size: .88rem; }
  .panel-item {
    width: 100%;
    margin: 0 0 8px;
    padding: 11px;
    border: 1px solid var(--border-muted);
    border-radius: 10px;
    background: var(--surface-raised);
    text-align: left;
  }
  .panel-item-title { color: var(--text); font-size: .83rem; }
  .panel-item-detail { margin-top: 5px; color: var(--dim); font-size: .74rem; }
  .panel-item[aria-current="true"] { border-color: var(--accent); }
  .approval-detail {
    display: grid;
    min-width: 0;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-raised);
  }
  .approval-fields { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; }
  .approval-fields dt { color: var(--dim); font-size: .72rem; }
  .approval-fields dd { margin: 0; color: var(--text); font-size: .78rem; }
  .approval-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .detail-output {
    min-width: 0;
    max-width: 100%;
    max-height: 24rem;
    overflow: auto;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-wrap;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid var(--border-muted);
    border-radius: 8px;
    background: var(--surface);
  }
  .receipt-details { min-width: 0; }
  .receipt-details summary {
    color: var(--muted);
    cursor: pointer;
    font-size: .78rem;
  }
  .receipt-details .detail-output { margin: 10px 0 0; }
  .run-events { list-style: none; margin: 0; padding: 0; }
  .run-events li { padding: 8px 0; border-bottom: 1px solid var(--border-muted); }
  .agent-roster { margin-top: 14px; }
  .agent-roster summary { color: var(--muted); cursor: pointer; font-size: .8rem; }
  .steer-input {
    flex: 1 1 16rem;
    min-width: 0;
    padding: 8px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .notice {
    position: fixed;
    left: 50%;
    bottom: calc(var(--composer-reserved) + 12px);
    z-index: 10;
    transform: translateX(-50%);
    max-width: min(90vw, 620px);
    max-height: min(30vh, 12rem);
    overflow: auto;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-raised);
    color: var(--muted);
    font-size: .78rem;
    pointer-events: none;
  }
  .notice:empty { display: none; }

  .browser-toggle {
    padding: 7px 11px;
    border: 1px solid var(--birkin-border-muted);
    border-radius: 9px;
    background: var(--birkin-surface);
    color: var(--birkin-text);
    cursor: pointer;
    white-space: nowrap;
  }
  .browser-toggle:focus-visible,
  .browser-url:focus-visible,
  .browser-go:focus-visible {
    outline-color: var(--birkin-focus-ring);
  }
  .browser-aside {
    display: none;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    grid-template-rows: auto auto minmax(0, 1fr);
    border-left: 1px solid var(--birkin-border-muted);
    border-radius: var(--radius);
    background: var(--birkin-surface);
  }
  .workspace.browser-open .layout {
    grid-template-columns: minmax(0, 1fr) minmax(360px, 40vw);
  }
  .workspace.browser-open .context-panel { display: none; }
  .workspace.browser-open .browser-aside { display: grid; }
  .browser-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 7px;
    padding: 9px;
    border-bottom: 1px solid var(--birkin-border-muted);
    background: var(--birkin-surface-raised);
  }
  .browser-url {
    min-width: 0;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--birkin-border-muted);
    border-radius: 8px;
    background: var(--birkin-background);
    color: var(--birkin-text);
  }
  .browser-go {
    padding: 7px 12px;
    border: 1px solid var(--birkin-accent);
    border-radius: 8px;
    background: var(--birkin-background);
    color: var(--birkin-text);
    cursor: pointer;
  }
  .browser-status {
    min-height: 2rem;
    margin: 0;
    padding: 6px 10px;
    color: var(--birkin-muted);
    font-size: .82rem;
    border-bottom: 1px solid var(--birkin-border-muted);
  }
  .browser-status[data-state="loading"] { color: var(--birkin-pending); }
  .browser-status[data-state="ready"] { color: var(--birkin-success); }
  .browser-status[data-state="warning"] { color: var(--birkin-warning); }
  .browser-status[data-state="blocked"] { color: var(--birkin-blocked); }
  .browser-status[data-state="error"] { color: var(--birkin-error); }
  .browser-state-glyph {
    display: inline-block;
    width: 1.25em;
    font-weight: 700;
  }
  .browser-status[data-state="error"] + .browser-viewport { display: none; }
  .browser-viewport {
    position: relative;
    min-height: 0;
    overflow: hidden;
    padding: 8px;
    background: var(--birkin-background);
  }
  .browser-canvas {
    position: absolute;
    inset: 8px;
    display: block;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    min-width: 0;
    min-height: 0;
    object-fit: contain;
    border: 1px solid var(--birkin-border-muted);
    background: var(--birkin-background);
  }
  .ledger { display: contents; }

  @media (max-width: 480px) {
    .topbar { gap: 6px; padding-inline: 10px; }
    .theme-select { max-width: 84px; padding-inline: 6px; }
    .connection { gap: 4px; font-size: .68rem; }
    .browser-toggle { padding-inline: 8px; font-size: .75rem; }
    .approval-fields { grid-template-columns: 1fr; }
    .approval-actions, .detail-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .approval-actions .steer-input,
    .detail-actions .steer-input { grid-column: 1 / -1; width: 100%; }
  }
  @media (max-width: 1023px) {
    .workspace.browser-open .layout {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(300px, 44dvh);
    }
    .workspace.browser-open .browser-aside {
      border-left: 0;
      border-top: 1px solid var(--birkin-border-muted);
    }
  }
  @media (max-width: 820px) {
    .icon-button,
    .action,
    .panel-tab,
    .theme-select {
      min-width: 44px;
      min-height: 44px;
    }
    .layout { grid-template-columns: minmax(0, 1fr); padding: 10px; }
    .context-panel {
      position: fixed;
      inset: auto 10px var(--composer-reserved);
      z-index: 5;
      height: min(48dvh, 440px);
      background: var(--surface);
      transform: translateY(
        calc(100% + var(--composer-reserved) + 24px)
      );
      transition: transform 170ms ease;
    }
    .workspace[data-panel-open="true"] .context-panel { transform: translateY(0); }
    .panel-navigation > .mobile-back { display: inline-flex; align-items: center; }
    .transcript { padding: 18px 12px 120px; }
    .composer { margin: 0 8px 8px; }
    .composer textarea { resize: none; }
    .brand span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto;
      transition-duration: 0.001ms;
      animation-duration: 0.001ms;
      animation-iteration-count: 1;
    }
  }

  /* Workspace redesign: navigation, focused work, and review stay distinct. */
  .layout { grid-template-columns: 224px minmax(0, 1fr) minmax(300px, 25vw); gap: 16px; }
  .work-nav {
    min-width: 0; overflow: auto; padding: 18px 12px;
    border: 1px solid var(--border-muted); border-radius: var(--radius);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
  }
  .work-nav h2, .work-nav h3 { margin: 0 8px 10px; }
  .work-nav h2 { font-size: 1rem; }
  .work-nav h3 { margin-top: 24px; color: var(--dim); font-size: .76rem; }
  .work-nav-list { display: grid; gap: 4px; }
  .work-nav-button {
    min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); text-align: left; cursor: pointer;
  }
  .work-nav-button[aria-current="page"] {
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--text); font-weight: 650;
  }
  .recent-work { display: grid; gap: 5px; }
  .recent-work .empty { margin: 8px; text-align: left; font-size: .8rem; }
  .conversation { grid-template-rows: auto minmax(0, 1fr) auto; }
  .workspace-heading {
    padding: 18px 24px 14px; border-bottom: 1px solid var(--border-muted);
  }
  .workspace-heading h1 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.6rem); }
  .workspace-heading p { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
  .message-content { display: block; }
  .message-content > :first-child { margin-top: 0; }
  .message-content > :last-child { margin-bottom: 0; }
  .message-content h1, .message-content h2, .message-content h3 {
    margin: 1.15em 0 .45em; line-height: 1.3;
  }
  .message-content h1 { font-size: 1.25rem; }
  .message-content h2 { font-size: 1.1rem; }
  .message-content h3 { font-size: 1rem; }
  .message-content p, .message-content ul, .message-content ol { margin: .55em 0; }
  .message-content pre { overflow: auto; padding: 12px; border-radius: 9px; background: var(--background); }
  .message-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .message-content a { color: var(--info); text-underline-offset: 3px; }
  .report-table-wrap { max-width: 100%; overflow-x: auto; margin: .75em 0; }
  .report-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .report-table th, .report-table td {
    padding: 8px 10px; border: 1px solid var(--border-muted); text-align: left;
  }
  .report-table th { background: var(--surface-raised); }
  .context-panel { box-shadow: none; }
  .panel-navigation { align-items: center; }
  .panel-tabs { flex-wrap: wrap; overflow: visible; }
  .panel-tabs .panel-tab:nth-of-type(n+4) { display: none; }
  .panel-tabs[data-expanded="true"] .panel-tab { display: inline-flex; }
  .panel-more { font-size: 0; }
  .panel-more::after { content: "더보기"; font-size: .76rem; }
  .stream-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .workspace[data-work-view="documents"] .conversation,
  .workspace[data-work-view="approvals"] .conversation { display: none; }
  .workspace[data-work-view="documents"] .context-panel,
  .workspace[data-work-view="approvals"] .context-panel {
    position: relative; inset: auto; grid-column: 2 / 4; width: auto; height: auto;
    transform: none; box-shadow: 0 18px 60px color-mix(in srgb, var(--background) 76%, transparent);
  }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 190px minmax(0, 1fr); }
    .context-panel {
      position: fixed; inset: 72px 12px 12px auto; z-index: 20;
      width: min(440px, calc(100vw - 24px)); height: auto;
      background: var(--surface); transform: translateX(calc(100% + 24px));
      transition: transform 170ms ease;
    }
    .workspace[data-panel-open="true"] .context-panel { transform: translateX(0); }
    .workspace[data-work-view="documents"] .context-panel,
    .workspace[data-work-view="approvals"] .context-panel {
      position: relative; inset: auto; grid-column: 2; width: auto; height: auto; transform: none;
    }
  }
  @media (max-width: 720px) {
    .topbar { flex-wrap: wrap; }
    .layout { grid-template-columns: minmax(0, 1fr); padding: 8px; }
    .work-nav {
      display: flex; align-items: center; overflow-x: auto; padding: 6px;
      border-radius: 11px;
    }
    .work-nav h2, .work-nav h3, .recent-work { display: none; }
    .work-nav-list { display: flex; min-width: max-content; }
    .work-nav-button { min-width: 76px; text-align: center; }
    .workspace-heading { padding: 14px 16px 12px; }
    .context-panel { inset: auto 8px 8px; width: auto; height: min(72dvh, 620px); transform: translateY(calc(100% + 16px)); }
    .workspace[data-panel-open="true"] .context-panel { transform: translateY(0); }
    .workspace[data-work-view="documents"] .context-panel,
    .workspace[data-work-view="approvals"] .context-panel { grid-column: 1; }
  }
  .workspace[data-work-view="research"] .composer { display: none; }
</style>
</head>
<body>
<div class="app">
<div id="workspace-shell" class="workspace" data-testid="workspace-shell"
     data-panel-open="false" data-work-view="conversation">
  <header class="topbar">

const viewTitle = byId("workspace-view-title");
const viewDescription = byId("workspace-view-description");
const streamStatus = byId("stream-status");
let browserFrameTimer = null;
const browserClientId = sessionStorage.getItem(

) || crypto.randomUUID();
sessionStorage.setItem("birkin-browser-client", browserClientId);
let browserControlSequence = Number(
  sessionStorage.getItem("birkin-browser-control-sequence") || 0
);
let browserSessionStart = null;

const APPROVAL_REFRESH_INTERVAL_MS = 30_000;
const state = {
  sessionId: null,
  cursor: 0,
  source: null,
  snapshot: null,
  activePanel: "tasks_runs",
  selectedId: null,
  pendingAssistant: new Map(),
  reconnectAttempts: 0,

  activeView: "conversation",
  panelReturnFocus: null,
  bootstrapGeneration: 0,
  switchingSession: false,
  agentRoster: null,
  steerDrafts: new Map(),
};

let items = [];
let uiEncoding = {};
const recentReceipts = new Map();
const busyApprovalIds = new Set();
const busyRunIds = new Set();
const unavailableLegacyPaths = new Set();
const approvalIdsByCommand = new Map();
const panelLabels = {
  tasks_runs: "작업 및 실행",
  approvals: "승인",
  files_evidence: "파일 및 근거",
  sessions_history: "세션 기록",

  computer_use: "컴퓨터 사용",
  settings_status: "설정 및 상태",
};
const statePresentations = {
  not_started: ["·", "시작 전"],
  running: ["▸", "실행 중"],
  pending: ["◇", "대기"],
  paused: ["∥", "일시정지"],
  succeeded: ["✓", "완료"],
  failed: ["✗", "실패"],
  blocked: ["⊘", "차단"],
  action_needed: ["◆", "조치 필요"],
  cancelled: ["⊘", "취소"],
  unknown: ["?", "불명"],
};
const attentionRanks = {
  action_needed: 0,
  failed: 1,
  blocked: 2,
  running: 3,
  pending: 4,
  paused: 5,
  not_started: 6,
  succeeded: 7,
  cancelled: 8,
  unknown: 9,
};
input.value = localStorage.getItem("birkin.workspace.draft") || "";

function updateComposerReserve() {
  const reserved = Math.ceil(composer.getBoundingClientRect().height + 24);
  shell.style.setProperty("--composer-reserved", `${reserved}px`);
}
const composerObserver = new ResizeObserver(updateComposerReserve);
composerObserver.observe(composer);
updateComposerReserve();

function announce(message) {
  queueNoticeElement.textContent = message;
}

async function browserJSON(url, method, payload) {
  const options = {
    method,
    cache: "no-store",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Birkin-Browser-Client": browserClientId,
    },
  };
  if (payload !== undefined) options.body = JSON.stringify(payload);
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error?.code || String(response.status));
    error.status = response.status;
    throw error;
  }
  return body;
}

function setBrowserStatus(text, statusState = "closed") {
  const node = byId("browser-aside-status");
  const glyphs = {
    closed: "○",
    loading: "◐",
    ready: "✓",
    warning: "!",
    blocked: "⊘",
    error: "×",
  };
  const glyph = document.createElement("span");
  glyph.className = "browser-state-glyph";
  glyph.setAttribute("aria-hidden", "true");
  glyph.textContent = glyphs[statusState] || glyphs.closed;
  const label = document.createElement("span");
  label.className = "browser-state-label";
  label.textContent = text;
  node.replaceChildren(glyph, label);
  node.dataset.state = statusState;
  node.setAttribute(
    "aria-live",
    statusState === "error" ? "assertive" : "polite",
  );
}

function browserStatusLabel(status) {
  const engine = status.engine === "chromium" ? "Chromium" : "Browser";
  const owners = {
    human: "사람 제어",
    agent: "에이전트 제어",
    tool: "도구 제어",
  };
  const owner = owners[status.control_owner_kind] || "제어권 대기";
  const readiness = status.frame_revision ? "준비" : "주소 대기";
  return `${engine} · ${readiness} · ${owner}`;
}

function resetBrowserFrame() {
  const canvas = byId("browser-aside-canvas");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.frameReady = "false";
  canvas.dataset.frameRevision = "0";
  canvas.dataset.frameDigest = "";
  canvas.dataset.frameRef = "";
  canvas.dataset.browserGeneration = "";
}

async function refreshBrowserFrame(status) {
  const canvas = byId("browser-aside-canvas");
  const generation = String(status.browser_generation);
  if (canvas.dataset.browserGeneration !== generation) {
    resetBrowserFrame();
    canvas.dataset.browserGeneration = generation;
  }
  if (!status.live || !status.frame_revision) return;
  const query = new URLSearchParams({
    generation,
    after: canvas.dataset.frameRevision || "0",
  });
  const response = await fetch("/api/browser-aside/frame?" + query, {
    cache: "no-store",
    credentials: "same-origin",
    headers: {"X-Birkin-Browser-Client": browserClientId},
  });
  if (response.status === 204) return;
  if (!response.ok) throw new Error("frame_" + response.status);
  const image = await createImageBitmap(await response.blob());
  canvas.width = image.width;
  canvas.height = image.height;
  canvas.getContext("2d").drawImage(image, 0, 0);
  image.close();
  canvas.dataset.frameReady = "true";
  canvas.dataset.frameRevision =
    response.headers.get("X-Birkin-Frame-Revision") || "0";
  canvas.dataset.frameDigest =
    response.headers.get("X-Birkin-Frame-Digest") || "";
  canvas.dataset.frameRef =
    response.headers.get("X-Birkin-Frame-Ref") || "";
  canvas.dataset.browserGeneration = generation;
  dispatchEvent(new CustomEvent("browser-aside-frame", {
    detail: {
      generation: status.browser_generation,
      revision: canvas.dataset.frameRevision,
    },
  }));
}

function stopBrowserFramePoll() {
  if (browserFrameTimer !== null) {
    clearTimeout(browserFrameTimer);
    browserFrameTimer = null;
  }
}

function scheduleBrowserFramePoll() {
  stopBrowserFramePoll();
  if (!shell.classList.contains("browser-open")) return;
  browserFrameTimer = setTimeout(async () => {
    try {
      const status = await browserJSON(
        "/api/browser-aside/status", "GET");
      if (!status.live) {
        setBrowserStatus("Chromium 연결 끊김", "warning");
        return;
      }
      await refreshBrowserFrame(status);
      setBrowserStatus(browserStatusLabel(status), "ready");
    } catch (error) {
      setBrowserStatus("화면 새로고침 필요", "warning");
    } finally {
      scheduleBrowserFramePoll();
    }
  }, 750);
}

async function startBrowserSession() {
  if (browserSessionStart === null) {
    browserSessionStart = browserJSON(
      "/api/browser-aside/session", "POST", {});
  }
  const request = browserSessionStart;
  try {
    return await request;
  } finally {
    if (browserSessionStart === request) {
      browserSessionStart = null;
    }
  }
}

async function openBrowserAside() {
  const aside = byId("browser-aside");
  const toggle = byId("browser-aside-toggle");
  shell.classList.add("browser-open");
  aside.setAttribute("aria-hidden", "false");
  toggle.setAttribute("aria-expanded", "true");
  toggle.textContent = "브라우저 접기";
  setBrowserStatus("Chromium 시작 중", "loading");
  try {
    const status = await startBrowserSession();
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
    scheduleBrowserFramePoll();
  } catch (error) {
    setBrowserStatus(
      error.status === 503
        ? "Chromium 설치: uv sync --extra browser && uv run playwright install chromium"
        : "브라우저를 시작하지 못했습니다",
      "error",
    );
  }
}

function collapseBrowserAside() {
  stopBrowserFramePoll();
  resetBrowserFrame();
  shell.classList.remove("browser-open");
  byId("browser-aside").setAttribute("aria-hidden", "true");
  byId("browser-aside-toggle").setAttribute("aria-expanded", "false");
  byId("browser-aside-toggle").textContent = "브라우저 열기";
}

async function navigateBrowserAside() {
  const url = byId("browser-aside-url").value.trim();
  if (!url) return;
  setBrowserStatus("페이지 이동 중", "loading");
  try {
    const current = await startBrowserSession();
    browserControlSequence += 1;
    sessionStorage.setItem(
      "birkin-browser-control-sequence",
      String(browserControlSequence),
    );
    const status = await browserJSON(
      "/api/browser-aside/navigate", "POST", {
        url,
        browser_generation: current.browser_generation,
        browser_revision: current.browser_revision,
        control_epoch: current.control_epoch,
        control_sequence: browserControlSequence,
      });
    setBrowserStatus(browserStatusLabel(status), "ready");
    await refreshBrowserFrame(status);
    scheduleBrowserFramePoll();
  } catch (error) {
    stopBrowserFramePoll();
    setBrowserStatus(
      error.status === 400
        ? "http 또는 https 주소만 사용할 수 있습니다"
        : "페이지를 열지 못했습니다",
      error.status === 400 ? "blocked" : "error",
    );
  }
}

function setConnection(value, label) {
  connection.dataset.state = value;
  connection.textContent = label;
}

function presentationFor(uiState) {
  const encoded = uiEncoding[uiState];
  if (encoded) return [encoded.glyph, encoded.label];
  return statePresentations[uiState] || statePresentations.unknown;
}

function attentionFor(uiState) {
  const encoded = uiEncoding[uiState];
  if (encoded) return Number(encoded.attention);
  return attentionRanks[uiState] ?? 99;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    cache: "no-store",
    credentials: "same-origin",
    ...options,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(String(payload.error || response.status));
    error.status = response.status;
    throw error;
  }
  return payload;
}

async function textApi(path, options = {}) {
  const response = await fetch(path, {
    cache: "no-store",
    credentials: "same-origin",
    ...options,
  });
  const payload = await response.text();
  if (!response.ok) {
    const error = new Error(payload || String(response.status));
    error.status = response.status;
    throw error;
  }
  return payload;
}

function applyWorkspaceTheme(contract, name) {
  const selected = contract.workspace_theme.palettes[name]
    ? name
    : contract.workspace_theme.default;
  const palette = contract.workspace_theme.palettes[selected];
  for (const [role, value] of Object.entries(palette)) {
    const variable = role.replace(/_/g, "-");
    document.documentElement.style.setProperty(
      `--birkin-${variable}`,
      value
    );
    document.documentElement.style.setProperty(`--${variable}`, value);
  }
  document.documentElement.dataset.theme = selected;
  document.documentElement.style.colorScheme =
    selected === "paper_light" ? "light" : "dark";
  themeSelect.value = selected;
  localStorage.setItem("birkin.workspace.theme", selected);
}

async function loadContract() {
  const contract = await api("/api/contract");
  uiEncoding = contract.uistate["x-birkin-encoding"];
  for (const [name, token] of Object.entries(contract.tokens.tokens)) {
    document.documentElement.style.setProperty(
      `--${name.replace(/_/g, "-")}`,
      token.hex
    );
  }
  const storedTheme = localStorage.getItem("birkin.workspace.theme");
  const preferredTheme = storedTheme || (
    window.matchMedia("(prefers-color-scheme: light)").matches
      ? "paper_light"
      : contract.workspace_theme.default
  );
  applyWorkspaceTheme(contract, preferredTheme);
  return contract;
}

function formatDuration(seconds) {
  if (typeof seconds !== "number" || !Number.isFinite(seconds) || seconds < 0) return "";
  const value = Math.floor(seconds);
  if (value < 60) return `${value}초`;
  const minutes = Math.floor(value / 60);
  if (minutes < 60) return `${minutes}분`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return minutes % 60 ? `${hours}시간 ${minutes % 60}분` : `${hours}시간`;
  return `${Math.floor(hours / 24)}일`;
}

function formatClock(iso) {
  const stamp = new Date(String(iso || "").replace(/(\.\d{3})\d+/, "$1"));
  if (!iso || Number.isNaN(stamp.getTime())) return "";
  return stamp.toLocaleTimeString("ko-KR");
}

function agentLabel(entry) {
  const name = String(entry?.agent || "");
  if (!name) return "";
  const title = String(entry.agent_title || name);
  return entry.agent_source === "user" ? `${title} (사용자 정의)` : title;
}

function resultPreview(text) {
  const line = String(text || "").split("\n")
    .map((entry) => entry.trim().replace(/^#{1,6}\s+/, ""))
    .find((entry) => entry && entry !== "(subagent returned no text)") || "";
  return line.length > 120 ? `${line.slice(0, 119)}…` : line;
}

function agentRunSummaryText(run) {
  const parts = [];
  const agent = agentLabel(run);
  if (agent) parts.push(agent);
  const elapsed = formatDuration(run.elapsed_seconds);
  if (run.runtime_status === "error") {
    parts.push("실행에 실패했습니다. 세부 정보에서 원인을 확인하세요.");
  } else if (run.runtime_status === "stale") {
    const silent = formatDuration(run.heartbeat_age);
    parts.push(silent ? `응답이 끊겼습니다 · 마지막 신호 ${silent} 전` : "응답이 끊겼습니다");
  } else if (run.terminal) {
    if (elapsed) parts.push(`${elapsed} 소요`);
    parts.push(resultPreview(run.result) || "결과 텍스트가 없습니다.");
  } else {
    if (elapsed) parts.push(`시작 후 ${elapsed}`);
    if (run.control_state === "blocked") parts.push("일시 중지됨");
    if (run.pending_approvals) parts.push(`승인 대기 ${run.pending_approvals}건`);
  }
  return parts.join(" · ");
}

function describeRunEvent(text) {
  const labels = {
    tool_start: "도구 실행 시작",
    tool_end: "도구 실행 완료",
    steer: "조정 지시 반영",
    warning: "경고",
    compact: "대화 압축",
    ooda_stall: "진행 정체 감지",
  };
  const raw = String(text || "").trim();
  const [head, ...rest] = raw.split(/\s+/);
  if (!Object.hasOwn(labels, head)) return raw;
  const detail = rest.join(" ");
  return detail ? `${labels[head]} · ${detail}` : labels[head];
}

function agentRunControls(run) {
  const labels = {steer: "조정 보내기", abort: "일시 중지", resume: "재개"};
  const allowed = Array.isArray(run?.controls) ? run.controls : [];
  return allowed
    .filter((action) => Object.hasOwn(labels, action))
    .map((action) => ({action, label: labels[action]}));
}

function agentRunItems(runs) {
  return (runs || []).map((run) => ({
    id: String(run.id),
    kind: "agent_run",
    title: run.task || "이름 없는 백그라운드 실행",
    ui_state: run.ui_state,
    detail: agentRunSummaryText(run),
    record: run,
  }));
}

function withoutShadowedAgentRuns(legacyItems, canonicalItems) {
  const runIds = legacyItems.filter((item) => item.kind === "agent_run")
    .map((item) => String(item.id || ""));
  if (!runIds.length) return canonicalItems;
  return canonicalItems.filter((item) => {
    const id = String(item.id || "");
    return !(typeof item.task === "string" && id.length >= 8
      && runIds.some((runId) => runId.startsWith(id)));
  });
}

function approvalRunContext(approval) {
  const run = approval?.agent_run;
  if (!run) return "";
  const agent = agentLabel(run) || "백그라운드";
  const task = String(run.task || "").trim();
  const shown = task.length > 60 ? `${task.slice(0, 59)}…` : task;
  return shown ? `${agent} · ‘${shown}’ 실행에서 요청` : `${agent} 실행에서 요청`;
}

function buildQueue(approvals, jobs, runs) {
  const queue = [];
  for (const approval of approvals || []) {
    const runAgent = agentLabel(approval.agent_run);
    queue.push({
      id: approval.id,
      kind: "approval",
      title: approval.title || approval.category_label || "승인 요청",
      ui_state: approval.ui_state,
      detail: approvalRunContext(approval) || approval.description || "",
      requester: approval.requester || approval.requested_by
        || (runAgent ? `${runAgent} 에이전트` : "Birkin"),
      target: approval.target || "",
      expected_impact: approval.expected_impact || approval.why
        || approval.description || "",
      rejection_result: approval.rejection_result
        || "요청한 동작은 실행되지 않습니다.",
      risk: approval.risk || approval.category || "",
      expires_at: approval.expires_at || approval.expires || "",
      related_evidence: approval.related_evidence || approval.evidence || "",
      agent_run: approval.agent_run || null,
      record: approval,
    });
  }
  for (const job of jobs?.jobs || []) {
    queue.push({
      id: `job:${job.id || job.name}`,
      kind: "cron",
      title: job.name || "예약 작업",
      ui_state: job.ui_state,
      detail: job.schedule?.display || job.next_run || "",
      record: job,
    });
  }
  for (const run of runs || []) {
    const error = run.details?.error || "";
    queue.push({
      id: `run:${run.id || run.created || queue.length}`,
      kind: "run",
      title: run.title || "백그라운드 실행",
      ui_state: run.ui_state,
      detail: error || run.status || "",
      record: run,
    });
  }
  return queue;
}

function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function messageNode(kind, text, id) {
  const article = document.createElement("article");
  article.className = "message";
  article.dataset.kind = kind;
  if (id) article.dataset.messageId = id;
  const meta = document.createElement("span");
  meta.className = "message-meta";
  meta.textContent = {
    user: "사용자",
    assistant: "Birkin",
    tool: "도구",
  }[kind] || "메시지";
  const content = document.createElement("div");
  content.className = "message-content";
  if (kind === "assistant") renderSafeMarkdown(content, text);
  else content.textContent = text;
  article.append(meta, content);
  return article;
}

function safeHttpURL(raw) {
  try {
    const url = new URL(raw);
    return ["http:", "https:"].includes(url.protocol) ? url.href : null;
  } catch (_error) {
    return null;
  }
}

function appendInlineText(target, text) {
  const pattern = /\[([^\]\n]+)\]\(([^\s<>]+)\)|https?:\/\/[^\s<>]+/g;
  let cursor = 0;
  for (const match of text.matchAll(pattern)) {
    target.append(document.createTextNode(text.slice(cursor, match.index)));
    const markdownLabel = match[1];
    const rawLink = match[2] || match[0];
    let trailing = match[0].match(/[.,;!?]+$/)?.[0] || "";
    if (markdownLabel) trailing = "";
    const withoutPunctuation = trailing ? rawLink.slice(0, -trailing.length) : rawLink;
    if (withoutPunctuation.endsWith(")")
        && (withoutPunctuation.match(/\(/g) || []).length
          < (withoutPunctuation.match(/\)/g) || []).length) trailing = `)${trailing}`;
    const candidate = trailing ? rawLink.slice(0, -trailing.length) : rawLink;
    const href = safeHttpURL(candidate);
    if (href) {
      const link = document.createElement("a");
      link.href = href;
      link.textContent = markdownLabel || candidate;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      target.appendChild(link);
      target.append(document.createTextNode(trailing));
    } else {
      target.append(document.createTextNode(markdownLabel || match[0]));
    }
    cursor = match.index + match[0].length;
  }
  target.append(document.createTextNode(text.slice(cursor)));
}

function tableCells(line) {
  return line.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
}

function renderSafeMarkdown(target, source) {
  target.replaceChildren();
  const lines = String(source || "").replace(/\r\n?/g, "\n").split("\n");
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    if (line.startsWith("```")) {
      const code = [];
      index += 1;
      while (index < lines.length && !lines[index].startsWith("```")) code.push(lines[index++]);
      if (index < lines.length) index += 1;
      const pre = document.createElement("pre");
      const node = document.createElement("code");
      node.textContent = code.join("\n");
      pre.appendChild(node);
      target.appendChild(pre);
      continue;
    }
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      const node = document.createElement(`h${heading[1].length}`);
      appendInlineText(node, heading[2]);
      target.appendChild(node);
      index += 1;
      continue;
    }
    if (line.includes("|") && index + 1 < lines.length
        && /^\s*\|?\s*:?-{3,}/.test(lines[index + 1])) {
      const wrap = document.createElement("div");
      wrap.className = "report-table-wrap";
      const table = document.createElement("table");
      table.className = "report-table";
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const value of tableCells(line)) {
        const cell = document.createElement("th");
        cell.scope = "col";
        appendInlineText(cell, value);
        headRow.appendChild(cell);
      }
      head.appendChild(headRow);
      table.appendChild(head);
      index += 2;
      const body = document.createElement("tbody");
      while (index < lines.length && lines[index].includes("|")) {
        const row = document.createElement("tr");
        for (const value of tableCells(lines[index++])) {
          const cell = document.createElement("td");
          appendInlineText(cell, value);
          row.appendChild(cell);
        }
        body.appendChild(row);
      }
      table.appendChild(body);
      wrap.appendChild(table);
      target.appendChild(wrap);
      continue;
    }
    const list = line.match(/^\s*([-*]|\d+\.)\s+(.+)$/);
    if (list) {
      const ordered = /\d+\./.test(list[1]);
      const node = document.createElement(ordered ? "ol" : "ul");
      while (index < lines.length) {
        const item = lines[index].match(/^\s*([-*]|\d+\.)\s+(.+)$/);
        if (!item || /\d+\./.test(item[1]) !== ordered) break;
        const row = document.createElement("li");
        appendInlineText(row, item[2]);
        node.appendChild(row);
        index += 1;
      }
      target.appendChild(node);
      continue;
    }
    if (line.trim()) {
      const paragraph = document.createElement("p");
      appendInlineText(paragraph, line);
      target.appendChild(paragraph);
    }
    index += 1;
  }
}

function appendMessage(kind, text, id) {
  const empty = byId("workspace-empty");
  if (empty) empty.remove();
  const followsOutput = isFollowingOutput();
  transcript.appendChild(messageNode(kind, text, id));
  if (followsOutput) transcript.scrollTop = transcript.scrollHeight;
}

function renderProgress(payload, eventId) {
  const progressId = String(payload.progress_id || eventId || "");
  const uiState = String(payload.ui_state || "pending");
  const followsOutput = isFollowingOutput();
  let article = [...transcript.querySelectorAll("[data-progress-id]")]
    .find((entry) => entry.dataset.progressId === progressId);
  if (!article) {
    const empty = byId("workspace-empty");
    if (empty) empty.remove();
    article = messageNode("진행", "", eventId);
    article.dataset.progressId = progressId;
    transcript.appendChild(article);
  }
  const presentation = presentationFor(uiState);
  article.querySelector(".message-meta").textContent =
    `${presentation[0]} ${presentation[1]}`;
  article.querySelector(".message-content").textContent =
    String(payload.summary || "진행 상황이 갱신되었습니다.");
  article.dataset.uiState = uiState;
  if (payload.office_phase) {
    article.dataset.officePhase = String(payload.office_phase);
  }
  if (followsOutput) transcript.scrollTop = transcript.scrollHeight;
}

function isFollowingOutput() {
  return (
    transcript.scrollHeight - transcript.clientHeight - transcript.scrollTop
  ) <= 24;
}

function renderSnapshot(snapshot) {
  state.snapshot = snapshot;
  state.cursor = Number(snapshot.cursor || state.cursor || 0);
  clearNode(transcript);
  const conversation = snapshot.conversation || [];
  if (!conversation.length) {
    const empty = document.createElement("p");
    empty.id = "workspace-empty";
    empty.className = "empty";
    empty.textContent = "메시지를 보내 대화를 시작하세요.";
    transcript.appendChild(empty);
  }
  for (const message of conversation) {
    const kind = message.kind === "user_message" ? "user" : "assistant";
    appendMessage(kind, String(message.text || ""), String(message.id || ""));
  }
  renderPanel();
}

async function refreshWorkspaceSnapshot() {
  const generation = state.bootstrapGeneration;
  const sessionId = state.sessionId;
  const snapshot = await api(
    `/api/workspace/sessions/${encodeURIComponent(sessionId)}/snapshot`
  );
  if (generation !== state.bootstrapGeneration || sessionId !== state.sessionId) return;
  state.snapshot = snapshot;
  renderPanel();
}

function approvalIsActionable(item) {
  const status = String(item.status || item.record?.status || "pending");
  return status === "pending";
}

function mergePanelItems(legacyItems, canonicalItems) {
  const merged = new Map(
    legacyItems.map((item) => [String(item.id || ""), item])
  );
  for (const item of canonicalItems) {
    const id = String(item.id || "");
    const previous = merged.get(id) || {};
    const combined = {...previous, ...item};
    if (previous.kind === "agent_run" && item.kind === "tasks_runs") {
      combined.kind = "agent_run";
    }
    if (
      previous.kind === "approval"
      && item.ui_state === "pending"
      && uiEncoding[previous.ui_state]
    ) {
      combined.ui_state = previous.ui_state;
    }
    merged.set(id, combined);
  }
  return [...merged.values()];
}

function updateApprovalTab() {
  const panel = (state.snapshot?.panels || [])
    .find((entry) => entry.key === "approvals");
  const approvalItems = mergePanelItems(
    items.filter((item) => item.kind === "approval"),
    panel?.items || [],
  );
  const waiting = approvalItems.filter(approvalIsActionable).length;
  const previousWaiting = state.approvalCount;
  state.approvalCount = waiting;
  byId("approval-tab").textContent = waiting ? `승인 · 대기 ${waiting}` : "승인";
  if (previousWaiting !== null && waiting > previousWaiting) {
    announce(`새 승인 요청 · 현재 대기 ${waiting}건`);
  }
}

function renderPanel() {
  const focusedItemId = panelBody.contains(document.activeElement)
    ? document.activeElement.closest("[data-item-id]")?.dataset.itemId
      || state.selectedId
    : null;
  updateApprovalTab();
  clearNode(panelBody);
  const heading = document.createElement("h2");
  heading.className = "panel-heading";
  heading.textContent = panelLabels[state.activePanel] || state.activePanel;
  panelBody.appendChild(heading);

  const panel = (state.snapshot?.panels || [])
    .find((entry) => entry.key === state.activePanel);
  let legacyItems = [];
  if (state.activePanel === "tasks_runs") {
    legacyItems = items.filter(
      (item) => ["run", "cron", "agent_run"].includes(item.kind)
    );
  } else if (state.activePanel === "approvals") {
    legacyItems = items.filter((item) => item.kind === "approval");
  } else if (state.activePanel === "activity_logs") {
    legacyItems = items;
  } else if (state.activePanel === "settings_status") {
    legacyItems = items.filter((item) => item.kind === "status");
  }
  let canonicalItems = panel?.items || [];
  if (["tasks_runs", "activity_logs"].includes(state.activePanel)) {
    canonicalItems = withoutShadowedAgentRuns(legacyItems, canonicalItems);
  }
  let panelItems = mergePanelItems(legacyItems, canonicalItems);
  panelItems = [...panelItems].sort((left, right) => {
    const leftRank = attentionFor(left.ui_state);
    const rightRank = attentionFor(right.ui_state);
    return leftRank - rightRank;
  });

  const taskPanel = state.activePanel === "tasks_runs";
  const runsUnavailable = taskPanel && unavailableLegacyPaths.has("/api/agent-runs");
  if (runsUnavailable) {
    const unavailable = document.createElement("p");
    unavailable.className = "panel-item-detail";
    unavailable.setAttribute("role", "status");
    unavailable.textContent = (
      "에이전트 실행 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요."
    );
    panelBody.appendChild(unavailable);
  }

  if (!panelItems.length) {
    if (!runsUnavailable) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = taskPanel
        ? "진행 중인 작업이나 에이전트 실행이 없습니다."
        : "현재 표시할 항목이 없습니다.";
      panelBody.appendChild(empty);
    }
    if (taskPanel) appendAgentRoster(false);
    return;
  }

  for (const item of panelItems) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "panel-item";
    button.dataset.itemId = String(item.id || "");
    button.setAttribute("aria-current", String(item.id === state.selectedId));
    const title = document.createElement("div");
    title.className = "panel-item-title";
    const presentation = presentationFor(item.ui_state);
    const glyph = document.createElement("span");
    glyph.className = "state-glyph";
    glyph.setAttribute("aria-hidden", "true");
    glyph.textContent = presentation[0];
    title.append(glyph, document.createTextNode(` ${presentation[1]} · ${
      String(
        item.title || item.summary || item.detail || "표시 이름 없는 항목"
      )
    }`));
    const detail = document.createElement("div");
    detail.className = "panel-item-detail";
    detail.textContent = String(item.detail || item.summary || "");
    button.append(title, detail);
    button.addEventListener("click", () => selectPanelItem(item));
    panelBody.appendChild(button);
  }
  const selected = panelItems.find((item) => item.id === state.selectedId);
  if (selected?.kind === "approval") appendApprovalDetail(selected);
  if (selected?.kind === "question") appendQuestionDetail(selected);
  if (selected?.kind === "checkpoint") appendCheckpointDetail(selected);
  if (selected?.kind === "agent" || selected?.kind === "agent_run") {
    appendAgentRunDetail(selected);
  }
  if (selected?.kind === "computer_use") appendComputerUseDetail(selected);
  if (selected?.kind === "status") appendStatusDetail(selected);
  if (taskPanel) {
    appendAgentRoster(panelItems.some((item) => item.kind === "agent_run"));
  }
  if (focusedItemId) {
    const replacement = [...panelBody.querySelectorAll("[data-item-id]")]
      .find((entry) => entry.dataset.itemId === focusedItemId);
    replacement?.focus({preventScroll: true});
  }
}

function selectPanelItem(item) {
  state.selectedId = item.id || null;
  renderPanel();
}

function showPanelItem(panelKey, itemId) {
  state.selectedId = itemId || null;
  const tab = workspacePanelTabs.find((entry) => entry.dataset.panel === panelKey);
  if (tab) activatePanelTab(tab);
  else renderPanel();
}

function appendAgentRoster(hasAgentRuns) {
  if (unavailableLegacyPaths.has("/api/agents")) {
    const failed = document.createElement("p");
    failed.className = "panel-item-detail";
    failed.setAttribute("role", "status");
    failed.textContent = "에이전트 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.";
    panelBody.appendChild(failed);
    return;
  }
  const roster = state.agentRoster;
  if (!roster) return;
  const agents = Array.isArray(roster.agents) ? roster.agents : [];
  const details = document.createElement("details");
  details.className = "agent-roster";
  details.open = !hasAgentRuns;
  const summary = document.createElement("summary");
  summary.textContent = `소환할 수 있는 에이전트 ${agents.length}명`;
  const guide = document.createElement("p");
  guide.className = "panel-item-detail";
  for (const [text, isCode] of [
    ["birkin chat", true],
    ["에서 ", false],
    ["/summon <에이전트> <할 일>", true],
    ["로 맡기거나 터미널에서 ", false],
    ["birkin summon", true],
    ["을 실행하세요. 시작한 실행은 이 패널에서 확인하고 조정할 수 있습니다.", false],
  ]) {
    const part = document.createElement(isCode ? "code" : "span");
    part.textContent = text;
    guide.appendChild(part);
  }
  const list = document.createElement("ul");
  list.className = "run-events";
  for (const agent of agents) {
    const row = document.createElement("li");
    const name = document.createElement("div");
    name.className = "panel-item-title";
    name.textContent = [
      String(agent.title || agent.name || ""),
      String(agent.name || ""),
      agent.source === "user" ? "사용자 정의" : "",
    ].filter(Boolean).join(" · ");
    const about = document.createElement("div");
    about.className = "panel-item-detail";
    about.textContent = [
      String(agent.description || ""),
      agent.max_turns ? `최대 ${agent.max_turns}턴` : "",
    ].filter(Boolean).join(" · ");
    row.append(name, about);
    list.appendChild(row);
  }
  details.append(summary, guide, list);
  const rejected = Number(roster.rejected_count) || 0;
  if (rejected > 0) {
    const warning = document.createElement("p");
    warning.className = "panel-item-detail";
    warning.textContent = (
      `사용자 정의 에이전트 정의 ${rejected}개를 불러오지 못했습니다. `
      + "터미널에서 birkin summon으로 이유를 확인하세요."
    );
    details.appendChild(warning);
  }
  panelBody.appendChild(details);
}

function appendDefinitions(target, definitions) {
  for (const [label, value] of definitions) {
    if (value == null || value === "") continue;
    const term = document.createElement("dt");
    term.textContent = label;
    const detail = document.createElement("dd");
    detail.textContent = String(value);
    target.append(term, detail);
  }
}

async function submitApproval(item, decision) {
  const approvalId = String(item.id || "");
  if (!approvalId || busyApprovalIds.has(approvalId)) return;
  busyApprovalIds.add(approvalId);
  renderPanel();
  try {
    await sendCommand("approval.answer", {
      approval_id: approvalId,
      decision,
    });
    announce("요청 전송 완료 · 권한 실행 계층 응답 대기");
  } catch (error) {
    busyApprovalIds.delete(approvalId);
    console.error("approval command failed", error);
    announce("승인 요청을 처리하지 못했습니다. 잠시 후 다시 시도하세요.");
    renderPanel();
  }
}

function appendApprovalDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "승인 세부 정보");
  const record = item.record || {};
  const risk = item.risk || record.risk;
  const riskLabel = risk ? ({
    low: "낮은 위험",
    medium: "보통 위험",
    high: "높은 위험",

  forkOutputText.className = "detail-output";

      );

    } catch (error) {
      console.error("checkpoint diff preview failed", error);
      status.textContent = (
        "차이 미리보기를 불러오지 못했습니다. 잠시 후 다시 시도하세요."
      );
    } finally {
      preview.disabled = false;
    }
  });
  restore.addEventListener("click", async () => {
    restore.disabled = true;
    try {
      const result = await api(
        `/api/checkpoints/${encodeURIComponent(item.id)}/restore`,
        {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            mode: mode.value,
            session_id: state.sessionId,
          }),

      );
      status.textContent = `복원 승인 대기: ${result.approval_id}`;

        throw new Error("명령은 문자열로만 구성된 JSON 배열이어야 합니다.");

      const result = await api(
        `/api/checkpoints/${encodeURIComponent(item.id)}/fork`,

    } finally {
      fork.disabled = false;
    }
  });

  section.append(
    summary, modeLabel, consequence, actions, forkActions, output, status,
    forkOutput
  );
  panelBody.appendChild(section);

function appendAgentRunDetail(item) {
  const section = document.createElement("section");
  section.className = "approval-detail";
  section.setAttribute("aria-label", "백그라운드 실행 세부 정보");
  section.setAttribute("aria-busy", "true");
  const loading = document.createElement("p");
  loading.textContent = "실행 세부 정보를 불러오는 중입니다...";
  section.appendChild(loading);
  panelBody.appendChild(section);

  api(`/api/agent-runs/${encodeURIComponent(item.id)}`).then((run) => {
    if (!section.isConnected) return;
    clearNode(section);
    section.setAttribute("aria-busy", "false");
    const heading = document.createElement("h3");
    heading.textContent = String(
      run.task || "이름 없는 백그라운드 실행"
    );
    const fields = document.createElement("dl");
    fields.className = "approval-fields";
    const presentation = presentationFor(run.ui_state);
    const agent = run.agent
      ? `${run.agent_title || run.agent} (${run.agent})`
        + (run.agent_source === "user" ? " · 사용자 정의" : "")
      : "";
    const pending = run.approvals || [];
    const silent = formatDuration(run.heartbeat_age);
    const showSignal = !run.terminal || run.runtime_status === "stale";
    appendDefinitions(fields, [
      ["상태", presentation[1]],
      ["에이전트", agent],
      [run.terminal ? "소요 시간" : "경과 시간", formatDuration(run.elapsed_seconds)],
      ["시작", formatClock(run.started_at)],
      ["마지막 신호", showSignal && silent ? `${silent} 전` : ""],
      ["대기 중인 승인", pending.length ? `${pending.length}건` : "없음"],
      ["실행 ID", run.id],
    ]);
    section.append(heading, fields);

    if (run.runtime_status === "error") {
      const failed = document.createElement("p");
      failed.textContent = "실행에 실패했습니다.";
      section.appendChild(failed);
      if (String(run.result || "").trim()) {
        const errorDetails = document.createElement("details");
        errorDetails.className = "receipt-details";
        const errorSummary = document.createElement("summary");
        errorSummary.textContent = "오류 세부 정보 보기";
        const errorText = document.createElement("pre");
        errorText.className = "detail-output";
        errorText.textContent = String(run.result);
        errorDetails.append(errorSummary, errorText);
        section.appendChild(errorDetails);
      }
    } else if (run.runtime_status === "stale") {
      const stale = document.createElement("p");
      stale.textContent = "응답이 끊겨 결과를 확인할 수 없습니다.";
      section.appendChild(stale);
    } else if (run.terminal) {
      const resultDetails = document.createElement("details");
      resultDetails.className = "receipt-details";
      resultDetails.open = true;
      const resultSummary = document.createElement("summary");
      resultSummary.textContent = "결과";
      const resultBody = document.createElement("div");
      resultBody.className = "message-content";
      if (resultPreview(run.result)) renderSafeMarkdown(resultBody, run.result);
      else resultBody.textContent = "결과 텍스트가 없습니다.";
      resultDetails.append(resultSummary, resultBody);
      section.appendChild(resultDetails);
    }

    if (pending.length) {
      const reviews = document.createElement("div");
      reviews.className = "detail-actions";
      for (const approval of pending) {
        const review = document.createElement("button");
        review.type = "button";
        review.className = "action";
        review.textContent = `승인 검토: ${approval.title || "승인 요청"}`;
        review.addEventListener("click", () => {
          showPanelItem("approvals", String(approval.id || ""));
        });
        reviews.appendChild(review);
      }
      section.appendChild(reviews);
    }

    const allowed = agentRunControls(run);
    if (allowed.length) {
      const controls = document.createElement("div");
      controls.className = "detail-actions";
      controls.dataset.runControls = String(run.id);
      let steering = null;
      for (const {action, label} of allowed) {
        if (action === "steer") {
          const input = document.createElement("input");
          input.className = "steer-input";
          input.setAttribute("aria-label", "실행 조정 지시");
          input.placeholder = "이 실행에 조정 지시 보내기...";
          input.value = state.steerDrafts.get(run.id) || "";
          input.addEventListener("input", () => {
            state.steerDrafts.set(run.id, input.value);
            input.removeAttribute("aria-invalid");
          });
          controls.appendChild(input);
          steering = input;
        }
        const draft = steering;
        const button = document.createElement("button");
        button.type = "button";
        button.className = action === "steer" ? "action" : "action primary";
        button.textContent = label;
        button.disabled = busyRunIds.has(run.id);
        button.addEventListener("click", () => {
          const text = action === "steer" ? draft.value.trim() : "";
          if (action === "steer" && !text) {
            announce("보낼 조정 지시를 입력하세요.");
            draft.setAttribute("aria-invalid", "true");
            draft.focus();
            return;
          }
          controlAgentRun(run.id, action, text).catch((error) => {
            console.error("agent run control failed", error);
            announce("실행 제어 요청에 실패했습니다. 잠시 후 다시 시도하세요.");
          });
        });
        controls.appendChild(button);
      }
      section.appendChild(controls);
      if (allowed.some((entry) => entry.action === "abort")) {
        const hint = document.createElement("p");
        hint.className = "panel-item-detail";
        hint.textContent = "일시 중지하면 다음 단계 전에 멈추고, 재개하면 이어서 진행합니다.";
        section.appendChild(hint);
      }
    }

    const progressHeading = document.createElement("h4");
    progressHeading.textContent = "진행";
    const events = document.createElement("ul");
    events.className = "run-events";
    for (const event of run.events || []) {
      const row = document.createElement("li");
      row.textContent = `${formatClock(event.at)} ${describeRunEvent(event.text)}`.trim();
      events.appendChild(row);
    }
    if (!events.children.length) {
      const empty = document.createElement("li");
      empty.textContent = "진행 이벤트가 아직 없습니다.";
      events.appendChild(empty);
    }
    section.append(progressHeading, events);
  }).catch((error) => {
    console.error("agent run detail unavailable", error);
    if (section.isConnected) {
      section.setAttribute("aria-busy", "false");
      loading.textContent = (
        "실행 세부 정보를 불러오지 못했습니다. 잠시 후 다시 시도하세요."
      );
    }
  });
}

async function controlAgentRun(runId, action, text = "") {
  if (busyRunIds.has(runId)) return;
  busyRunIds.add(runId);
  for (const button of panelBody.querySelectorAll("[data-run-controls] button")) {
    button.disabled = true;
  }
  const done = {
    steer: "조정 지시를 보냈습니다. 다음 단계에서 반영됩니다.",
    abort: "실행을 일시 중지했습니다. 다음 단계 전에 멈춥니다.",
    resume: "실행을 재개했습니다.",
  };
  let message = "";
  let status = 0;
  try {
    await api(`/api/agent-runs/${encodeURIComponent(runId)}/control`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action, text}),
    });
    if (action === "steer") state.steerDrafts.delete(runId);
    message = done[action] || "";
  } catch (error) {
    console.error("agent run control failed", error);
    status = Number(error.status) || 0;
  } finally {
    busyRunIds.delete(runId);
  }
  state.selectedId = runId;
  if (!message && status !== 409 && status !== 404) {
    renderPanel();
    announce("실행 제어 요청에 실패했습니다. 잠시 후 다시 시도하세요.");
    return;
  }
  let reloaded = true;
  try {
    await refreshLegacyPanels();
  } catch (error) {
    console.error("agent run refresh after control failed", error);
    reloaded = false;
    renderPanel();
  }
  if (status === 409) {
    message = "실행 상태가 이미 바뀌어 요청을 적용하지 않았습니다."
      + (reloaded ? " 최신 상태를 다시 불러왔습니다." : "");
  } else if (status === 404) {
    message = "실행 기록을 찾을 수 없습니다."
      + (reloaded ? " 목록을 새로 고쳤습니다." : "");
  } else if (!reloaded) {
    message += " 최신 상태는 잠시 후 다시 확인하세요.";
  }
  announce(message);
}
